<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Check it before someone else does</title>
<!-- trail-check-your-work.md in this folder is the words twin of this page. Built by /home/claude/s349s3/build_check_trail.py on the framework of the CST286 bird glide page. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    color-scheme:dark;
    --paper:#070D18; --card:#0E1726; --ink:#E6EDF5; --ink-soft:#93A4B8;
    --line:#22324A; --line-soft:#162236;
    --blaze:#F2B84B; --hero-ink:#050A13; --hero-cream:#F3EFE3;
    --tc:#5BB8F5; --tsoft:#10263B; --on-tc:#04101C;
    --ok:#5FD39A; --ok-soft:#0F2A22; --bad:#FF8A7A; --bad-soft:#33181A; --warn:#E3BD55; --warn-soft:#2B2410;
    --code:#162236; --stage:#040912;
    --weight:#6B3FC4; --lift:#0E8C80; --drag:#C46F00; --vel:#1B2533;
    --weight-l:#B996FF; --lift-l:#3FD3C2; --drag-l:#FFB347;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:"Atkinson Hyperlegible","Lato","Helvetica Neue",Arial,sans-serif; color:var(--ink); background:var(--paper); font-size:16px; line-height:1.6; -webkit-font-smoothing:antialiased; overflow-wrap:break-word}
  .page{max-width:1180px; margin:0 auto; padding:22px 22px 56px}
  @media (max-width:640px){ .page{padding:14px 12px 40px} }
  h1,h2,h3{font-family:Fraunces,Georgia,serif; text-wrap:balance; margin:0}
  a{color:var(--blaze)}
  p{margin:0 0 12px}
  code,.mono,.ro b,.formula{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace}
  a:focus-visible,button:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible,canvas:focus-visible{outline:3px solid var(--blaze); outline-offset:2px; border-radius:4px}
  .sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0)}
  .crumb{font-family:"IBM Plex Mono",monospace; font-size:.8rem; letter-spacing:.06em; margin-bottom:12px}
  .crumb a{color:var(--ink-soft); text-decoration:none}
  .crumb a:hover{color:var(--blaze); text-decoration:underline}

  .hero{position:relative; overflow:hidden; background:radial-gradient(1100px 420px at 78% 40%, #12314F 0%, #0A1626 45%, var(--hero-ink) 100%); color:var(--hero-cream); border:1px solid var(--line); border-radius:12px; padding:48px 44px 40px; display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr); gap:26px; align-items:center}
  .hero .eyebrow{color:var(--tc)}
  .hero h1{font-size:clamp(2.1rem,5.2vw,3.4rem); line-height:1.04; font-weight:650; margin:10px 0 16px}
  .hero h1 em{color:var(--blaze); font-style:italic; font-weight:500}
  .hero p{max-width:60ch; margin:0 0 10px; color:#C5D0DD; font-size:1.05rem}
  .heroart{width:100%; height:auto}
  .heroart .path{fill:none; stroke:var(--blaze); stroke-width:2.5; stroke-dasharray:4 10; stroke-linecap:round; animation:flow 1.4s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-28}}
  @media (max-width:820px){ .hero{grid-template-columns:1fr; padding:30px 20px} .heroart{max-width:420px} }
  .eyebrow,.lbl,.map-lbl{font-family:"IBM Plex Mono",monospace; font-size:.74rem; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-soft)}

  .map{margin:18px 0 20px; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px 14px}
  .map-row{display:flex; flex-wrap:wrap; gap:6px; margin-top:4px}
  .dot{display:flex; align-items:center; gap:6px; border:1px solid var(--line); background:var(--paper); color:var(--ink); border-radius:999px; padding:4px 11px 4px 5px; font:inherit; font-size:.86rem; cursor:pointer}
  .dot-n{display:inline-grid; place-items:center; width:22px; height:22px; border-radius:50%; background:var(--line-soft); font-family:"IBM Plex Mono",monospace; font-size:.74rem}
  .dot-n svg{width:11px; height:11px}
  .dot:hover{border-color:var(--tc)}
  .dot.done .dot-n{background:var(--ok); color:#04130C}
  .dot.cur{border-color:var(--tc); background:var(--tsoft); font-weight:700}
  .dot.cur .dot-n{background:var(--tc); color:var(--on-tc)}
  .dot.cur.done .dot-n{background:var(--ok); color:#04130C}
  .dot.locked{opacity:.5; cursor:not-allowed}
  .dot.locked:hover{border-color:var(--line)}
  .map-arrow{color:var(--ink-soft); align-self:center}
  .map-prog{margin-top:9px; font-size:.86rem; color:var(--ink-soft)}
  .reviewnote{display:inline-block; margin:0 0 12px; font-family:"IBM Plex Mono",monospace; font-size:.78rem; border:1px dashed var(--warn); color:var(--warn); border-radius:999px; padding:2px 12px}

  #stop{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:30px 34px 24px; scroll-margin-top:12px}
  @media (max-width:640px){ #stop{padding:20px 14px} }
  #stop h2{font-size:clamp(1.4rem,3.4vw,1.9rem); margin:4px 0 14px}
  h4.sub{font-family:Fraunces,Georgia,serif; font-size:1.02rem; margin:18px 0 8px}
  .step{border-top:1px solid var(--line); margin-top:20px; padding-top:16px}
  .row{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:12px 0}
  .endck{list-style:none; padding:0; margin:8px 0}
  .endck li{border:1px solid var(--line); border-radius:8px; padding:8px 12px; margin:6px 0}
  .endck li.ok{border-color:var(--ok)}
  .endmark{display:inline-block; font-size:.78rem; border:1px solid var(--line); border-radius:999px; padding:1px 9px; margin-left:6px; white-space:nowrap}
  .endck li.ok .endmark{border-color:var(--ok); color:var(--ok)}
  .endq{border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin:12px 0}
  .endq .ask{font-weight:600; margin:4px 0 8px}
  .endq textarea, .endtb textarea{width:100%; box-sizing:border-box}
  .endtb{border-top:1px dashed var(--line); margin-top:16px; padding-top:6px}
  .ts{margin:18px 0 0; padding:6px 0 0; border-top:1px dashed var(--line)}
  .ts-ta{width:100%; box-sizing:border-box; font:inherit; font-size:.85rem; line-height:1.4; padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:transparent; color:inherit}
  .btn{font:inherit; font-weight:700; border:1px solid var(--tc); background:var(--tc); color:var(--on-tc); border-radius:6px; padding:8px 15px; cursor:pointer}
  .btn.ghost{background:transparent; color:var(--ink); border-color:var(--line); font-weight:400}
  .btn:hover{filter:brightness(1.08)} .btn.ghost:hover{border-color:var(--tc)}
  .btn:disabled{opacity:.45; cursor:not-allowed}
  .muted{color:var(--ink-soft); font-size:.93rem}
  .guide{font-style:italic; color:var(--ink-soft)}
  .msg{border-radius:6px; padding:9px 13px; margin:10px 0}
  .msg:empty{display:none}
  .msg.ok{background:var(--ok-soft); border-left:4px solid var(--ok)}
  .msg.bad{background:var(--bad-soft); border-left:4px solid var(--bad)}
  .msg.warn{background:var(--warn-soft); border-left:4px solid var(--warn)}
  .msg.info{background:var(--tsoft); border-left:4px solid var(--tc)}
  .hint{background:var(--warn-soft); border-radius:6px; padding:9px 13px; margin:8px 0}
  .hint:empty{display:none}
  .editor{width:100%; font:inherit; font-size:.97rem; line-height:1.55; padding:12px 14px; border:1px solid var(--line); border-radius:10px; background:var(--stage); color:#DCE7F3; resize:vertical; caret-color:var(--blaze)}
  .navb{display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-top:24px; border-top:1px solid var(--line); padding-top:16px}
  .navwhy{margin-top:8px; text-align:right; min-height:1.2em}
  footer{margin-top:22px; font-size:.86rem; color:var(--ink-soft)}
  #stop.arrive{animation:arrive .45s ease-out}
  @keyframes arrive{from{opacity:0; transform:scale(.94)} to{opacity:1; transform:none}}
  .zooming{transition:transform .5s cubic-bezier(.6,0,.9,.5), opacity .5s ease-in; transform:scale(7); opacity:0}

  /* cards: predict, practice, explain */
  .q{border:1px solid var(--line); border-radius:10px; padding:6px 16px 10px; margin:16px 0; background:var(--paper)}
  .q > .lbl{margin-top:8px}
  .ask{font-size:1.05rem; margin:6px 0 10px}
  .opts{display:flex; flex-direction:column; gap:6px}
  .opt{font:inherit; text-align:left; border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:8px; padding:8px 12px; cursor:pointer; display:flex; gap:10px; align-items:baseline}
  .opt:hover{border-color:var(--tc)}
  .opt .k{font-family:"IBM Plex Mono",monospace; font-weight:600; color:var(--tc)}
  .opt.wrong{border-color:var(--bad); background:var(--bad-soft)}
  .opt.right{border-color:var(--ok); background:var(--ok-soft)}
  .opt.on{border-color:var(--tc); background:var(--tsoft)}
  .prow{display:flex; flex-wrap:wrap; gap:10px 14px; align-items:flex-end; margin:10px 0}
  .prow label{display:flex; flex-direction:column; gap:3px; font-size:.86rem; color:var(--ink-soft)}
  .num-in,.unit-in{font:inherit; padding:7px 9px; border:1px solid var(--ink-soft); border-radius:6px; background:var(--stage); color:var(--ink)}
  .num-in{width:120px; font-family:"IBM Plex Mono",monospace}
  .fb{border-left:4px solid var(--ok); background:var(--ok-soft); border-radius:0 8px 8px 0; padding:10px 14px; margin:10px 0}
  .fb h4.sub{margin:0 0 4px}
  .fb p{margin:6px 0 0; line-height:1.65}
  .formula{border:1px solid var(--blaze); background:#16130A; border-radius:8px; padding:12px 16px; margin:14px 0}
  .formula .f{font-size:1.06rem; color:var(--blaze)}
  .formula .live{margin-top:6px; color:var(--ink)}
  .formula .uc{margin-top:8px; color:var(--ink-soft); font-size:.88rem; font-family:"Atkinson Hyperlegible",sans-serif}
  details.wonder{margin:14px 0; border:1px dashed var(--line); border-radius:8px; padding:8px 14px}
  details.wonder summary{cursor:pointer; color:var(--tc); font-weight:600}
  details.wonder[open] summary{margin-bottom:6px}
  details.wonder .q{margin:8px 0}
  .peek{background:var(--warn-soft); border-radius:6px; padding:9px 13px; margin:10px 0 0}
  .wfig{margin:8px 0 4px} .wfig svg{width:100%; max-width:520px; height:auto; display:block}
  .wfig .wt{font:600 13px "Atkinson Hyperlegible",Arial,sans-serif} .wfig figcaption{font-size:.86rem; color:var(--ink-soft)}
  details.limits{margin:16px 0 0; border:1px solid var(--line); border-radius:8px; padding:8px 14px}
  details.limits summary{cursor:pointer; color:var(--tc)}
  details.limits p{margin:10px 0 4px}
  blockquote.mine{margin:8px 0 12px; border-left:4px solid var(--blaze); background:var(--paper); border-radius:0 8px 8px 0; padding:10px 14px; white-space:pre-wrap}

  /* simulations */
  .sim{background:var(--stage); border:1px solid var(--line); border-radius:10px; padding:10px; margin:14px 0}
  .simrow{display:flex; gap:10px; align-items:stretch}
  .canwrap{position:relative; flex:1; min-width:0}
  .canwrap canvas{display:block; width:100%; border-radius:8px; touch-action:pan-y}
  .vctl{display:flex; flex-direction:column; align-items:center; gap:4px; width:64px; flex:none}
  .vctl .vl{font-size:.74rem; color:var(--ink-soft); text-align:center; line-height:1.15}
  .vslider{writing-mode:vertical-lr; direction:rtl; flex:1; width:30px; min-height:150px; margin:4px 0; accent-color:var(--tc)}
  .vctl output{font-family:"IBM Plex Mono",monospace; font-size:.9rem}
  .banner{position:absolute; left:8px; right:8px; top:8px; background:rgba(150,26,38,.94); color:#fff; padding:8px 12px; border-radius:6px; font-weight:700; font-size:.95rem; line-height:1.35; box-shadow:0 4px 14px rgba(0,0,0,.35)}
  .simbar{display:flex; flex-wrap:wrap; gap:8px 14px; align-items:center; justify-content:space-between; margin-top:10px}
  .speeds{display:flex; flex-wrap:wrap; gap:6px}
  .segbtn{font:inherit; font-size:.88rem; border:1px solid var(--line); background:var(--paper); color:var(--ink); border-radius:999px; padding:4px 13px; cursor:pointer}
  .segbtn:hover{border-color:var(--tc)}
  .segbtn.on{background:var(--tc); border-color:var(--tc); color:var(--on-tc); font-weight:700}
  .readouts{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px; margin-top:10px}
  .ro{background:var(--card); border:1px solid var(--line); border-radius:6px; padding:6px 10px}
  .ro .lbl{display:block; font-size:.68rem}
  .ro b{font-size:1.08rem; font-weight:600}
  @media (max-width:560px){ .readouts{grid-template-columns:1fr 1fr} }
  .hsl{display:grid; grid-template-columns:120px minmax(0,1fr) 80px; gap:10px; align-items:center; margin:8px 0}
  .hsl input{width:100%; accent-color:var(--tc)}
  .hsl output{font-family:"IBM Plex Mono",monospace; text-align:right}
  @media (max-width:560px){ .hsl{grid-template-columns:1fr 86px} .hsl label{grid-column:1 / -1} }
  .gaugewrap{display:flex; flex-direction:column; align-items:center; width:92px; flex:none; gap:4px}
  .gauge{position:relative; flex:1; width:34px; min-height:180px; background:var(--paper); border:1px solid var(--line); border-radius:6px; overflow:visible}
  .gauge .fill{position:absolute; left:0; right:0; bottom:0; background:var(--lift-l); border-radius:0 0 5px 5px}
  .gauge .wline{position:absolute; left:-6px; right:-6px; height:0; border-top:3px solid var(--weight-l)}
  .gaugewrap .gv{font-family:"IBM Plex Mono",monospace; font-size:.85rem; color:var(--lift-l); text-align:center}
  .gaugewrap .gw{position:absolute; left:50%; transform:translate(-50%, -100%); margin-top:-4px; width:96px; font-size:.7rem; color:var(--weight-l); text-align:center; line-height:1.15; background:var(--stage); border-radius:4px; padding:1px 2px}
  .gauge .wlbl{position:absolute; left:50%; height:0}
  @media (max-width:560px){ .gaugewrap{width:62px} .gaugewrap .gw{width:62px; font-size:.64rem} .gauge{width:26px} }
  .legend{display:flex; flex-wrap:wrap; gap:6px 16px; margin:4px 2px 8px; font-size:.86rem; color:var(--ink-soft)}
  .legend span{display:inline-flex; align-items:center; gap:6px}
  .legend i{display:inline-block; width:24px; height:0; border-top:2px solid}
  .legend i.bold{border-top-width:4px}
  .legend button{font:inherit; color:inherit; display:inline-flex; align-items:center; gap:6px; background:none; border:1px dashed var(--line); border-radius:999px; padding:2px 10px; cursor:pointer}
  .legend button[aria-pressed="true"]{border-style:solid; background:var(--card); color:var(--ink)}
  .legend button[aria-pressed="false"] i{opacity:.45}
  .flt{border-collapse:collapse; margin:6px 0; font-size:.93rem; width:100%; max-width:640px}
  .flt th,.flt td{border:1px solid var(--line); padding:5px 10px; text-align:center}
  .flt th{background:var(--line-soft); font-weight:600}
  .flt .tick{color:var(--ok); font-weight:700}
  .tablewrap{overflow-x:auto}

  /* side trail */
  .choices{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:10px 0}
  @media (max-width:700px){ .choices{grid-template-columns:1fr} }
  .choice{display:flex; gap:10px; align-items:flex-start; border:1px solid var(--line); background:var(--paper); border-radius:8px; padding:10px 12px; cursor:pointer}
  .choice:hover{border-color:var(--tc)}
  .choice input{margin-top:5px; accent-color:var(--tc)}
  .choice.on{border-color:var(--tc); background:var(--tsoft)}
  .field{margin:10px 0}
  .field label{display:block; font-weight:700; margin-bottom:4px}

  /* teach-back conversation */
  .chat{display:flex; flex-direction:column; gap:8px; max-height:460px; overflow-y:auto; padding:12px; border:1px solid var(--line); border-radius:10px; background:var(--stage); margin:10px 0}
  .say{max-width:82%; padding:9px 13px; border-radius:12px; line-height:1.5}
  .say .who{display:block; font-size:.72rem; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft); margin-bottom:2px}
  .say.them{align-self:flex-start; background:var(--card); border:1px solid var(--line)}
  .say.me{align-self:flex-end; background:var(--tsoft); border:1px solid var(--tc)}
  .say.wait{color:var(--ink-soft); font-style:italic}

  /* copy my work to submit: stays on screen on every level */
  body{padding-bottom:84px}
  /* the button sits on its own strip, so nothing on the page is ever under it */
  html{scroll-padding-bottom:84px}   /* room for the strip that holds Copy my work, when the page scrolls to something */
  body.hasfab::after{content:''; position:fixed; left:0; right:0; bottom:0; height:70px; background:var(--paper); border-top:1px solid var(--line); z-index:39}
  #subfab[hidden]{display:none}
  @media (max-width:520px){ body #subfab{font-size:.85rem; line-height:1.3; padding:7px 14px; bottom:7px; max-width:calc(100vw - 36px)} }
  #subfab{position:fixed; right:18px; bottom:13px; z-index:40; border-radius:999px; padding:11px 20px; box-shadow:0 6px 22px rgba(0,0,0,.55)}
  #subbox{position:fixed; right:18px; bottom:74px; z-index:40; width:min(520px, calc(100vw - 36px)); max-height:70vh; overflow:auto; background:var(--card); border:1px solid var(--tc); border-radius:12px; padding:12px 14px; box-shadow:0 10px 34px rgba(0,0,0,.6)}
  #subfab.warn{background:var(--bad); border-color:var(--bad); color:#2A0B08}
  #subbox .editor{font-size:.8rem}
  .clearwrap{margin:16px 0 0; font-size:.88rem}
  .linkbtn{font:inherit; background:none; border:none; color:var(--ink-soft); text-decoration:underline; cursor:pointer; padding:2px 0}
  .linkbtn:hover{color:var(--bad)}
  .ai-helper{margin:18px 0 0; border:1px solid var(--line); border-radius:8px; padding:0 16px; font-size:.95rem; line-height:1.5; background:var(--card)}
  .ai-helper summary{cursor:pointer; padding:10px 0; font-weight:700}
  .ai-helper p{margin:0 0 12px}
  /* level 5: inside the simulation */
  .runner{margin:14px 0 6px}
  .runner iframe{display:block; width:100%; height:660px; border:1px solid var(--line); border-radius:10px; background:#fff}
  @media (max-width:1014px){ .runner iframe{height:1000px} }
  .parth{font-size:1.3rem; margin:2px 0 12px}
  .pmap{display:flex; flex-direction:column; gap:8px; margin:14px 0; padding:12px; border:1px solid var(--line); border-radius:10px; background:var(--stage)}
  .pgroup{border:1px dashed var(--line); border-radius:10px; padding:8px 10px 10px; display:flex; flex-direction:column; gap:8px}
  .pgroup.in{flex-direction:row; flex-wrap:wrap}
  .pgroup.in > .lbl{flex-basis:100%}
  .pbox{font:inherit; text-align:left; border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:8px; padding:8px 12px; cursor:pointer; display:flex; gap:8px; align-items:center; flex:none}
  .pgroup.in .pbox{flex:1 1 220px}
  .pbox:hover{border-color:var(--tc)}
  .pbox.cur{border-color:var(--tc); background:var(--tsoft); font-weight:700}
  .pbox.done .pn{background:var(--ok); color:#04130C}
  .pbox:disabled{opacity:.5; cursor:not-allowed}
  .pbox:disabled:hover{border-color:var(--line)}
  .pbox.fixed{cursor:default; color:var(--ink-soft); flex:none}
  .pbox.fixed:hover{border-color:var(--line)}
  .pn{display:inline-grid; place-items:center; width:22px; height:22px; border-radius:50%; background:var(--line-soft); font-family:"IBM Plex Mono",monospace; font-size:.74rem; flex:none}
  .pn svg{width:11px; height:11px}
  .split{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:10px; align-items:start}
  @media (max-width:860px){ .split{grid-template-columns:1fr} }
  .codep{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:4px}
  .cl{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:2px 12px; align-items:baseline; border:1px solid var(--line); border-left:4px solid var(--line); background:var(--card); border-radius:6px; padding:6px 10px}
  .cl.in{margin-left:18px}
  .cl code{font-size:.88rem; color:#DCE7F3; white-space:pre-wrap}
  .cl .val{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace; font-size:.9rem; color:var(--blaze); text-align:right; font-weight:600}
  .cl .gl{grid-column:1 / -1; font-size:.84rem; color:var(--ink-soft)}
  .cl.cur{border-left-color:var(--blaze); background:#16130A}
  .cl.head{border-style:dashed; background:transparent}
  .togs{display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin:10px 0 4px}
  .speeds .muted{align-self:center}
  .pzl{list-style:none; margin:8px 0; padding:0; display:flex; flex-direction:column; gap:6px}
  .pzi{display:flex; justify-content:space-between; gap:10px; align-items:center; border:1px solid var(--line); background:var(--card); border-radius:8px; padding:6px 8px 6px 12px; cursor:grab}
  .pzi code{font-size:.9rem; white-space:pre-wrap; min-width:0; overflow-wrap:anywhere}

<!-- Text sent with each "Get AI feedback" request. Not shown on the page. -->
<script type="text/plain" id="ai-system">
You are a teaching assistant for CST349, a course for computing students. The student is working through an interactive learning trail called 'Check it before someone else does'. They check a one-page project update, written by a student named Casey, against the request it answers and the table of numbers it reports on: first with one read, then with a list written from the request, then in three other ways (reading it as the person who receives it, following its steps, trying its numbers against the table). Before each check they write down what they expect to find, and the page then shows them what was there. At the last level they compare two prepared example replies from an AI assistant and decide which points of one of them are right. The student has written a short explanation in answer to one question. You will receive the question, private notes on what a sound explanation contains and on what the student sees at this stop, what the student has done on the page, and the student's explanation.

Write feedback addressed to the student as "you". Use plain words and 3 to 5 sentences. No headings, no lists.

First say what is right in the explanation, specifically, using a few of the student's own words. Then name the one most important gap or mistake in the reasoning, if there is one, and say what is missing without writing the missing part for them. Then ask one question that would lead them to it.

If the explanation is complete and correct, say so plainly, and ask one question that tests it in a nearby situation.

Never write the full correct explanation for the student. If the explanation is off the topic of the question, ask them to describe what they did on the page first. Do not praise in general terms.

- Never supply what the student left out or got wrong. Say which part does not hold up or is not there yet, and ask one question.
- Never tell the student which sentences have a fault, how many of their marks are right, or what kind of fault to look for, unless the notes for that stop say the page has already shown it.
- If you point to the page, point only to something the notes say is at that stop: the request, the table, the update, the student's list, the scoreboard, the two example replies. If the thing to look at is at another level, name that level.
- The two replies at Level 4 are prepared examples and are marked as examples. Do not speak as if you wrote them, and do not check the student's own work in their place.
- Plain text only: no asterisks, no markdown, no headings.
- Ask only about what the student has done up to this stop. The notes for a stop say what they have seen there; anything at a later level has not happened for them yet, so do not ask about it as if it had.
- You are not told which of the student's marks are right, and you must not guess. Never say or imply that a particular mark is a catch, a fault, right or wrong, unless the notes say the page has shown that sentence. If the student asks, say that the page shows it at Level 3.
- Before you say that something is missing, read the student's words again. If they have said it, in any words, treat it as there. Your one question may take their idea a step further; it must not ask for something they already wrote. The page asks for one or two sentences: do not ask for a complete account.
</script>
<script type="text/plain" id="ai-notes-ex1">
a sound explanation says something about reading as the writer or reading from memory of the request: the reader already has an idea of what the update is supposed to say and reads that idea, or did not put each sentence next to the request or the table. Common gaps: "I was not careful enough" with nothing about what careful would mean; blaming the update's length. At this stop the student sees the request, the table and the update with their own marks, and two counts. They have NOT been shown which sentences have faults. Do not name a sentence, a kind of fault or a place to look. They have made one read and nothing else: they have not written a list or checked in any other way yet, so ask only about the read. Before you call anything missing, find the student's own words on it: if they are there, in any wording, it is not missing.
</script>
<script type="text/plain" id="ai-notes-ex2">
a sound explanation connects a particular item to a particular result: for example, "my list said 'next steps' and not 'each next step has a person and a date', so sentence 11 passed", or "I had an item for the reason and it caught sentence 8". It says that an item has to be small enough to answer yes or no. Common gaps: restating that lists are useful; an item so broad that every update passes it. At this stop the student has been shown the faults in sentences 8 and 11 and the page's list of eight items. They have NOT been shown the other four. Do not name another sentence, a kind of fault not yet shown, or a place to look. Before you call anything missing, find the student's own words on it: if they are there, in any wording, it is not missing.
</script>
<script type="text/plain" id="ai-notes-ex3">
a sound explanation uses the student's own numbers and says in which direction they were off, or that they were close, and what they will do with that: for example check more than feels needed, or trust a list over a feeling. Common gaps: describing the update's faults instead of their own expectations; "I need to be more careful" with no number. A student whose expectations were close should say so; that is a sound answer too. At this stop the student has been shown all six faults, with their kinds, and their scoreboard. Before you call anything missing, find the student's own words on it: if they are there, in any wording, it is not missing.
</script>
<script type="text/plain" id="ai-notes-ex4">
a sound explanation has two parts: ask the checker to list faults or mismatches and give it what the work was supposed to do (the request, the rubric, the data), and check what it says before acting on it, because it can be wrong. Common gaps: only "use a better prompt"; only "do not trust AI"; nothing about handing over the request. At this stop the student sees Casey's second draft, two example replies marked as examples, and their three decisions with the page's answers. The replies are prepared examples; do not speak as if you wrote them. Before you call anything missing, find the student's own words on it: if they are there, in any wording, it is not missing.
</script>
<script type="text/plain" id="ai-plan-question">
The student is planning a short side trail of their own after finishing the learning trail. Their plan has three parts: which piece of work it is, their three checks, and how many things they expect the checks to find.
</script>
<script type="text/plain" id="ai-plan-notes">
a sound plan names one real piece of work, three checks that are things the student does with a result they can see, and a number they expect. Help the student sharpen the weakest of the three. Do not check their work for them and do not ask them to paste it. You do not see the student's work or any earlier check: never say what a check will find. Before you call anything missing, find the student's own words on it: if they are there, in any wording, it is not missing.
</script>

      }
      // a copy of the hero as the front page shows it: no ids, no Get started, no buttons of its own
      const c = hero.cloneNode(true);
      c.querySelectorAll('.s37go, .s38about, .s37hide, button').forEach(e => e.remove());
      [c].concat(Array.from(c.querySelectorAll('[id]'))).forEach(e => e.removeAttribute('id'));
      const body = panel.querySelector('.s38body'); body.innerHTML = ''; body.appendChild(c);
      y0 = window.scrollY; panel.hidden = false;
      panel.querySelector('#s38close').focus({preventScroll: true});
    }
    function close(){ if (!panel || panel.hidden) return; panel.hidden = true; if (btn) btn.focus({preventScroll: true}); window.scrollTo(0, y0); }   // the page stays where it was
    function init(){
      const hero = document.querySelector('.page > .hero, .hero'); if (!hero || document.getElementById('s38about')) return;
      btn = document.createElement('button'); btn.type = 'button'; btn.id = 's38about'; btn.className = 'btn ghost s38about'; btn.textContent = W38.about;
      btn.setAttribute('aria-haspopup', 'dialog');
      btn.onclick = open;
      hero.appendChild(btn);
    }
    setTimeout(init, 0);
  })();
  /* ---------- step 37: the front page, one level at a time, and the steps of a level (27 Nov 2026). Visibility and navigation only. ---------- */
  (function(){
    const CFG = {"main": "#stop", "map": "#map", "steps": "h3, h4.sub", "exclude": "details, .chat, .fb, .endq, .say, .vcards, .vcard, .layer, .work, .pmap, .quinn, .runner", "pin": ".work", "top": "nav.zoompath, .eyebrow, h2"};
    const W37 = {go: "Get started", back: "Back", next: "Next"};
    const M = () => document.querySelector(CFG.main);
    const lvl = () => (S.level);
    const isReview = () => !!(REVIEW);
    const short = () => { try { return String(LV[S.level].short || ''); } catch (e) { return ''; } };
    const st = {level: null, cur: 0, names: [], reached: {}, mode: 'auto', lastClick: 0, busy: false, row: null, nav: null, steps: []};
    const hid = new Set();
    const vis = el => !!el && !el.closest('.s37off');
    const name = h => Array.from(h.childNodes).map(n => n.textContent.trim()).filter(Boolean).join(' ').replace(/\s+/g, ' ');
    const isHead = (el, m) => el.matches(CFG.steps) && !(CFG.exclude && el.closest(CFG.exclude)) && m.contains(el);
    // the blocks of the level, in page order: a child that holds a step heading or a simulation is opened up, anything else is one block
    function blocks(m){
      const out = [];
      const heads = Array.from(m.querySelectorAll(CFG.steps)).filter(h => isHead(h, m));
      const pins = CFG.pin ? Array.from(m.querySelectorAll(CFG.pin)).filter(p => !p.parentElement.closest(CFG.pin)) : [];
      const walk = (e, cont) => Array.from(e.children).forEach(c => {
        if (c.id === 's37nav') return;
        if (heads.includes(c)) out.push({el:c, head:true, cont});
        else if (pins.includes(c)) out.push({el:c, pin:true, cont});
        else if (heads.some(h => c.contains(h)) || pins.some(p => c.contains(p))){ out.push({el:c, box:true, cont}); walk(c, c); }
        else out.push({el:c, cont});
      });
      walk(m, null);
      return out;
    }
    const meaningful = el => !!(el.textContent.trim() || el.querySelector('input,textarea,select,button,svg,canvas,iframe,img'));
    function compute(){
      const m = M(); if (!m || st.busy) return;
      st.busy = true;
      try {
        hid.forEach(e => e.classList.remove('s37off')); hid.clear();
        const B = blocks(m), lv = lvl();
        // the level's own head (where-you-are path, eyebrow, title) stays on every step
        let i0 = 0; while (i0 < B.length && !B[i0].cont && !B[i0].head && B[i0].el.matches(CFG.top)) { B[i0].top = true; i0++; }
        const steps = [];
        const firstHead = B.findIndex(b => b.head);
        const leadReal = firstHead > 0 && B.slice(0, firstHead).some(b => !b.top && !b.box && meaningful(b.el));
        if (leadReal) steps.push({name: short(), lead: true});
        B.forEach(b => { if (b.head) steps.push({name: name(b.el), el: b.el}); });
        let k = 0;
        B.forEach(b => { if (b.head) k = steps.findIndex(x => x.el === b.el); b.step = b.top ? -1 : k; });
        const names = steps.map(s => s.name), n = Math.max(1, steps.length);
        const fresh = st.level !== lv;
        if (fresh){
          st.level = lv;
          if (isReview() || st.mode === 'next' || n === 1) st.cur = 0;
          else {   // the first step with an empty box to fill in; otherwise the last step the page shows
            let c = -1;
            for (let s = 0; s < n && c < 0; s++){ if (B.some(b => b.step === s && !b.box && Array.from(b.el.matches('textarea,input') ? [b.el] : b.el.querySelectorAll('textarea, input[type=text], input:not([type])')).some(t => !t.disabled && !t.readOnly && !t.value.trim() && !t.closest('details')))) c = s; }
            st.cur = c < 0 ? n - 1 : c;
          }
          st.mode = 'auto';
          st.reached[lv] = st.cur;
        } else {
          // a step the page has just revealed after a button press: go to it
          const added = names.map((x, s) => st.names.includes(x) ? -1 : s).filter(s => s > st.cur);
          if (added.length && Date.now() - st.lastClick < 2500){ st.cur = added[0]; window.scrollTo(0, 0); }
          st.cur = Math.min(st.cur, n - 1);
        }
        st.names = names; st.steps = steps;
        st.reached[lv] = Math.max(st.reached[lv] || 0, st.cur);
        if (n > 1){
          const keep = new Set();
          B.forEach(b => { if (b.top || b.box) return; if (b.step === st.cur || (b.pin && b.step <= st.cur)) keep.add(b.el); else { b.el.classList.add('s37off'); hid.add(b.el); } });
          // a container whose blocks are all hidden is hidden too
          B.filter(b => b.box).reverse().forEach(b => { if (!B.some(x => x.cont === b.el && !hid.has(x.el))) { b.el.classList.add('s37off'); hid.add(b.el); } });
        }
        drawRow(n);
      } finally { st.busy = false; }
    }
    function toStep(s){ st.cur = s; st.reached[st.level] = Math.max(st.reached[st.level] || 0, s); compute(); window.scrollTo(0, 0); }
    function drawRow(n){
      const m = M(), map = document.querySelector(CFG.map);
      if (!st.row){ st.row = document.createElement('nav'); st.row.id = 's37steps'; st.row.setAttribute('aria-label', 'Steps'); }
      if (map && st.row.previousElementSibling !== map) map.insertAdjacentElement('afterend', st.row);
      if (!st.nav){ st.nav = document.createElement('div'); st.nav.id = 's37nav'; }
      if (m && st.nav.previousElementSibling !== m) m.insertAdjacentElement('afterend', st.nav);
      const front = document.body.classList.contains('s37front');
      if (n < 2 || front){ st.sig = null; st.row.hidden = true; st.nav.hidden = true; st.row.innerHTML = ''; st.nav.innerHTML = ''; return; }
 const reached = st.reached[st.level] || 0;
      const sig = JSON.stringify([st.level, st.cur, reached, st.names, isReview()]);
      if (st.sig === sig && !st.row.hidden) return;   // nothing changed: the buttons stay as they are
      st.sig = sig;
      st.row.hidden = false;
      st.row.innerHTML = st.names.map((x, s) => { const open = isReview() || s <= reached || s === st.cur;
        return '<button type="button" class="s37dot' + (s === st.cur ? ' cur' : '') + (s < st.cur ? ' past' : '') + '" data-s37="' + s + '"' + (open ? '' : ' disabled') + (s === st.cur ? ' aria-current="step"' : '') + '>' + x.replace(/[&<>"]/g, c => ({'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;'}[c])) + '</button>'; }).join('');
      st.row.querySelectorAll('[data-s37]').forEach(b => b.onclick = () => { if (!b.disabled) toStep(+b.dataset.s37); });
      const last = st.cur >= n - 1;
      st.nav.hidden = last && st.cur === 0;
      st.nav.innerHTML = (st.cur > 0 ? '<button type="button" class="btn ghost" id="s37back">&larr; ' + W37.back + '</button>' : '<span></span>') +
        (last ? '' : '<button type="button" class="btn" id="s37next">' + W37.next + ' &rarr;</button>');
      const bb = st.nav.querySelector('#s37back'); if (bb) bb.onclick = () => toStep(st.cur - 1);
      const nb = st.nav.querySelector('#s37next'); if (nb) nb.onclick = () => toStep(st.cur + 1);
    }
    // the front page and the level view
    function front(on){
      document.body.classList.toggle('s37front', on); document.body.classList.toggle('s37stage', !on);
      const hero = document.querySelector('.hero');
      if (on && hero && !document.getElementById('s37go')){
        const w = document.createElement('div'); w.className = 's37go'; w.innerHTML = '<button type="button" class="btn" id="s37go">' + W37.go + '</button>';
        (hero.firstElementChild || hero).appendChild(w);
        document.getElementById('s37go').onclick = () => { front(false); st.mode = 'next'; st.level = null; go(S.level); window.scrollTo(0, 0); compute(); };
      }
      const g = document.getElementById('s37go'); if (g) g.parentElement.hidden = !on;
      if (CFG.hideAlways) document.querySelectorAll(CFG.hideAlways).forEach(e => e.classList.add('s37hide'));
      drawRow(st.steps.length);
    }
    // the page's go and render, wrapped: moving to another level starts at its top, and its steps are worked out again
    const go0 = go;
    go = function(){ const before = lvl(); const r = go0.apply(this, arguments); const after = lvl(); if (after !== before){ st.mode = (typeof after === 'number' && typeof before === 'number' && after === before + 1) ? 'next' : 'auto'; st.level = null; window.scrollTo(0, 0); } compute(); return r; };
    const render0 = render;
    render = function(){ const r = render0.apply(this, arguments); compute(); return r; };
    function init(){
      const m = M(); if (!m) return;
      document.addEventListener('click', e => { if (e.target && e.target.closest && e.target.closest('button') && M() && M().contains(e.target)) st.lastClick = Date.now(); }, true);
      let q = false;
      // changes inside a simulation (its readouts move every frame) do not change the steps
      const inPin = r => { const t = r.target.nodeType === 1 ? r.target : r.target.parentElement; return !!(CFG.pin && t && t.closest && t.closest(CFG.pin)); };
      new MutationObserver(recs => { if (st.busy || q || recs.every(inPin)) return; q = true; Promise.resolve().then(() => { q = false; compute(); }); }).observe(m, {childList:true, subtree:true});
      front(!isReview() && !!((() => { try { const r = localStorage.getItem(KEY); return r === null || r === JSON.stringify(fresh()); } catch (e) { return false; } })()));
      compute();
    }
    // for automated checks: show the step that holds an element
    window.__s37 = {state: () => ({cur: st.cur, names: st.names.slice(), level: st.level}), toStep, front,
      reveal: sel => { const e = document.querySelector(sel); if (!e || vis(e)) return !!e; for (let k = 0; k < st.names.length; k++){ toStep(k); if (vis(e)) return true; } return false; }};
    setTimeout(init, 0);
  })();
  /* ---------- start ---------- */
  const fromHash = () => LV.findIndex(l => l.id === (location.hash || '').slice(1));
  const hi = fromHash(); if (hi >= 0 && unlocked(hi)) S.level = hi;
  if (!(S.level >= 0 && S.level < LV.length) || !unlocked(S.level)) S.level = 0;
  window.addEventListener('hashchange', () => { const i = fromHash(); if (i >= 0 && i !== S.level) go(i); });
  render();
})();
</script>
