<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One step after another</title>
<!-- trail-one-step-after-another.md in this folder is the words twin of this page. Built by /home/claude/s349s1/build_one_step.py on the framework of the CST286 bird glide page. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    color-scheme:dark;
    --paper:#070D18; --card:#0E1726; --ink:#E6EDF5; --ink-soft:#93A4B8;
    --line:#22324A; --line-soft:#162236;
    --blaze:#F2B84B; --hero-ink:#050A13; --hero-cream:#F3EFE3;
    --tc:#5BB8F5; --tsoft:#10263B; --on-tc:#04101C;
    --ok:#5FD39A; --ok-soft:#0F2A22; --bad:#FF8A7A; --bad-soft:#33181A; --warn:#E3BD55; --warn-soft:#2B2410;
    --code:#162236; --stage:#040912;
    --weight:#6B3FC4; --lift:#0E8C80; --drag:#C46F00; --vel:#1B2533;
    --weight-l:#B996FF; --lift-l:#3FD3C2; --drag-l:#FFB347;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:"Atkinson Hyperlegible","Lato","Helvetica Neue",Arial,sans-serif; color:var(--ink); background:var(--paper); font-size:16px; line-height:1.6; -webkit-font-smoothing:antialiased; overflow-wrap:break-word}
  .page{max-width:1180px; margin:0 auto; padding:22px 22px 56px}
  @media (max-width:640px){ .page{padding:14px 12px 40px} }
  h1,h2,h3{font-family:Fraunces,Georgia,serif; text-wrap:balance; margin:0}
  a{color:var(--blaze)}
  p{margin:0 0 12px}
  code,.mono,.ro b,.formula{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace}
  a:focus-visible,button:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible,canvas:focus-visible{outline:3px solid var(--blaze); outline-offset:2px; border-radius:4px}
  .sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0)}
  .crumb{font-family:"IBM Plex Mono",monospace; font-size:.8rem; letter-spacing:.06em; margin-bottom:12px}
  .crumb a{color:var(--ink-soft); text-decoration:none}
  .crumb a:hover{color:var(--blaze); text-decoration:underline}

  .hero{position:relative; overflow:hidden; background:radial-gradient(1100px 420px at 78% 40%, #12314F 0%, #0A1626 45%, var(--hero-ink) 100%); color:var(--hero-cream); border:1px solid var(--line); border-radius:12px; padding:48px 44px 40px; display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr); gap:26px; align-items:center}
  .hero .eyebrow{color:var(--tc)}
  .hero h1{font-size:clamp(2.1rem,5.2vw,3.4rem); line-height:1.04; font-weight:650; margin:10px 0 16px}
  .hero h1 em{color:var(--blaze); font-style:italic; font-weight:500}
  .hero p{max-width:60ch; margin:0 0 10px; color:#C5D0DD; font-size:1.05rem}
  .heroart{width:100%; height:auto}
  .heroart .path{fill:none; stroke:var(--blaze); stroke-width:2.5; stroke-dasharray:4 10; stroke-linecap:round; animation:flow 1.4s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-28}}
  @media (max-width:820px){ .hero{grid-template-columns:1fr; padding:30px 20px} .heroart{max-width:420px} }
  .eyebrow,.lbl,.map-lbl{font-family:"IBM Plex Mono",monospace; font-size:.74rem; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-soft)}

  .map{margin:18px 0 20px; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px 14px}
  .map-row{display:flex; flex-wrap:wrap; gap:6px; margin-top:4px}
  .dot{display:flex; align-items:center; gap:6px; border:1px solid var(--line); background:var(--paper); color:var(--ink); border-radius:999px; padding:4px 11px 4px 5px; font:inherit; font-size:.86rem; cursor:pointer}
  .dot-n{display:inline-grid; place-items:center; width:22px; height:22px; border-radius:50%; background:var(--line-soft); font-family:"IBM Plex Mono",monospace; font-size:.74rem}
  .dot-n svg{width:11px; height:11px}
  .dot:hover{border-color:var(--tc)}
  .dot.done .dot-n{background:var(--ok); color:#04130C}
  .dot.cur{border-color:var(--tc); background:var(--tsoft); font-weight:700}
  .dot.cur .dot-n{background:var(--tc); color:var(--on-tc)}
  .dot.cur.done .dot-n{background:var(--ok); color:#04130C}
  .dot.locked{opacity:.5; cursor:not-allowed}
  .dot.locked:hover{border-color:var(--line)}
  .map-arrow{color:var(--ink-soft); align-self:center}
  .map-prog{margin-top:9px; font-size:.86rem; color:var(--ink-soft)}
  .reviewnote{display:inline-block; margin:0 0 12px; font-family:"IBM Plex Mono",monospace; font-size:.78rem; border:1px dashed var(--warn); color:var(--warn); border-radius:999px; padding:2px 12px}

  #stop{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:30px 34px 24px; scroll-margin-top:12px}
  @media (max-width:640px){ #stop{padding:20px 14px} }
  #stop h2{font-size:clamp(1.4rem,3.4vw,1.9rem); margin:4px 0 14px}
  h4.sub{font-family:Fraunces,Georgia,serif; font-size:1.02rem; margin:18px 0 8px}
  .step{border-top:1px solid var(--line); margin-top:20px; padding-top:16px}
  .row{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:12px 0}
  .endck{list-style:none; padding:0; margin:8px 0}
  .endck li{border:1px solid var(--line); border-radius:8px; padding:8px 12px; margin:6px 0}
  .endck li.ok{border-color:var(--ok)}
  .endmark{display:inline-block; font-size:.78rem; border:1px solid var(--line); border-radius:999px; padding:1px 9px; margin-left:6px; white-space:nowrap}
  .endck li.ok .endmark{border-color:var(--ok); color:var(--ok)}
  .endq{border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin:12px 0}
  .endq .ask{font-weight:600; margin:4px 0 8px}
  .endq textarea, .endtb textarea{width:100%; box-sizing:border-box}
  .endtb{border-top:1px dashed var(--line); margin-top:16px; padding-top:6px}
  .ts{margin:18px 0 0; padding:6px 0 0; border-top:1px dashed var(--line)}
  .ts-ta{width:100%; box-sizing:border-box; font:inherit; font-size:.85rem; line-height:1.4; padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:transparent; color:inherit}
  .btn{font:inherit; font-weight:700; border:1px solid var(--tc); background:var(--tc); color:var(--on-tc); border-radius:6px; padding:8px 15px; cursor:pointer}
  .btn.ghost{background:transparent; color:var(--ink); border-color:var(--line); font-weight:400}
  .btn:hover{filter:brightness(1.08)} .btn.ghost:hover{border-color:var(--tc)}
  .btn:disabled{opacity:.45; cursor:not-allowed}
  .muted{color:var(--ink-soft); font-size:.93rem}
  .guide{font-style:italic; color:var(--ink-soft)}
  .msg{border-radius:6px; padding:9px 13px; margin:10px 0}
  .msg:empty{display:none}
  .msg.ok{background:var(--ok-soft); border-left:4px solid var(--ok)}
  .msg.bad{background:var(--bad-soft); border-left:4px solid var(--bad)}
  .msg.warn{background:var(--warn-soft); border-left:4px solid var(--warn)}
  .msg.info{background:var(--tsoft); border-left:4px solid var(--tc)}
  .hint{background:var(--warn-soft); border-radius:6px; padding:9px 13px; margin:8px 0}
  .hint:empty{display:none}
  .editor{width:100%; font:inherit; font-size:.97rem; line-height:1.55; padding:12px 14px; border:1px solid var(--line); border-radius:10px; background:var(--stage); color:#DCE7F3; resize:vertical; caret-color:var(--blaze)}
  .navb{display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-top:24px; border-top:1px solid var(--line); padding-top:16px}
  .navwhy{margin-top:8px; text-align:right; min-height:1.2em}
  footer{margin-top:22px; font-size:.86rem; color:var(--ink-soft)}
  #stop.arrive{animation:arrive .45s ease-out}
  @keyframes arrive{from{opacity:0; transform:scale(.94)} to{opacity:1; transform:none}}
  .zooming{transition:transform .5s cubic-bezier(.6,0,.9,.5), opacity .5s ease-in; transform:scale(7); opacity:0}

  /* cards: predict, practice, explain */
  .q{border:1px solid var(--line); border-radius:10px; padding:6px 16px 10px; margin:16px 0; background:var(--paper)}
  .q > .lbl{margin-top:8px}
  .ask{font-size:1.05rem; margin:6px 0 10px}
  .opts{display:flex; flex-direction:column; gap:6px}
  .opt{font:inherit; text-align:left; border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:8px; padding:8px 12px; cursor:pointer; display:flex; gap:10px; align-items:baseline}
  .opt:hover{border-color:var(--tc)}
  .opt .k{font-family:"IBM Plex Mono",monospace; font-weight:600; color:var(--tc)}
  .opt.wrong{border-color:var(--bad); background:var(--bad-soft)}
  .opt.right{border-color:var(--ok); background:var(--ok-soft)}
  .opt.on{border-color:var(--tc); background:var(--tsoft)}
  .prow{display:flex; flex-wrap:wrap; gap:10px 14px; align-items:flex-end; margin:10px 0}
  .prow label{display:flex; flex-direction:column; gap:3px; font-size:.86rem; color:var(--ink-soft)}
  .num-in,.unit-in{font:inherit; padding:7px 9px; border:1px solid var(--ink-soft); border-radius:6px; background:var(--stage); color:var(--ink)}
  .num-in{width:120px; font-family:"IBM Plex Mono",monospace}
  .fb{border-left:4px solid var(--ok); background:var(--ok-soft); border-radius:0 8px 8px 0; padding:10px 14px; margin:10px 0}
  .fb h4.sub{margin:0 0 4px}
  .fb p{margin:6px 0 0; line-height:1.65}
  .formula{border:1px solid var(--blaze); background:#16130A; border-radius:8px; padding:12px 16px; margin:14px 0}
  .formula .f{font-size:1.06rem; color:var(--blaze)}
  .formula .live{margin-top:6px; color:var(--ink)}
  .formula .uc{margin-top:8px; color:var(--ink-soft); font-size:.88rem; font-family:"Atkinson Hyperlegible",sans-serif}
  details.wonder{margin:14px 0; border:1px dashed var(--line); border-radius:8px; padding:8px 14px}
  details.wonder summary{cursor:pointer; color:var(--tc); font-weight:600}
  details.wonder[open] summary{margin-bottom:6px}
  details.wonder .q{margin:8px 0}
  .peek{background:var(--warn-soft); border-radius:6px; padding:9px 13px; margin:10px 0 0}
  .wfig{margin:8px 0 4px} .wfig svg{width:100%; max-width:520px; height:auto; display:block}
  .wfig .wt{font:600 13px "Atkinson Hyperlegible",Arial,sans-serif} .wfig figcaption{font-size:.86rem; color:var(--ink-soft)}
  details.limits{margin:16px 0 0; border:1px solid var(--line); border-radius:8px; padding:8px 14px}
  details.limits summary{cursor:pointer; color:var(--tc)}
  details.limits p{margin:10px 0 4px}
  blockquote.mine{margin:8px 0 12px; border-left:4px solid var(--blaze); background:var(--paper); border-radius:0 8px 8px 0; padding:10px 14px; white-space:pre-wrap}

  /* simulations */
  .sim{background:var(--stage); border:1px solid var(--line); border-radius:10px; padding:10px; margin:14px 0}
  .simrow{display:flex; gap:10px; align-items:stretch}
  .canwrap{position:relative; flex:1; min-width:0}
  .canwrap canvas{display:block; width:100%; border-radius:8px; touch-action:pan-y}
  .vctl{display:flex; flex-direction:column; align-items:center; gap:4px; width:64px; flex:none}
  .vctl .vl{font-size:.74rem; color:var(--ink-soft); text-align:center; line-height:1.15}
  .vslider{writing-mode:vertical-lr; direction:rtl; flex:1; width:30px; min-height:150px; margin:4px 0; accent-color:var(--tc)}
  .vctl output{font-family:"IBM Plex Mono",monospace; font-size:.9rem}
  .banner{position:absolute; left:8px; right:8px; top:8px; background:rgba(150,26,38,.94); color:#fff; padding:8px 12px; border-radius:6px; font-weight:700; font-size:.95rem; line-height:1.35; box-shadow:0 4px 14px rgba(0,0,0,.35)}
  .simbar{display:flex; flex-wrap:wrap; gap:8px 14px; align-items:center; justify-content:space-between; margin-top:10px}
  .speeds{display:flex; flex-wrap:wrap; gap:6px}
  .segbtn{font:inherit; font-size:.88rem; border:1px solid var(--line); background:var(--paper); color:var(--ink); border-radius:999px; padding:4px 13px; cursor:pointer}
  .segbtn:hover{border-color:var(--tc)}
  .segbtn.on{background:var(--tc); border-color:var(--tc); color:var(--on-tc); font-weight:700}
  .readouts{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px; margin-top:10px}
  .ro{background:var(--card); border:1px solid var(--line); border-radius:6px; padding:6px 10px}
  .ro .lbl{display:block; font-size:.68rem}
  .ro b{font-size:1.08rem; font-weight:600}
  @media (max-width:560px){ .readouts{grid-template-columns:1fr 1fr} }
  .hsl{display:grid; grid-template-columns:120px minmax(0,1fr) 80px; gap:10px; align-items:center; margin:8px 0}
  .hsl input{width:100%; accent-color:var(--tc)}
  .hsl output{font-family:"IBM Plex Mono",monospace; text-align:right}
  @media (max-width:560px){ .hsl{grid-template-columns:1fr 86px} .hsl label{grid-column:1 / -1} }
  .gaugewrap{display:flex; flex-direction:column; align-items:center; width:92px; flex:none; gap:4px}
  .gauge{position:relative; flex:1; width:34px; min-height:180px; background:var(--paper); border:1px solid var(--line); border-radius:6px; overflow:visible}
  .gauge .fill{position:absolute; left:0; right:0; bottom:0; background:var(--lift-l); border-radius:0 0 5px 5px}
  .gauge .wline{position:absolute; left:-6px; right:-6px; height:0; border-top:3px solid var(--weight-l)}
  .gaugewrap .gv{font-family:"IBM Plex Mono",monospace; font-size:.85rem; color:var(--lift-l); text-align:center}
  .gaugewrap .gw{position:absolute; left:50%; transform:translate(-50%, -100%); margin-top:-4px; width:96px; font-size:.7rem; color:var(--weight-l); text-align:center; line-height:1.15; background:var(--stage); border-radius:4px; padding:1px 2px}
  .gauge .wlbl{position:absolute; left:50%; height:0}
  @media (max-width:560px){ .gaugewrap{width:62px} .gaugewrap .gw{width:62px; font-size:.64rem} .gauge{width:26px} }
  .legend{display:flex; flex-wrap:wrap; gap:6px 16px; margin:4px 2px 8px; font-size:.86rem; color:var(--ink-soft)}
  .legend span{display:inline-flex; align-items:center; gap:6px}
  .legend i{display:inline-block; width:24px; height:0; border-top:2px solid}
  .legend i.bold{border-top-width:4px}
  .legend button{font:inherit; color:inherit; display:inline-flex; align-items:center; gap:6px; background:none; border:1px dashed var(--line); border-radius:999px; padding:2px 10px; cursor:pointer}
  .legend button[aria-pressed="true"]{border-style:solid; background:var(--card); color:var(--ink)}
  .legend button[aria-pressed="false"] i{opacity:.45}
  .flt{border-collapse:collapse; margin:6px 0; font-size:.93rem; width:100%; max-width:640px}
  .flt th,.flt td{border:1px solid var(--line); padding:5px 10px; text-align:center}
  .flt th{background:var(--line-soft); font-weight:600}
  .flt .tick{color:var(--ok); font-weight:700}
  .tablewrap{overflow-x:auto}

  /* side trail */
  .choices{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:10px 0}
  @media (max-width:700px){ .choices{grid-template-columns:1fr} }
  .choice{display:flex; gap:10px; align-items:flex-start; border:1px solid var(--line); background:var(--paper); border-radius:8px; padding:10px 12px; cursor:pointer}
  .choice:hover{border-color:var(--tc)}
  .choice input{margin-top:5px; accent-color:var(--tc)}
  .choice.on{border-color:var(--tc); background:var(--tsoft)}
  .field{margin:10px 0}
  .field label{display:block; font-weight:700; margin-bottom:4px}

  /* teach-back conversation */
  .chat{display:flex; flex-direction:column; gap:8px; max-height:460px; overflow-y:auto; padding:12px; border:1px solid var(--line); border-radius:10px; background:var(--stage); margin:10px 0}
  .say{max-width:82%; padding:9px 13px; border-radius:12px; line-height:1.5}
  .say .who{display:block; font-size:.72rem; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft); margin-bottom:2px}
  .say.them{align-self:flex-start; background:var(--card); border:1px solid var(--line)}
  .say.me{align-self:flex-end; background:var(--tsoft); border:1px solid var(--tc)}
  .say.wait{color:var(--ink-soft); font-style:italic}

  /* copy my work to submit: stays on screen on every level */
  body{padding-bottom:84px}
  /* the button sits on its own strip, so nothing on the page is ever under it */
  html{scroll-padding-bottom:84px}   /* room for the strip that holds Copy my work, when the page scrolls to something */
  body.hasfab::after{content:''; position:fixed; left:0; right:0; bottom:0; height:70px; background:var(--paper); border-top:1px solid var(--line); z-index:39}
  #subfab[hidden]{display:none}
  @media (max-width:520px){ body #subfab{font-size:.85rem; line-height:1.3; padding:7px 14px; bottom:7px; max-width:calc(100vw - 36px)} }
  #subfab{position:fixed; right:18px; bottom:13px; z-index:40; border-radius:999px; padding:11px 20px; box-shadow:0 6px 22px rgba(0,0,0,.55)}
  #subbox{position:fixed; right:18px; bottom:74px; z-index:40; width:min(520px, calc(100vw - 36px)); max-height:70vh; overflow:auto; background:var(--card); border:1px solid var(--tc); border-radius:12px; padding:12px 14px; box-shadow:0 10px 34px rgba(0,0,0,.6)}
  #subfab.warn{background:var(--bad); border-color:var(--bad); color:#2A0B08}
  #subbox .editor{font-size:.8rem}
  .clearwrap{margin:16px 0 0; font-size:.88rem}
  .linkbtn{font:inherit; background:none; border:none; color:var(--ink-soft); text-decoration:underline; cursor:pointer; padding:2px 0}
  .linkbtn:hover{color:var(--bad)}
  .ai-helper{margin:18px 0 0; border:1px solid var(--line); border-radius:8px; padding:0 16px; font-size:.95rem; line-height:1.5; background:var(--card)}
  .ai-helper summary{cursor:pointer; padding:10px 0; font-weight:700}
  .ai-helper p{margin:0 0 12px}
  /* level 5: inside the simulation */
  .runner{margin:14px 0 6px}
  .runner iframe{display:block; width:100%; height:660px; border:1px solid var(--line); border-radius:10px; background:#fff}
  @media (max-width:1014px){ .runner iframe{height:1000px} }
  .parth{font-size:1.3rem; margin:2px 0 12px}
  .pmap{display:flex; flex-direction:column; gap:8px; margin:14px 0; padding:12px; border:1px solid var(--line); border-radius:10px; background:var(--stage)}
  .pgroup{border:1px dashed var(--line); border-radius:10px; padding:8px 10px 10px; display:flex; flex-direction:column; gap:8px}
  .pgroup.in{flex-direction:row; flex-wrap:wrap}
  .pgroup.in > .lbl{flex-basis:100%}
  .pbox{font:inherit; text-align:left; border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:8px; padding:8px 12px; cursor:pointer; display:flex; gap:8px; align-items:center; flex:none}
  .pgroup.in .pbox{flex:1 1 220px}
  .pbox:hover{border-color:var(--tc)}
  .pbox.cur{border-color:var(--tc); background:var(--tsoft); font-weight:700}
  .pbox.done .pn{background:var(--ok); color:#04130C}
  .pbox:disabled{opacity:.5; cursor:not-allowed}
  .pbox:disabled:hover{border-color:var(--line)}
  .pbox.fixed{cursor:default; color:var(--ink-soft); flex:none}
  .pbox.fixed:hover{border-color:var(--line)}
  .pn{display:inline-grid; place-items:center; width:22px; height:22px; border-radius:50%; background:var(--line-soft); font-family:"IBM Plex Mono",monospace; font-size:.74rem; flex:none}
  .pn svg{width:11px; height:11px}
  .split{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:10px; align-items:start}
  @media (max-width:860px){ .split{grid-template-columns:1fr} }
  .codep{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:4px}
  .cl{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:2px 12px; align-items:baseline; border:1px solid var(--line); border-left:4px solid var(--line); background:var(--card); border-radius:6px; padding:6px 10px}
  .cl.in{margin-left:18px}
  .cl code{font-size:.88rem; color:#DCE7F3; white-space:pre-wrap}
  .cl .val{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace; font-size:.9rem; color:var(--blaze); text-align:right; font-weight:600}
  .cl .gl{grid-column:1 / -1; font-size:.84rem; color:var(--ink-soft)}
  .cl.cur{border-left-color:var(--blaze); background:#16130A}
  .cl.head{border-style:dashed; background:transparent}
  .togs{display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin:10px 0 4px}
  .speeds .muted{align-self:center}
  .pzl{list-style:none; margin:8px 0; padding:0; display:flex; flex-direction:column; gap:6px}
  .pzi{display:flex; justify-content:space-between; gap:10px; align-items:center; border:1px solid var(--line); background:var(--card); border-radius:8px; padding:6px 8px 6px 12px; cursor:grab}
  .pzi code{font-size:.9rem; white-space:pre-wrap; min-width:0; overflow-wrap:anywhere}

You are a teaching assistant for CST349, a course for computing students. The student is working through an interactive learning trail called 'One step after another'. They plan a four-week sprint for a made-up classmate named Quinn, who is building a small budget tracker for a hiking club's treasurer, and the page runs the plan on a board of four week columns, with fewer hours arriving than were planned. At Level 1 they run Quinn's first plan of three large steps; at Level 2 they compare three wordings of the goal and choose or write one; at Level 3 the work is cut into eight steps and they put the steps in their own order; at Level 4 they play the four weeks one at a time, may change the order after each week, and see the treasurer's reaction when the treasurer has tried the tracker. Before each run they say what they expect. The student has written a short explanation in answer to one question. You will receive the question, private notes on what a sound explanation contains and on what the student sees at this stop, what the student has done on the page, and the student's explanation.

Write feedback addressed to the student as "you". Use plain words and 3 to 5 sentences. No headings, no lists.

First say what is right in the explanation, specifically, using a few of the student's own words. Then name the one most important gap or mistake in the reasoning, if there is one, and say what is missing without writing the missing part for them. Then ask one question that would lead them to it.

If the explanation is complete and correct, say so plainly, and ask one question that tests it in a nearby situation.

Never write the full correct explanation for the student. If the explanation is off the topic of the question, ask them to describe what they did on the page first. Do not praise in general terms.

- Never supply what the student left out or got wrong. Say which part does not hold up or is not there yet, and ask one question.
- If you point to the page, point only to something the notes say is at that stop: the board, the table of hours that arrived, the three wordings, the table of eight steps, the student's order, the comparison table, the treasurer's reaction. If the thing to look at is at another level, name that level.
- You do not see the student's runs unless the notes for that stop give them to you. Do not state what a run showed beyond what the notes say.
- Quinn and the treasurer are made up for this page. Do not add facts about them.
- Plain text only: no asterisks, no markdown, no headings.
- Ask only about what the student has done up to this stop. The notes for a stop say what they have seen there; anything at a later level has not happened for them yet, so do not ask about it as if it had.
- Before you say that something is missing, read the student's words again. If they have said it, in any words, treat it as there. Your one question may take their idea a step further; it must not ask for something they already wrote. The page asks for a few sentences: do not ask for a complete account.

<script type="text/plain" id="ai-notes-ex1">
a sound explanation says that all the hours went into one large step that had to be complete before anything could be shown, and that the lost hours left it unfinished; it may add that the goal's wording gave no way to tell done from not done. Common gaps: "Quinn did not work enough" or "Quinn should not have lost hours", which blames the week and not the plan; "the plan was too ambitious" with nothing about the size of the step. At this stop the student sees the board with one long bar filled to 13 of 14, two empty bars, the table of hours that arrived, and the three lines under the board. They have not yet seen the eight smaller steps or the three wordings of the goal; do not describe them. Before you call anything missing, find the student's own words on it: if they are there, in any wording, it is not missing.
</script>
<script type="text/plain" id="ai-notes-ex2">
a sound explanation says that C names a result another person can see and a date, so the end of the sprint gives a yes or a no that does not depend on Quinn's own opinion; and that under A the plan's failure stays hidden, so nothing prompts a change. Common gaps: "C is more specific" with nothing about who can check or by when; "C is more ambitious", which it is not: it asks for less of the tracker than B does. At this stop the student sees the three wordings, what each says about the first run, and their own chosen or written goal with their answers to the three questions. Do not rewrite the student's wording for them. Before you call anything missing, find the student's own words on it: if they are there, in any wording, it is not missing.
</script>
<script type="text/plain" id="ai-notes-ex3">
a sound explanation says that the order decides which steps get the hours that arrive, so putting the step that another person can try early means it is finished before the lost hours run out; it may add that cutting alone gave finished pieces and did not decide which came first. A student whose own order did no better than Quinn's (for example with f still late) should say what they would move and why; that is a sound answer too. Common gaps: "smaller steps are better", which Quinn's order shows is not enough; "I did the important things first" with nothing about what makes f important, which is that someone else sees the work. At this stop the student sees the table of eight steps with what each needs, the board, their own order, and the comparison table of three plans. Before you call anything missing, find the student's own words on it: if they are there, in any wording, it is not missing.
</script>
<script type="text/plain" id="ai-notes-ex4">
a sound explanation names what was moved or left out and gives a reason that goes back to the goal or to the person the tracker is for: for example "I left out 'make it look good' because the treasurer will not use it at all without splitting". It may say that the plan changed and the goal did not. If the student's order already had the changed step ahead of what they left at the bottom, keeping that order is a sound choice of what to leave out and not a mistake: "changes of order: none" in what the page sends you is then what to expect, and the question is why those steps can wait. Common gaps: describing the change with no reason; treating the reaction as bad luck and not as information; "I would work more hours". At this stop the student sees the board week by week, the hours that arrived each week with the reason, the treasurer's reaction if step f was finished, the changed step g, their changes of order, and the four lines after week 4. Before you call anything missing, find the student's own words on it: if they are there, in any wording, it is not missing.

/*MODEL-START*/
// Pure model, no DOM. One rule runs every plan: each week, the hours that arrive go to the first step in the plan's order
// that is not finished and whose "needs first" steps are all finished; hours left over flow to the next such step in the
// same week. Work on a step adds up; a step is finished when all its hours are in. The same rule as sim.py.
const MODEL = (function(){
  function fresh(steps){
    const st = {h:{}, needs:{}, done:{}, fin:{}, grown:false};
    Object.keys(steps).forEach(k => { st.h[k] = steps[k].h; st.needs[k] = steps[k].needs.slice(); st.done[k] = 0; });
    return st;
  }
  // one week; onFinish(k, st) is called the moment step k is finished (Level 4 grows step g there)
  function week(st, order, hours, wk, onFinish){
    let left = hours;
    while (left > 0){
      const k = order.find(id => st.done[id] < st.h[id] && st.needs[id].every(n => st.fin[n]));
      if (!k) break;
      const put = Math.min(left, st.h[k] - st.done[k]);
      st.done[k] += put; left -= put;
      if (st.done[k] === st.h[k]){ st.fin[k] = wk; if (onFinish) onFinish(k, st); }
    }
    return hours - left;
  }
  const copy = st => JSON.parse(JSON.stringify(st));
  // a whole run: the state after each week
  function run(steps, order, hours){
    const st = fresh(steps), zero = copy(st), snaps = [];
    hours.forEach((h, i) => { week(st, order, h, i + 1); snaps.push(copy(st)); });
    return {st, snaps, zero};
  }
  return {fresh, week, run};
})();
/*MODEL-END*/

    const first = (st, order) => { const ws = order.filter(k => st.fin[k]).map(k => st.fin[k]); return ws.length ? 'week ' + Math.min.apply(null, ws) : 'none'; };
    const tried = (st, k) => st.fin[k] ? 'week ' + st.fin[k] : 'no';
    const goal = (st, fp) => { const w = goalWeek(st, fp); return w ? 'done in week ' + w : 'not done'; };
    const R = C.l3.cmp;
    return [R[0], [R[1][0], String(finIds(f, FIRST).length), String(finIds(q, IDS).length), String(finIds(m, IDS).length)],
      [R[2][0], first(f, FIRST), first(q, IDS), first(m, IDS)], [R[3][0], tried(f, 'T'), tried(q, 'f'), tried(m, 'f')], [R[4][0], goal(f, true), goal(q, false), goal(m, false)]];
  }
  function playText(p, full){
    if (!p) return 'not played yet';
    const pr = playResult(p), out = [];
    p.weeks.forEach((w, i) => out.push('week ' + (i + 1) + ': order of what was left ' + w.order.join(' ') + ', ' + C.l4.hours[i] + ' hours arrived (' + C.l4.after[i] + ')'));
    if (pr.r.react && pr.r.react <= p.weeks.length) out.push('the treasurer tried the tracker in week ' + pr.r.react + ' and the page showed the reaction: step g became "' + C.l4.gNew + '"');
    else if (playDone(p)) out.push('the treasurer never tried the tracker in these four weeks, so the reaction did not come');
    const ch = playChanges(p); out.push('changes of order: ' + (ch.length ? ch.join('; ') : 'none'));
    if (playDone(p) || full) out.push('after week ' + p.weeks.length + ': ' + pr.L.join(' ') + (playDone(p) ? ' ' + expectedLine(+p.n, pr.n) : ''));
    return out.join('; ');

nation yet. It was taught at {level}, and a question on it follows below.", "fbNot": "Your explanation did not get to this idea. It was taught at {level}, and a question on it follows below.", "marks": {"explained": "explained", "partly explained": "partly explained", "not reached": "not reached"}, "qHead": "One question for each idea that is still open", "qLocked": "The questions open when the two conversations above are finished.", "qNone": "All {n} ideas are confirmed. There is nothing left to answer here. If you want to go further, each idea has a harder question.", "ideaLbl": "Idea {n}", "answer": "Your answer", "check": "Check my answer", "checking": "Reading your answer...", "sound": "This idea is confirmed.", "hardSound": "Your answer to the harder question is sound.", "back": "This idea was taught at {level}. You can go back to it and return here; your answers are kept.", "backBtn": "Go to {level}", "hard": "Do you want a harder one?", "down": "The helper is not answering right now. Your answer is saved here, and you can check it again in a moment.", "privacy": "What you type here is sent to the course AI helper so that it can reply. The course does not store it, and it is kept only in this browser."};
  const ENDC = { "count": "five", "ideas": [{"t": "A goal you can check.", "d": "It names a result that someone other than you could see or try, and a date. Then the end of the sprint gives a yes or a no that does not depend on how you feel about it.", "level": "Level 2", "lv": 2, "c": "the goal names a result someone else could see or try, and a date, so that the end gives a yes or no that does not depend on the person's own feeling.", "e": "Here is a goal: \"Improve my resume.\" Rewrite it so that a stranger could tell, on a date, whether it is done. Then say what you added.", "se": "a rewritten goal that names a result another person could see or try (for example a named person has read it and marked what is unclear; it has been sent to three postings) and a date; and it says that these two things are what was added.", "h": "A classmate says: \"If I word my goal so that it can fail, I will just feel bad at the end of the month. A loose goal keeps me motivated.\" What does the loose goal cost them? Use Quinn's first plan.", "sh": "under the loose wording Quinn's first plan counted as a success although nothing was finished or seen, so nothing told Quinn to change the plan; a goal that can fail shows the problem while there is still time to act on it. Saying that the checkable goal need not be larger is welcome and not required."}, {"t": "A step you can finish.", "d": "Small enough for one sitting, and when the sitting ends something exists that was not there before.", "level": "Level 3", "lv": 3, "c": "a step is small enough for one sitting and leaves something that exists when it is finished; cutting does not shrink the work, it changes when finished pieces exist.", "e": "A plan has the step \"Write the report (10 hours)\". Cut it into three or four steps of one sitting, and for each one say what exists when it is finished.", "se": "three or four steps, each of a size that fits one sitting, each with something that exists at the end (an outline, the table of results, a draft of one section, a version a classmate has read); the hours need not be given.", "h": "Cutting Quinn's 14-hour step into five pieces did not make the work smaller: it was still 14 hours. So what did the cutting change?", "sh": "when something finished exists: a piece is finished after a few hours and not only after all 14, so lost hours leave finished pieces and not one unfinished whole, and a finished piece can be shown."}, {"t": "The order of the steps.", "d": "Some steps need others first. The first step is one you can start today, and the step that another person can react to comes as early as it can.", "level": "Level 3", "lv": 3, "c": "some steps need others first; the first step can be started today; the step another person can react to goes as early as its needs allow.", "e": "In Quinn's plan, which step has to come first, and how can you tell from the table of steps?", "se": "step a, asking the treasurer what the tracker must do; it needs nothing first, and every other step needs it directly or through step b. Naming the idea is enough: the step that needs nothing and that others need.", "h": "Quinn's order (a b c d e f g h) and the order a b f g c d e h have the same steps and hours. Under the first, four steps were finished; under the second, five. That is one step of difference. Why is the second so much better for Quinn?", "sh": "in the second the treasurer tried the tracker in week 2, so someone other than Quinn saw it and the goal was met; in the first nobody saw it at all. The count of steps is not the point; which step is finished early is."}, {"t": "A plan meets the week.", "d": "Fewer hours arrive than were planned. With the same work, the plan that has a finished piece early loses less, and room to spare lets you decide in advance what the lost hours cost.", "level": "Levels 1 and 4", "lv": 4, "c": "fewer hours arrive than planned; small finished steps and a good order mean the lost hours cost less; room to spare means deciding in advance what is left out.", "e": "Quinn planned 20 hours and 13 arrived. With the first plan, nothing was finished. Name two things about a plan that decide how much those 7 lost hours cost.", "se": "two of: the size of the steps (whether finished pieces exist when the hours run out); the order (whether what matters most was done before the hours ran out); room to spare (whether the plan already said what would be left out).", "h": "You have 10 hours of work to do this week and you believe you will get about 10 hours. How would you plan the week differently because of what happened to Quinn?", "sh": "plan as if fewer hours will arrive; put first the steps that must be finished, each of one sitting; say in advance what is left out if hours are lost. \"Work harder\" or \"find more hours\" is not an answer."}, {"t": "A finished step brings something back.", "d": "Show it, and what comes back changes the next step. Changing the plan is not giving up on the goal.", "level": "Level 4", "lv": 4, "c": "a finished step is shown, the reaction changes the next step, and changing the plan keeps the goal reachable; it is not the same as changing the goal.", "e": "After the treasurer tried the tracker, Quinn's plan grew by two hours and a step had to be left out. Why is Quinn better off than if the treasurer had first seen the tracker in week 4?", "se": "Quinn learned in time that the treasurer would not use the tracker without splitting, and could spend the remaining hours on that; in week 4 the same news would have come with no hours left, after the hours had gone to features the treasurer did not need.", "h": "A classmate says: \"I changed my plan in week 2, so I failed at my goal.\" What would you say, and when would they be right?", "sh": "the plan is the route and the goal is the result; changing the route after learning something is how the result stays reachable. They would be right if what they changed was the goal itself, to something easier, so that it could be called done."}],
    "teach": [{"ideas": [0, 1], "opener": "My goal for this month is to get my portfolio in shape. I have been working on it for three weeks and I honestly cannot tell if I am getting anywhere. What am I doing wrong?", "ask": "If the student explains a goal that can be checked and says nothing about the size of the steps, ask: \"Ok, say I fix the goal. My to-do list has one line on it: 'redo the portfolio site'. Is that a step?\"", "system": "You are playing a college classmate in CST349. You have not done the learning trail the student has just finished. What the trail showed them:\n- Quinn, a student, planned a four-week sprint to build a budget tracker for a hiking club's treasurer: 20 hours planned, 13 arrived\n- with three large steps (build 14 hours, test and fix 4, how-to 2) all 13 hours went into the first step, which stayed one hour short; nothing was finished and nobody saw anything\n- three wordings of the goal: \"make good progress\" (cannot be checked), \"finish my tracker\" (people would disagree), and \"by Friday of week 4 the treasurer has entered last month's receipts and told me one thing to change\" (anyone can check)\n- the same work cut into eight steps of two or three hours; in the build-first order four were finished and the treasurer saw nothing; with the treasurer's try moved up, it happened in week 2\n- played week by week, the treasurer's try showed that the tracker had to split shared costs; one step doubled and the student had to change the order and leave something out\n- the student rewrote their own Sprint 1 goal so that it could be checked, and named a first step of one sitting\n\nThis is one of two short conversations. In this one your job is to get the student to explain two ideas by asking questions:\n1. A goal you can check. It names a result that someone other than you could see or try, and a date. Then the end of the sprint gives a yes or a no that does not depend on how you feel about it.\n2. A step you can finish. Small enough for one sitting, and when the sitting ends something exists that was not there before.\nAsk about the second idea only if the student leaves it out of their answer.\nIf the student explains a goal that can be checked and says nothing about the size of the steps, ask: \"Ok, say I fix the goal. My to-do list has one line on it: 'redo the portfolio site'. Is that a step?\"\n\nRules:\n- Stay in character as a curious classmate who knows none of this. Use casual, plain words.\n- You know only what the student has told you in this conversation. Never use a term or an idea from the trail before the student has used it, and never hint at what the next step is.\n- Each reply is one or two short sentences and contains exactly one question. Write plain sentences with no dashes.\n- Never explain, define, correct or give an answer, even if the student asks you to. If they ask, say you were hoping they could tell you, and ask a smaller question.\n- When the student skips a step, uses a word without saying what it means, or says something that does not add up, say what confuses you and ask about exactly that.\n- If the student says something incorrect, do not say it is wrong. Ask a concrete question that makes the consequence visible. Your question must not contain the right answer or the result of a calculation: ask the student to work it out.\n- If the student is stuck on the same point twice, ask a smaller and more concrete question about it.\n- An idea counts as explained once the student has given its reasoning. Do not ask for more examples of an idea they have already explained, and do not bring in a name or a part they have not mentioned.\n- When both ideas have been explained well enough that a newcomer could follow, say you think you get it now and suggest they ask for feedback. Never do this in reply to the student's first message: the feedback button opens only after their second reply, so ask one more question about what they said. Do not praise beyond a short \"ok,     const w = $('#clearwrap');
    w.innerHTML = '<button type="button" class="linkbtn" id="clr">' + esc(C.submit.clear) + '</button> <span id="clr2"></span>';
    $('#clr').onclick = () => { $('#clr2').innerHTML = '<button type="button" class="btn ghost" id="clryes">' + esc(C.submit.clearYes) + '</button>'; $('#clryes').onclick = () => { try { localStorage.removeItem(KEY); localStorage.removeItem(KEY + '.save'); } catch (e) {} S = fresh(); try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} location.reload(); }; };
  }


  // for automated checks of this page
  window.__oneStep = {workReport, saved(){ return S; }, run(order, hours){ const r = M.run(EIGHT, order, hours || C.hours); return {done:r.st.done, fin:r.st.fin}; },
    play(orders){ const p = {weeks:orders.map(o => ({order:o.split('')})), left:[]}, r = playState(p); return {done:r.st.done, fin:r.st.fin, h:r.st.h, react:r.react}; },
    first(){ const r = runFirst(); return {done:r.st.done, fin:r.st.fin}; }, notesFor, trailFacts};

  /* ---------- start ---------- */
  const fromHash = () => LV.findIndex(l => l.id === (location.hash || '').slice(1));
  const hi = fromHash(); if (hi >= 0 && unlocked(hi)) S.level = hi;
  if (!(S.level >= 0 && S.level < LV.length) || !unlocked(S.level)) S.level = 0;
  window.addEventListener('hashchange', () => { const i = fromHash(); if (i >= 0 && i !== S.level) go(i); });
  render();
})();
</script>
</body>
