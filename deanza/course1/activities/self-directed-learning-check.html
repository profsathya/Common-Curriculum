<style data-course-theme="applying-ai-at-work">
/* Applying AI at Work: existing reading palette, shared by every delivery.
   Layouts still own their reading widths, table scrolling, density and states.
   html adds specificity above embedded component CSS without !important. */
:root {
  --course-font: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --course-text: #1a1a1a;
  --course-muted: #455568;
  --course-heading: #17344a;
  --course-accent: #204b76;
  --course-accent-hover: #17344a;
  --course-soft: #f0f5fa;
  --course-border: #cbd8e4;
  --course-input-border: #8294a7;
  --course-focus: #bf6b00;
  --course-bg: #fafafa;
  --course-surface: #fff;
  --course-control-radius: 6px;
  --course-card-radius: 12px;
  --bg: var(--course-bg);
  --surface: var(--course-surface);
  --text: var(--course-text);
  --muted: var(--course-muted);
  --border: var(--course-border);
  --accent: var(--course-accent);
  --accent-light: var(--course-soft);
  /* Scheduled homepage aliases; preserve its navigation layout. */
  --ink: var(--course-text);
  --secondary: var(--course-muted);
  --rule: var(--course-border);
  --blue: var(--course-accent);
  --soft: var(--course-soft);
}
html body {
  font-family: var(--course-font);
  font-size: 16px;
  line-height: 1.65;
  color: var(--course-text);
  background: var(--course-bg);
}
html .guided-walkthrough, html #activity-container .activity {
  font-family: var(--course-font);
  font-size: 1rem;
  line-height: 1.65;
  color: var(--course-text);
}
html .activity > h1, html .activity__title {
  color: var(--course-heading);
  font-size: 1.375rem;
  line-height: 1.3;
}
html .activity > .meta, html .activity__description { color: var(--course-muted); }
html .activity a:not(.button):not(.secondary) { color: var(--course-accent); }
html .activity :is(section, .launch) { border-color: var(--course-border); }
html .activity .launch { border-left-color: var(--course-accent); background: var(--course-soft); }
html .activity :is(.response-task, .category-card, .walk-step, .example-once) {
  border-color: var(--course-border);
  border-radius: var(--course-card-radius);
}
html :is(.guided-workspace, .guided-walkthrough, .reading-page) :is(input[type="text"], textarea, select) {
  color: var(--course-text);
  border-color: var(--course-input-border);
}
html :is(.guided-workspace, .guided-walkthrough, .copy-source) button,
html .activity a.button {
  background: var(--course-accent);
  border-color: var(--course-accent);
  border-radius: var(--course-control-radius);
  color: var(--course-surface);
}
/* Secondary actions and accordion headers are not primary submit buttons. */
html :is(.guided-workspace, .guided-walkthrough) :is(button.secondary, #more-options button, .walk-secondary, #walk-clear, .walk-row-feedback-control button) {
  background: var(--course-surface);
  color: var(--course-accent);
  border: 1px solid var(--course-input-border);
}
html .guided-walkthrough .walk-accordion-toggle {
  background: transparent;
  color: var(--course-heading);
  border: 0;
  border-radius: var(--course-card-radius);
}
html .guided-walkthrough .walk-accordion-toggle:hover { background: var(--course-soft); }
html .activity a.secondary { color: var(--course-accent); background: var(--course-soft); }
html :is(a, button, input, textarea, select, summary, [tabindex]):focus-visible {
  outline: 3px solid var(--course-focus);
  outline-offset: 3px;
}
/* Keep outlines inside clipped table cells and accordion headers. */
html .guided-walkthrough :is(.walk-source-table textarea, .walk-accordion-toggle):focus-visible { outline-offset: -3px; }
/* Theme the existing activity engine locally, without changing its runtime,
   configuration, feedback semantics or other courses that share its CSS. */
html #activity-container .activity[data-theme] {
  --activity-primary: var(--course-accent);
  --activity-primary-light: #477b9b;
  --activity-primary-dark: var(--course-accent-hover);
  --activity-primary-bg: var(--course-soft);
}
html .course-home .primary:hover { background: var(--course-accent-hover); }
html :is(.activity, .course-home) { overflow-wrap: anywhere; }

html #activity-container :is(button, input, textarea, select) { font-family: var(--course-font); }
html #activity-container button, html .course-home .primary { border-radius: var(--course-control-radius); }
</style>
