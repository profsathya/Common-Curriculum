<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How your phone counts your steps</title>
<!-- trail-step-counter.md in this folder is the words twin of this page: every student-facing word and every AI prompt, in reading order. Built by build_step_counter.py on the framework of trail-bird-glide.html. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    color-scheme:dark;
    --paper:#070D18; --card:#0E1726; --ink:#E6EDF5; --ink-soft:#93A4B8;
    --line:#22324A; --line-soft:#162236;
    --blaze:#F2B84B; --hero-ink:#050A13; --hero-cream:#F3EFE3;
    --tc:#5BB8F5; --tsoft:#10263B; --on-tc:#04101C;
    --ok:#5FD39A; --ok-soft:#0F2A22; --bad:#FF8A7A; --bad-soft:#33181A; --warn:#E3BD55; --warn-soft:#2B2410;
    --code:#162236; --stage:#040912;
    --weight:#6B3FC4; --lift:#0E8C80; --drag:#C46F00; --vel:#1B2533;
    --weight-l:#B996FF; --lift-l:#3FD3C2; --drag-l:#FFB347;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:"Atkinson Hyperlegible","Lato","Helvetica Neue",Arial,sans-serif; color:var(--ink); background:var(--paper); font-size:16px; line-height:1.6; -webkit-font-smoothing:antialiased; overflow-wrap:break-word}
  .page{max-width:1180px; margin:0 auto; padding:22px 22px 56px}
  @media (max-width:640px){ .page{padding:14px 12px 40px} }
  h1,h2,h3{font-family:Fraunces,Georgia,serif; text-wrap:balance; margin:0}
  a{color:var(--blaze)}
  p{margin:0 0 12px}
  code,.mono,.ro b,.formula{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace}
  a:focus-visible,button:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible,canvas:focus-visible{outline:3px solid var(--blaze); outline-offset:2px; border-radius:4px}
  .sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0)}
  .crumb{font-family:"IBM Plex Mono",monospace; font-size:.8rem; letter-spacing:.06em; margin-bottom:12px}
  .crumb a{color:var(--ink-soft); text-decoration:none}
  .crumb a:hover{color:var(--blaze); text-decoration:underline}

  .hero{position:relative; overflow:hidden; background:radial-gradient(1100px 420px at 78% 40%, #12314F 0%, #0A1626 45%, var(--hero-ink) 100%); color:var(--hero-cream); border:1px solid var(--line); border-radius:12px; padding:48px 44px 40px; display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr); gap:26px; align-items:center}
  .hero .eyebrow{color:var(--tc)}
  .hero h1{font-size:clamp(2.1rem,5.2vw,3.4rem); line-height:1.04; font-weight:650; margin:10px 0 16px}
  .hero h1 em{color:var(--blaze); font-style:italic; font-weight:500}
  .hero p{max-width:60ch; margin:0 0 10px; color:#C5D0DD; font-size:1.05rem}
  .heroart{width:100%; height:auto}
  .heroart .path{fill:none; stroke:var(--blaze); stroke-width:2.5; stroke-dasharray:4 10; stroke-linecap:round; animation:flow 1.4s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-28}}
  @media (max-width:820px){ .hero{grid-template-columns:1fr; padding:30px 20px} .heroart{max-width:420px} }
  .eyebrow,.lbl,.map-lbl{font-family:"IBM Plex Mono",monospace; font-size:.74rem; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-soft)}

  .map{margin:18px 0 20px; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px 14px}
  .map-row{display:flex; flex-wrap:wrap; gap:6px; margin-top:4px}
  .dot{display:flex; align-items:center; gap:6px; border:1px solid var(--line); background:var(--paper); color:var(--ink); border-radius:999px; padding:4px 11px 4px 5px; font:inherit; font-size:.86rem; cursor:pointer}
  .dot-n{display:inline-grid; place-items:center; width:22px; height:22px; border-radius:50%; background:var(--line-soft); font-family:"IBM Plex Mono",monospace; font-size:.74rem}
  .dot-n svg{width:11px; height:11px}
  .dot:hover{border-color:var(--tc)}
  .dot.done .dot-n{background:var(--ok); color:#04130C}
  .dot.cur{border-color:var(--tc); background:var(--tsoft); font-weight:700}
  .dot.cur .dot-n{background:var(--tc); color:var(--on-tc)}
  .dot.cur.done .dot-n{background:var(--ok); color:#04130C}
  .dot.locked{opacity:.5; cursor:not-allowed}
  .dot.locked:hover{border-color:var(--line)}
  .map-arrow{color:var(--ink-soft); align-self:center}
  .map-prog{margin-top:9px; font-size:.86rem; color:var(--ink-soft)}
  .reviewnote{display:inline-block; margin:0 0 12px; font-family:"IBM Plex Mono",monospace; font-size:.78rem; border:1px dashed var(--warn); color:var(--warn); border-radius:999px; padding:2px 12px}

  #stop{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:30px 34px 24px; scroll-margin-top:12px}
  @media (max-width:640px){ #stop{padding:20px 14px} }
  #stop h2{font-size:clamp(1.4rem,3.4vw,1.9rem); margin:4px 0 14px}
  h4.sub{font-family:Fraunces,Georgia,serif; font-size:1.02rem; margin:18px 0 8px}
  .step{border-top:1px solid var(--line); margin-top:20px; padding-top:16px}
  .row{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:12px 0}
  .endck{list-style:none; padding:0; margin:8px 0}
  .endck li{border:1px solid var(--line); border-radius:8px; padding:8px 12px; margin:6px 0}
  .endck li.ok{border-color:var(--ok)}
  .endmark{display:inline-block; font-size:.78rem; border:1px solid var(--line); border-radius:999px; padding:1px 9px; margin-left:6px; white-space:nowrap}
  .endck li.ok .endmark{border-color:var(--ok); color:var(--ok)}
  .endq{border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin:12px 0}
  .endq .ask{font-weight:600; margin:4px 0 8px}
  .endq textarea, .endtb textarea{width:100%; box-sizing:border-box}
  .endtb{border-top:1px dashed var(--line); margin-top:16px; padding-top:6px}
  .ts{margin:18px 0 0; padding:6px 0 0; border-top:1px dashed var(--line)}
  .ts-ta{width:100%; box-sizing:border-box; font:inherit; font-size:.85rem; line-height:1.4; padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:transparent; color:inherit}
  .btn{font:inherit; font-weight:700; border:1px solid var(--tc); background:var(--tc); color:var(--on-tc); border-radius:6px; padding:8px 15px; cursor:pointer}
  .btn.ghost{background:transparent; color:var(--ink); border-color:var(--line); font-weight:400}
  .btn:hover{filter:brightness(1.08)} .btn.ghost:hover{border-color:var(--tc)}
  .btn:disabled{opacity:.45; cursor:not-allowed}
  .muted{color:var(--ink-soft); font-size:.93rem}
  .guide{font-style:italic; color:var(--ink-soft)}
  .msg{border-radius:6px; padding:9px 13px; margin:10px 0}
  .msg:empty{display:none}
  .msg.ok{background:var(--ok-soft); border-left:4px solid var(--ok)}
  .msg.bad{background:var(--bad-soft); border-left:4px solid var(--bad)}
  .msg.warn{background:var(--warn-soft); border-left:4px solid var(--warn)}
  .msg.info{background:var(--tsoft); border-left:4px solid var(--tc)}
  .hint{background:var(--warn-soft); border-radius:6px; padding:9px 13px; margin:8px 0}
  .hint:empty{display:none}
  .editor{width:100%; font:inherit; font-size:.97rem; line-height:1.55; padding:12px 14px; border:1px solid var(--line); border-radius:10px; background:var(--stage); color:#DCE7F3; resize:vertical; caret-color:var(--blaze)}
  .navb{display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-top:24px; border-top:1px solid var(--line); padding-top:16px}
  .navwhy{margin-top:8px; text-align:right; min-height:1.2em}
  footer{margin-top:22px; font-size:.86rem; color:var(--ink-soft)}
  #stop.arrive{animation:arrive .45s ease-out}
  @keyframes arrive{from{opacity:0; transform:scale(.94)} to{opacity:1; transform:none}}
  .zooming{transition:transform .5s cubic-bezier(.6,0,.9,.5), opacity .5s ease-in; transform:scale(7); opacity:0}

  /* cards: predict, practice, explain */
  .q{border:1px solid var(--line); border-radius:10px; padding:6px 16px 10px; margin:16px 0; background:var(--paper)}
  .q > .lbl{margin-top:8px}
  .ask{font-size:1.05rem; margin:6px 0 10px}
  .opts{display:flex; flex-direction:column; gap:6px}
  .opt{font:inherit; text-align:left; border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:8px; padding:8px 12px; cursor:pointer; display:flex; gap:10px; align-items:baseline}
  .opt:hover{border-color:var(--tc)}
  .opt .k{font-family:"IBM Plex Mono",monospace; font-weight:600; color:var(--tc)}
  .opt.wrong{border-color:var(--bad); background:var(--bad-soft)}
  .opt.right{border-color:var(--ok); background:var(--ok-soft)}
  .opt.on{border-color:var(--tc); background:var(--tsoft)}
  .prow{display:flex; flex-wrap:wrap; gap:10px 14px; align-items:flex-end; margin:10px 0}
  .prow label{display:flex; flex-direction:column; gap:3px; font-size:.86rem; color:var(--ink-soft)}
  .num-in,.unit-in{font:inherit; padding:7px 9px; border:1px solid var(--ink-soft); border-radius:6px; background:var(--stage); color:var(--ink)}
  .num-in{width:120px; font-family:"IBM Plex Mono",monospace}
  .fb{border-left:4px solid var(--ok); background:var(--ok-soft); border-radius:0 8px 8px 0; padding:10px 14px; margin:10px 0}
  .fb h4.sub{margin:0 0 4px}
  .fb p{margin:6px 0 0; line-height:1.65}
  .formula{border:1px solid var(--blaze); background:#16130A; border-radius:8px; padding:12px 16px; margin:14px 0}
  .formula .f{font-size:1.06rem; color:var(--blaze)}
  .formula .live{margin-top:6px; color:var(--ink)}
  .formula .uc{margin-top:8px; color:var(--ink-soft); font-size:.88rem; font-family:"Atkinson Hyperlegible",sans-serif}
  details.wonder{margin:14px 0; border:1px dashed var(--line); border-radius:8px; padding:8px 14px}
  details.wonder summary{cursor:pointer; color:var(--tc); font-weight:600}
  details.wonder[open] summary{margin-bottom:6px}
  details.wonder .q{margin:8px 0}
  .peek{background:var(--warn-soft); border-radius:6px; padding:9px 13px; margin:10px 0 0}
  .wfig{margin:8px 0 4px} .wfig svg{width:100%; max-width:520px; height:auto; display:block}
  .wfig .wt{font:600 13px "Atkinson Hyperlegible",Arial,sans-serif} .wfig figcaption{font-size:.86rem; color:var(--ink-soft)}
  details.limits{margin:16px 0 0; border:1px solid var(--line); border-radius:8px; padding:8px 14px}
  details.limits summary{cursor:pointer; color:var(--tc)}
  details.limits p{margin:10px 0 4px}
  blockquote.mine{margin:8px 0 12px; border-left:4px solid var(--blaze); background:var(--paper); border-radius:0 8px 8px 0; padding:10px 14px; white-space:pre-wrap}

  /* simulations */
  .sim{background:var(--stage); border:1px solid var(--line); border-radius:10px; padding:10px; margin:14px 0}
  .simrow{display:flex; gap:10px; align-items:stretch}
  .canwrap{position:relative; flex:1; min-width:0}
  .canwrap canvas{display:block; width:100%; border-radius:8px; touch-action:pan-y}
  .vctl{display:flex; flex-direction:column; align-items:center; gap:4px; width:64px; flex:none}
  .vctl .vl{font-size:.74rem; color:var(--ink-soft); text-align:center; line-height:1.15}
  .vslider{writing-mode:vertical-lr; direction:rtl; flex:1; width:30px; min-height:150px; margin:4px 0; accent-color:var(--tc)}
  .vctl output{font-family:"IBM Plex Mono",monospace; font-size:.9rem}
  .banner{position:absolute; left:8px; right:8px; top:8px; background:rgba(150,26,38,.94); color:#fff; padding:8px 12px; border-radius:6px; font-weight:700; font-size:.95rem; line-height:1.35; box-shadow:0 4px 14px rgba(0,0,0,.35)}
  .simbar{display:flex; flex-wrap:wrap; gap:8px 14px; align-items:center; justify-content:space-between; margin-top:10px}
  .speeds{display:flex; flex-wrap:wrap; gap:6px}
  .segbtn{font:inherit; font-size:.88rem; border:1px solid var(--line); background:var(--paper); color:var(--ink); border-radius:999px; padding:4px 13px; cursor:pointer}
  .segbtn:hover{border-color:var(--tc)}
  .segbtn.on{background:var(--tc); border-color:var(--tc); color:var(--on-tc); font-weight:700}
  .readouts{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px; margin-top:10px}
  .ro{background:var(--card); border:1px solid var(--line); border-radius:6px; padding:6px 10px}
  .ro .lbl{display:block; font-size:.68rem}
  .ro b{font-size:1.08rem; font-weight:600}
  @media (max-width:560px){ .readouts{grid-template-columns:1fr 1fr} }
  .hsl{display:grid; grid-template-columns:120px minmax(0,1fr) 80px; gap:10px; align-items:center; margin:8px 0}
  .hsl input{width:100%; accent-color:var(--tc)}
  .hsl output{font-family:"IBM Plex Mono",monospace; text-align:right}
  @media (max-width:560px){ .hsl{grid-template-columns:1fr 86px} .hsl label{grid-column:1 / -1} }
  .gaugewrap{display:flex; flex-direction:column; align-items:center; width:92px; flex:none; gap:4px}
  .gauge{position:relative; flex:1; width:34px; min-height:180px; background:var(--paper); border:1px solid var(--line); border-radius:6px; overflow:visible}
  .gauge .fill{position:absolute; left:0; right:0; bottom:0; background:var(--lift-l); border-radius:0 0 5px 5px}
  .gauge .wline{position:absolute; left:-6px; right:-6px; height:0; border-top:3px solid var(--weight-l)}
  .gaugewrap .gv{font-family:"IBM Plex Mono",monospace; font-size:.85rem; color:var(--lift-l); text-align:center}
  .gaugewrap .gw{position:absolute; left:50%; transform:translate(-50%, -100%); margin-top:-4px; width:96px; font-size:.7rem; color:var(--weight-l); text-align:center; line-height:1.15; background:var(--stage); border-radius:4px; padding:1px 2px}
  .gauge .wlbl{position:absolute; left:50%; height:0}
  @media (max-width:560px){ .gaugewrap{width:62px} .gaugewrap .gw{width:62px; font-size:.64rem} .gauge{width:26px} }
  .legend{display:flex; flex-wrap:wrap; gap:6px 16px; margin:4px 2px 8px; font-size:.86rem; color:var(--ink-soft)}
  .legend span{display:inline-flex; align-items:center; gap:6px}
  .legend i{display:inline-block; width:24px; height:0; border-top:2px solid}
  .legend i.bold{border-top-width:4px}
  .legend button{font:inherit; color:inherit; display:inline-flex; align-items:center; gap:6px; background:none; border:1px dashed var(--line); border-radius:999px; padding:2px 10px; cursor:pointer}
  .legend button[aria-pressed="true"]{border-style:solid; background:var(--card); color:var(--ink)}
  .legend button[aria-pressed="false"] i{opacity:.45}
  .flt{border-collapse:collapse; margin:6px 0; font-size:.93rem; width:100%; max-width:640px}
  .flt th,.flt td{border:1px solid var(--line); padding:5px 10px; text-align:center}
  .flt th{background:var(--line-soft); font-weight:600}
  .flt .tick{color:var(--ok); font-weight:700}
  .tablewrap{overflow-x:auto}

  /* side trail */
  .choices{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:10px 0}
  @media (max-width:700px){ .choices{grid-template-columns:1fr} }
  .choice{display:flex; gap:10px; align-items:flex-start; border:1px solid var(--line); background:var(--paper); border-radius:8px; padding:10px 12px; cursor:pointer}
  .choice:hover{border-color:var(--tc)}
  .choice input{margin-top:5px; accent-color:var(--tc)}
  .choice.on{border-color:var(--tc); background:var(--tsoft)}
  .field{margin:10px 0}
  .field label{display:block; font-weight:700; margin-bottom:4px}

  /* teach-back conversation */
  .chat{display:flex; flex-direction:column; gap:8px; max-height:460px; overflow-y:auto; padding:12px; border:1px solid var(--line); border-radius:10px; background:var(--stage); margin:10px 0}
  .say{max-width:82%; padding:9px 13px; border-radius:12px; line-height:1.5}
  .say .who{display:block; font-size:.72rem; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft); margin-bottom:2px}
  .say.them{align-self:flex-start; background:var(--card); border:1px solid var(--line)}
  .say.me{align-self:flex-end; background:var(--tsoft); border:1px solid var(--tc)}
  .say.wait{color:var(--ink-soft); font-style:italic}

  /* copy my work to submit: stays on screen on every level */
  body{padding-bottom:84px}
  /* the button sits on its own strip, so nothing on the page is ever under it */
  html{scroll-padding-bottom:84px}   /* room for the strip that holds Copy my work, when the page scrolls to something */
  body.hasfab::after{content:''; position:fixed; left:0; right:0; bottom:0; height:70px; background:var(--paper); border-top:1px solid var(--line); z-index:39}
  #subfab[hidden]{display:none}
  @media (max-width:520px){ body #subfab{font-size:.85rem; line-height:1.3; padding:7px 14px; bottom:7px; max-width:calc(100vw - 36px)} }
  #subfab{position:fixed; right:18px; bottom:13px; z-index:40; border-radius:999px; padding:11px 20px; box-shadow:0 6px 22px rgba(0,0,0,.55)}
  #subbox{position:fixed; right:18px; bottom:74px; z-index:40; width:min(520px, calc(100vw - 36px)); max-height:70vh; overflow:auto; background:var(--card); border:1px solid var(--tc); border-radius:12px; padding:12px 14px; box-shadow:0 10px 34px rgba(0,0,0,.6)}
  #subfab.warn{background:var(--bad); border-color:var(--bad); color:#2A0B08}
  #subbox .editor{font-size:.8rem}
  .clearwrap{margin:16px 0 0; font-size:.88rem}
  .linkbtn{font:inherit; background:none; border:none; color:var(--ink-soft); text-decoration:underline; cursor:pointer; padding:2px 0}
  .linkbtn:hover{color:var(--bad)}
  .ai-helper{margin:18px 0 0; border:1px solid var(--line); border-radius:8px; padding:0 16px; font-size:.95rem; line-height:1.5; background:var(--card)}
  .ai-helper summary{cursor:pointer; padding:10px 0; font-weight:700}
  .ai-helper p{margin:0 0 12px}
  /* level 5: inside the simulation */
  .runner{margin:14px 0 6px}
  .runner iframe{display:block; width:100%; height:660px; border:1px solid var(--line); border-radius:10px; background:#fff}
  @media (max-width:1014px){ .runner iframe{height:1000px} }
  .parth{font-size:1.3rem; margin:2px 0 12px}
  .pmap{display:flex; flex-direction:column; gap:8px; margin:14px 0; padding:12px; border:1px solid var(--line); border-radius:10px; background:var(--stage)}
  .pgroup{border:1px dashed var(--line); border-radius:10px; padding:8px 10px 10px; display:flex; flex-direction:column; gap:8px}
  .pgroup.in{flex-direction:row; flex-wrap:wrap}
  .pgroup.in > .lbl{flex-basis:100%}
  .pbox{font:inherit; text-align:left; border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:8px; padding:8px 12px; cursor:pointer; display:flex; gap:8px; align-items:center; flex:none}
  .pgroup.in .pbox{flex:1 1 220px}
  .pbox:hover{border-color:var(--tc)}
  .pbox.cur{border-color:var(--tc); background:var(--tsoft); font-weight:700}
  .pbox.done .pn{background:var(--ok); color:#04130C}
  .pbox:disabled{opacity:.5; cursor:not-allowed}
  .pbox:disabled:hover{border-color:var(--line)}
  .pbox.fixed{cursor:default; color:var(--ink-soft); flex:none}
  .pbox.fixed:hover{border-color:var(--line)}
  .pn{display:inline-grid; place-items:center; width:22px; height:22px; border-radius:50%; background:var(--line-soft); font-family:"IBM Plex Mono",monospace; font-size:.74rem; flex:none}
  .pn svg{width:11px; height:11px}
  .split{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:10px; align-items:start}
  @media (max-width:860px){ .split{grid-template-columns:1fr} }
  .codep{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:4px}
  .cl{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:2px 12px; align-items:baseline; border:1px solid var(--line); border-left:4px solid var(--line); background:var(--card); border-radius:6px; padding:6px 10px}
  .cl.in{margin-left:18px}
  .cl code{font-size:.88rem; color:#DCE7F3; white-space:pre-wrap}
  .cl .val{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace; font-size:.9rem; color:var(--blaze); text-align:right; font-weight:600}
  .cl .gl{grid-column:1 / -1; font-size:.84rem; color:var(--ink-soft)}
  .cl.cur{border-left-color:var(--blaze); background:#16130A}
  .cl.head{border-style:dashed; background:transparent}
  .togs{display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin:10px 0 4px}
  .speeds .muted{align-self:center}
  .pzl{list-style:none; margin:8px 0; padding:0; display:flex; flex-direction:column; gap:6px}
  .pzi{display:flex; justify-content:space-between; gap:10px; align-items:center; border:1px solid var(--line); background:var(--card); border-radius:8px; padding:6px 8px 6px 12px; cursor:grab}
  .pzi code{font-size:.9rem; white-space:pre-wrap; min-width:0; overflow-wrap:anywhere}

<!-- Text sent with each "Get AI feedback" request. Not shown on the page. -->
<script type="text/plain" id="ai-system">
You are a teaching assistant for CST286, an introductory physics course for computing students. The student is working through an interactive page called 'How your phone counts your steps'. It shows a person walking with a phone in a pocket, the forces on the phone (its weight and the pocket's push), the accelerometer inside the phone (a small mass on a spring), and the signal the phone uses to count steps. The student has written a short explanation in answer to one question. You will receive the question, private notes on what a sound explanation contains, what the student has done on the page, and the student's explanation.

Write feedback addressed to the student as "you". Use plain words and 3 to 5 sentences. No headings, no lists, no formulas the student did not use.

First say what is right in the explanation, specifically, using a few of the student's own words. Then name the one most important gap or mistake in the reasoning, if there is one, and say what is missing without writing the missing part for them. Then ask one question that would lead them to it, and point to what to watch on the simulation: which arrow, which number, or which slider setting.

If the explanation is complete and correct, say so plainly, and ask one question that tests it in a nearby situation.

Never write the full correct explanation for the student, and do not give them numbers they have not given you. If the explanation is off the topic of the question, ask them to describe what they saw on the simulation first. Do not praise in general terms.

The simulation has Pause and slow motion. It has no way to slide to a chosen moment; do not tell the student to.

Never supply what the student left out or got wrong. Say which part does not hold up or is not there yet, and ask one question.

If you point to the page, point only to a control, a drawing or a readout named under 'At this stop' in the notes. If the thing to look at is at another level, name that level.
</script>
<script type="text/plain" id="ai-notes-1">
A sound explanation says that at the lowest point of the wave the phone's up-and-down motion turns around, from moving down to moving up. Turning the motion around is an upward acceleration. By Newton's second law an upward acceleration needs a net upward force, so the pocket's push must be larger than the phone's weight there. At the top of the wave the opposite happens and the push is smaller than the weight. Common gaps: saying only 'because the foot hits the ground' without connecting it to acceleration or net force; thinking the force is largest where the phone moves fastest; mixing up the phone's position with the force on it. At this stop the student sees a side view of a person walking in place with a phone in the hip pocket, a dotted trail of the phone's wave, and a badge with the steps counted. Controls: Pause, the speed buttons (1x, 0.25x, 0.1x, 0.05x), the Walking pace slider and the Bounce of the hip slider. There are no arrows and no numbers for force or acceleration at this stop; those are at Level 2.
</script>
<script type="text/plain" id="ai-notes-2">
A sound explanation says that standing still means zero acceleration, and zero acceleration means zero net force, not zero forces. The Earth still pulls the phone down with its weight, so the pocket must push up with an equal force to balance it. If the push were zero, the weight would be unbalanced and the phone would accelerate downward. Common gaps: 'no motion means no force'; forgetting that the weight still acts; not separating the net force from the individual forces. At this stop the student sees the phone drawn large with three arrows: its weight (purple, pointing down), the pocket's push (teal, pointing up) and the net force and acceleration (amber), and a live line 'pocket push − weight = mass × acceleration' with numbers. Controls: Pause, the speed buttons, the Walking pace slider and the Bounce of the hip slider. A walking pace of 0 is standing still.
</script>
<script type="text/plain" id="ai-notes-3">
A sound explanation says that the sensor does not measure the phone's acceleration directly; it measures how much the spring holding the small mass is stretched. At rest, gravity still pulls the small mass down, so the spring must stay stretched enough to hold it up, and that amount of stretch is what the phone reports as 9.8 m/s². When the phone accelerates up or down, the stretch grows or shrinks, and the reading moves above or below 9.8. Common gaps: saying 'gravity accelerates the phone at 9.8 m/s²' although the phone is not accelerating; not mentioning the spring or the stretch; treating 9.8 as an error in the sensor. At this stop the student sees the inside of the sensor: a frame, a small mass on a spring, a ruler with the reading in m/s², and the live line 'reading = 9.8 m/s² + acceleration of the phone'. Controls: Pause, the speed buttons, the Walking pace slider and the Bounce of the hip slider. There are no force arrows at this stop; those are at Level 2.
</script>
<script type="text/plain" id="ai-notes-4">
A sound explanation follows the whole chain. Each step turns the phone's motion around from down to up, which needs a push from the pocket larger than the phone's weight, so the phone accelerates upward. Inside the sensor the spring stretches more, so the reading rises above the resting 9.8 m/s². The phone counts a step each time the reading climbs above the count line. A strong explanation also names a limit: slow steps give a smaller acceleration and may never reach the count line, and jostling can cross the line without a step. The student was asked to use the words force, acceleration and count line. At this stop the student sees a graph of the reading over the last six seconds with the count line, a dashed line at 9.8, a dot at each counted step and a tick at each landing; two counters, Feet landed and Phone counted; the sliders Count line and Pocket jostle; the buttons Test my prediction, Run for 20 seconds, Run the stroll for 20 seconds and Run the brisk walk for 20 seconds; and Pause, the speed buttons, the Walking pace slider and the Bounce of the hip slider. There are no force arrows at this stop; those are at Level 2.
</script>
<script type="text/plain" id="ai-notes-5">
A sound explanation says that the program works out the reading 50 times a second from the phone's acceleration (reading = 9.8 + acceleration), and counts a step when one reading is below the count line and the next is at or above it. The stroll was missed because at 60 steps per minute the highest reading is about 10.79 m/s², below the count line of 11.0, so the reading never climbs through the line. A strong explanation adds that the pace is squared in the acceleration, or that readings too far apart can miss the hill. Common gaps: "it counts when the reading is high" without the climb through the line; blaming the bounce, which did not change; not naming the count line. Note: at some paces a 20-second run ends between a climb through the line and the landing that follows, so the count can be one more than the feet landed; that is not an error in the student's work. At this stop the student sees the program in a runner with Run and Reset to original, a graph of the reading against time with the count line and a dot at each count, and the RESULT line above the graph. The student changes a number by editing its line (pace, bounce, count_line, run_time, dt, min_gap, or a line of the loop) and pressing Run. The runner has no Pause, no slow motion and no slider. In Part 3 the student was asked to try a time between readings of 0.5 s at 120 steps per minute, where the program counts nothing; a student who describes that is describing the experiment they were asked to do, not the usual 0.02 s.
</script>
<script type="text/plain" id="ai-plan-question">
The student is planning a short side trail of their own after finishing the learning trail. Their plan has three parts: the question, what they expect to find, and what they will change or measure.
</script>
<script type="text/plain" id="ai-plan-notes">
A sound plan has one specific question that can be answered with about 20 minutes of work; a concrete action (a change to the program and what to read in its RESULT line, a calculation with the relationship for the highest reading, a measurement with a sensor app on a real phone, or named sources to read); and a prediction with a reason, with numbers where the question allows it. Help the student sharpen the weakest of the three parts. Do not answer their question or tell them what they will find. If you point to the page, point only to what exists: at Levels 1 to 4, Pause, the speed buttons, the Walking pace and Bounce of the hip sliders, and at Level 4 the Count line and Pocket jostle sliders; in the program, the student changes a number by editing its line and pressing Run, and reads the RESULT line. The runner has no Pause and no slow motion. You do not see the student's earlier runs: never say where a number in their plan came from; if a comparison depends on an earlier run, ask them to check that it used the same settings.
</script>

/*MODEL-START*/
// Pure model: no DOM. The page's simulation at Levels 1 to 4 (unchanged from the page of 17 Nov 2026).
var MODEL = (function () {
  var G = 9.8;            // m/s^2
  var MASS = 0.20;        // kg, the phone
  var DT = 0.01;          // s, fixed internal timestep
  var SAMPLES_PER = 2;    // sample every 2 steps = 0.02 s
  var MIN_GAP = 0.25;     // s between counted steps
  var SMOOTH_N = 3;       // signal = mean of last 3 samples
  var TWO_PI = 2 * Math.PI;

  function cadenceHz(spm) { return spm / 60; }
  function amplitudeM(bounceCm) { return (bounceCm / 2) / 100; }
  function hipHeight(A, phi) { return -A * Math.cos(phi); }
  function phoneAccel(A, f, phi) { var w = TWO_PI * f; return A * w * w * Math.cos(phi); }
  function weightForce() { return MASS * G; }
  function pocketPush(a) { return MASS * (G + a); }
  function netForce(a) { return MASS * a; }
  function sensorReading(a) { return G + a; }
  function peakReading(A, f) { var w = TWO_PI * f; return G + A * w * w; }

  function makeRng(seed) {
    var s = (seed >>> 0) || 1;
    return function () {
      s = (s + 0x6D2B79F5) >>> 0;
      var t = s;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function gaussian(rng) {
    var u = 0;
    while (u === 0) u = rng();
    var v = rng();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(TWO_PI * v);
  }

  function state(sim) {
    var p = sim.params;
    var A = amplitudeM(p.bounce), f = cadenceHz(p.spm);
    var a = phoneAccel(A, f, sim.phi);
    return {
      A: A, f: f, phi: sim.phi, a: a,
      y: hipHeight(A, sim.phi),
      W: weightForce(), P: pocketPush(a), net: netForce(a),
      r: sensorReading(a), peak: peakReading(A, f)
    };
  }

  function createSim(opts) {
    opts = opts || {};
    var sim = {
      params: { spm: 110, bounce: 5, threshold: 11.0, noise: 0 },
      t: 0, n: 0,
      phi: Math.PI,           // start mid-step, hip at its highest
      feet: 0, counted: 0,
      lastCount: -Infinity,
      samples: [], signal: G,
      rng: makeRng(opts.seed == null ? 12345 : opts.seed),
      keep: opts.keep == null ? 8 : opts.keep,   // seconds of history kept
      hist: { sig: [], hip: [], counts: [], feet: [] }
    };
    if (opts.params) for (var k in opts.params) sim.params[k] = opts.params[k];
    var r0 = state(sim).r;
    sim.samples = [r0, r0, r0];
    sim.signal = r0;
    return sim;
  }

  function trim(arr, tMin) {
    var i = 0;
    while (i < arr.length && arr[i].t < tMin) i++;
    if (i > 0) arr.splice(0, i);
  }

  function stepSim(sim) {
    var p = sim.params;
    var f = cadenceHz(p.spm);
    var old = sim.phi;
    sim.phi += TWO_PI * f * DT;
    sim.t += DT;
    sim.n += 1;
    if (Math.floor(sim.phi / TWO_PI) > Math.floor(old / TWO_PI)) {
      sim.feet += 1;
      sim.hist.feet.push({ t: sim.t, phi: Math.floor(sim.phi / TWO_PI) * TWO_PI });
    }
    if (sim.n % SAMPLES_PER === 0) {
      var st = state(sim);
      var r = st.r + (p.noise > 0 ? p.noise * gaussian(sim.rng) : 0);
      sim.samples.push(r);
      while (sim.samples.length > SMOOTH_N) sim.samples.shift();
      var sum = 0;
      for (var i = 0; i < sim.samples.length; i++) sum += sim.samples[i];
      var s = sum / sim.samples.length;
      var prev = sim.signal;
      if (prev < p.threshold && s >= p.threshold && (sim.t - sim.lastCount) >= MIN_GAP - 1e-9) {
        sim.counted += 1;
        sim.lastCount = sim.t;
        sim.hist.counts.push({ t: sim.t, s: s });
      }
      sim.signal = s;
      sim.hist.sig.push({ t: sim.t, s: s });
      sim.hist.hip.push({ t: sim.t, y: st.y });
      var tMin = sim.t - sim.keep;
      trim(sim.hist.sig, tMin); trim(sim.hist.hip, tMin);
      trim(sim.hist.counts, tMin); trim(sim.hist.feet, tMin);
    }
  }

  // Advance by dtSim seconds of simulation time using the fixed 0.01 s step.
  function advanceSim(sim, dtSim) {
    sim.acc = (sim.acc || 0) + dtSim;
    while (sim.acc >= DT - 1e-12) { stepSim(sim); sim.acc -= DT; }
  }

  function runFor(sim, seconds) {
    var steps = Math.round(seconds / DT);
    for (var i = 0; i < steps; i++) stepSim(sim);
    return sim;
  }

  function resetCounts(sim) {
    sim.feet = 0; sim.counted = 0; sim.lastCount = -Infinity;
    sim.hist.counts = []; sim.hist.feet = [];
  }

  return {
    G: G, MASS: MASS, DT: DT, MIN_GAP: MIN_GAP,
    cadenceHz: cadenceHz, amplitudeM: amplitudeM, hipHeight: hipHeight,
    phoneAccel: phoneAccel, weightForce: weightForce, pocketPush: pocketPush,
    netForce: netForce, sensorReading: sensorReading, peakReading: peakReading,
    makeRng: makeRng, gaussian: gaussian, state: state,
    createSim: createSim, stepSim: stepSim, advanceSim: advanceSim,
    runFor: runFor, resetCounts: resetCounts
  };
})();
/*MODEL-END*/

      for (let s = 0; s <= 2; s += 0.5){ ctx.beginPath(); ctx.moveTo(X(s), m.t); ctx.lineTo(X(s), top); ctx.stroke(); ctx.fillText(s + ' s', X(s), top + 4); }

      for (let k = 0; k <= 2 * f + 1; k++){ const tl = (k - 0.5) / f; if (tl < 0 || tl > 2) continue; ctx.beginPath(); ctx.moveTo(X(tl), top - 10); ctx.lineTo(X(tl), top); ctx.stroke(); }
      ctx.strokeStyle = '#2f6fed'; ctx.lineWidth = 3; ctx.beginPath();
      for (let t = 0; t <= 2.0001; t += 0.01){ const y = -A * Math.cos(2 * Math.PI * (f * t + 0.5)); if (t === 0) ctx.moveTo(X(t), Yh(y)); else ctx.lineTo(X(t), Yh(y)); }
      ctx.stroke();
      const v = PROG.acc(c.spm, 0.05, c.t), yd = -A * Math.cos(v.angle);
      ctx.fillStyle = '#B3261E'; ctx.beginPath(); ctx.arc(X(c.t), Yh(yd), 7, 0, 7); ctx.fill();
      // the acceleration as an arrow under the wave: up is positive
      const base = top + 30 + (H - top - 30) / 2, k = Math.min(10, (H - top - 50) / 2 / 5.5), x = X(c.t), tip = base - v.acceleration * k;
      ctx.strokeStyle = 'rgba(27,37,51,.35)'; ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.moveTo(m.l, base); ctx.lineTo(W - m.r, base); ctx.stroke(); ctx.setLineDash([]);
      arrow(ctx, x, base, x, tip, '#C46F00', {width:4.5});
      label(ctx, 'acceleration ' + v.acceleration.toFixed(2) + ' m/s²', [x, Math.abs(tip - base) < 6 ? base - 6 : tip], [0, tip <= base ? -1 : 1], '#8A4A00', used, B);
    };
    const paint = () => {
      const v = PROG.acc(c.spm, 0.05, c.t);
      $('#l5t-o').textContent = c.t.toFixed(2) + ' s'; $('#l5v-o').textContent = String(c.spm);
      [v.turns.toFixed(2), v.angle.toFixed(2), v.acceleration.toFixed(2) + ' m/s²'].forEach((t, i) => { $('#wv' + i + 'v').textContent = t; });
      draw();
    };
    [['#l5t', 't'], ['#l5v', 'spm']].forEach(a => { const r = $(a[0]); r.value = c[a[1]]; r.oninput = () => { c[a[1]] = +r.value; save(); paint(); }; });
    paint();
    return draw;
  }
  /* Part 3: the readings the program sees, for the time between readings on the slider */
  function readsBox(){
    const c = S.prog.c3, R = L5.reading, cv = $('#c5r');
    const draw = () => {
      const {ctx, W, H} = fit(cv, 260), m = {l:40, r:14, t:14, b:30}, span = 2, X = t => m.l + t / span * (W - m.l - m.r), Y = v => H - m.b - (v - 4) / 12 * (H - m.t - m.b);
      stage(ctx, W, H);
      ctx.font = axisFont; ctx.fillStyle = '#3A4756'; ctx.strokeStyle = 'rgba(27,37,51,.18)'; ctx.lineWidth = 1;
      ctx.textAlign = 'right'; ctx.textBaseline = 'middle'; for (let v = 4; v <= 16; v += 4){ ctx.beginPath(); ctx.moveTo(m.l, Y(v)); ctx.lineTo(W - m.r, Y(v)); ctx.stroke(); ctx.fillText(String(v), m.l - 6, Y(v)); }
      ctx.textAlign = 'center'; ctx.textBaseline = 'top'; for (let s = 0; s <= span; s += 0.5) ctx.fillText(s + ' s', X(s), H - m.b + 6);
      ctx.strokeStyle = '#c2334d'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(m.l, Y(11)); ctx.lineTo(W - m.r, Y(11)); ctx.stroke();
      ctx.strokeStyle = 'rgba(47,111,237,.45)'; ctx.lineWidth = 2; ctx.beginPath();
      for (let t = 0; t <= span + 1e-9; t += 0.005){ const r = 9.8 + PROG.acc(120, 0.05, t).acceleration; if (t === 0) ctx.moveTo(X(t), Y(r)); else ctx.lineTo(X(t), Y(r)); }
      ctx.stroke();
      const run = PROG.run(120, 0.05, 11, span, c.dt);
      run.reads.forEach(p => { ctx.fillStyle = p.yes ? '#c2334d' : '#1d2433'; ctx.beginPath(); ctx.arc(X(p.t), Y(p.r), p.yes ? 6 : 4, 0, 7); ctx.fill(); });
      ctx.font = '700 12px "Atkinson Hyperlegible", Arial, sans-serif'; ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
      ctx.fillStyle = 'rgba(255,255,255,.92)'; const lt = C.l4.lbl.line + '11.0', lw = ctx.measureText(lt).width + 10; rr(ctx, m.l + 4, Y(11) - 22, lw, 19, 5); ctx.fill(); ctx.fillStyle = '#c2334d'; ctx.fillText(lt, m.l + 9, Y(11) - 6);
    };
    const paint = () => {
      const run = PROG.run(120, 0.05, 11, 10, c.dt), per = Math.round(0.5 / c.dt * 10) / 10;
      $('#l5d-o').textContent = c.dt.toFixed(2) + ' s';
      $('#rd-line').textContent = tx(R.line, {r:per, n:run.steps});
      draw();
    };
    const r = $('#l5d'); r.value = c.dt; r.oninput = () => { c.dt = Math.round(+r.value * 100) / 100; save(); paint(); };
    paint();
    return draw;
  }
  /* Part 4: the counting rule, one reading at a time */
  function ruleBox(){
    const c = S.prog.c4, R = L5.count, cv = $('#c5c'), run = PROG.run(110, 0.05, 11, 1.2, 0.02), N = run.reads.length;
    const draw = () => {
      const {ctx, W, H} = fit(cv, 240), m = {l:40, r:14, t:14, b:30}, span = 1.2, X = t => m.l + t / span * (W - m.l - m.r), Y = v => H - m.b - (v - 6) / 9 * (H - m.t - m.b);
      stage(ctx, W, H);
      ctx.font = axisFont; ctx.fillStyle = '#3A4756'; ctx.strokeStyle = 'rgba(27,37,51,.18)'; ctx.lineWidth = 1;
      ctx.textAlign = 'right'; ctx.textBaseline = 'middle'; for (let v = 6; v <= 15; v += 3){ ctx.beginPath(); ctx.moveTo(m.l, Y(v)); ctx.lineTo(W - m.r, Y(v)); ctx.stroke(); ctx.fillText(String(v), m.l - 6, Y(v)); }
      ctx.textAlign = 'center'; ctx.textBaseline = 'top'; for (let s = 0; s <= 1.2 + 1e-9; s += 0.4) ctx.fillText(s.toFixed(1) + ' s', X(s), H - m.b + 6);
      ctx.strokeStyle = '#c2334d'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(m.l, Y(11)); ctx.lineTo(W - m.r, Y(11)); ctx.stroke();
      run.reads.forEach((p, i) => { const cur = i === c.i, prev = i === c.i - 1; ctx.fillStyle = cur ? '#B3261E' : prev ? '#C46F00' : i < c.i ? 'rgba(29,36,51,.75)' : 'rgba(29,36,51,.25)'; ctx.beginPath(); ctx.arc(X(p.t), Y(p.r), cur || prev ? 6 : 3, 0, 7); ctx.fill(); if (p.yes && i <= c.i){ ctx.strokeStyle = '#c2334d'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(X(p.t), Y(p.r), 10, 0, 7); ctx.stroke(); } });
      ctx.font = '700 12px "Atkinson Hyperlegible", Arial, sans-serif'; ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
      ctx.fillStyle = 'rgba(255,255,255,.92)'; const lt = C.l4.lbl.line + '11.0', lw = ctx.measureText(lt).width + 10; rr(ctx, W - m.r - lw - 4, Y(11) - 22, lw, 19, 5); ctx.fill(); ctx.fillStyle = '#c2334d'; ctx.fillText(lt, W - m.r - lw + 1, Y(11) - 6);
    };
    const paint = () => {
      c.i = Math.max(0, Math.min(N - 1, c.i | 0));
      const p = run.reads[c.i], a = p.last, b = p.r, w = p.yes ? R.ans.yes : a >= 11 && b >= 11 ? R.ans.above : a < 11 && b < 11 ? R.ans.below : a >= 11 ? R.ans.down : R.ans.yes;
      $('#cr-line').textContent = 't = ' + p.t.toFixed(2) + ' s · ' + tx(R.line, {a:a.toFixed(2), b:b.toFixed(2), w});
      $('#cr-back').disabled = c.i === 0; $('#cr-next').disabled = c.i === N - 1;
      ['cr0', 'cr1', 'cr2', 'cr3'].forEach((id, k) => { const el = $('#' + id); if (el) el.classList.toggle('cur', k === 0 || (p.yes && (k === 1 || k === 2)) || k === 3); });
      draw();
    };
    $('#cr-next').onclick = () => { c.i++; save(); paint(); };
    $('#cr-back').onclick = () => { c.i--; save(); paint(); };
    paint();
    return draw;
  }

  VIEW.code = function(l){

    const nextBtn = () => '<div class="row"><button type="button" class="btn" id="pnext">' + esc(L5.zoom[P]) + ' &rarr;</button></div><div class="muted" id="pwhy" role="status"></div>';
    const partHead = () => '<div class="step"><div class="eyebrow">' + esc(P === 5 ? L5.partAll : L5.partOf.replace('{n}', P)) + '</div><h3 class="parth">' + esc(L5.parts[P]) + '</h3>';

      h += '<p class="guide" id="l5second">' + esc(L5.second) + '</p>' + blocks(L5.intro) + sect(1, L5.runTitle) + blocks(L5.run) + runner() + blocks(L5.runAfter) + sect(2, L5.builtTitle) + blocks(L5.built) + pmapHTML() + nextBtn();

        wonderHTML(R.wonder) + sect(3, T.solve) + prHTML('prRule') + sect(4, T.build) + pzHTML('pzRule') + nextBtn() + '</div>';

        '<div id="tgrun"' + (shown((K.pred || '').trim()) ? '' : ' hidden') + '>' + sect(2, R.s2) + blocks(R.run) + runner() + sect(3, R.s3) + blocks(R.test) + sect(4, R.s4) + exHTML('exProg', C.explain.exProg) + '</div></div>';

  function exReport(L, k, q){
    const E = S.ex[k] || {text:'', rounds:[], asks:0};
    L.push(q);
    if (E.rounds.length){
      E.rounds.forEach((r, i) => { L.push('Version ' + (i + 1) + ', what I wrote before asking for feedback:', r.sent, 'AI feedback on version ' + (i + 1) + ':', r.fb); });

ons below can.", "fbTitle": "Feedback on your explanation", "fbPart": "The feedback came back without a line for each idea, so no idea is marked from it. Press Try the feedback again.", "fbSaid": "You said: “{q}”.", "fbPartly": "The reasoning for this idea is not complete in your explanation yet. It was taught at {level}, and a question on it follows below.", "fbNot": "Your explanation did not get to this idea. It was taught at {level}, and a question on it follows below.", "marks": {"explained": "explained", "partly explained": "partly explained", "not reached": "not reached"}, "qHead": "One question for each idea that is still open", "qLocked": "The questions open when the three conversations above are finished.", "qNone": "All {n} ideas are confirmed. There is nothing left to answer here. If you want to go further, each idea has a harder question.", "ideaLbl": "Idea {n}", "answer": "Your answer", "check": "Check my answer", "checking": "Reading your answer...", "sound": "This idea is confirmed.", "hardSound": "Your answer to the harder question is sound.", "back": "This idea was taught at {level}. You can go back to it and return here; your answers are kept.", "backBtn": "Go to {level}", "hard": "Do you want a harder one?", "down": "The helper is not answering right now. Your answer is saved here, and you can check it again in a moment.", "privacy": "What you type here is sent to the course AI helper so that it can reply. The course does not store it, and it is kept only in this browser."};
  const ENDC = { "count": "six", "ideas": [{"t": "Each step reverses the phone's up-and-down motion.", "d": "The phone rides a wave, and the pocket pushes hardest at the bottom, where the motion turns from down to up.", "level": "Level 1", "lv": 1, "c": "the push is largest at the lowest point, where the motion turns from down to up; turning it around is an upward acceleration and needs a push larger than the weight.", "e": "At which moment of a step does the pocket push up on the phone the hardest, and why at that moment?", "se": "at the lowest point of the wave, as the foot lands; there the phone's motion turns from downward to upward, and turning it around is an upward acceleration, which needs a push larger than the weight.", "h": "A person rides a smooth elevator that rises at a constant speed. Their phone is in their pocket and they stand still. Does the pocket push harder than it does on the ground? Explain.", "sh": "no; at a constant speed the phone is not accelerating, so the push equals the weight, the same as standing on the ground. Saying when the push would change is welcome and not required."}, {"t": "The push changes, the weight does not.", "d": "Pocket push minus weight equals mass times acceleration, so standing still means zero net force, not zero force.", "level": "Level 2", "lv": 2, "c": "push minus weight equals mass times acceleration; the weight does not change; standing still the acceleration is zero, so the push equals the weight.", "e": "The person stands still. How large is the pocket's push compared with the phone's weight, and how do you know?", "se": "equal to the weight (1.96 N for this phone); standing still the phone does not accelerate, so the net force is zero, which means the push and the weight balance.", "h": "At the top of the wave the 0.20 kg phone accelerates downward at 2.0 m/s². How hard is the pocket pushing on it? Explain how you got it.", "sh": "1.56 N; the net force is mass times acceleration, 0.20 × 2.0 = 0.40 N, pointing down; so the push is smaller than the 1.96 N weight by 0.40 N."}, {"t": "What the sensor measures.", "d": "It measures the stretch of a spring that holds a small mass, so it reads 9.8 m/s² at rest, and 9.8 plus the acceleration of the phone when it moves.", "level": "Level 3", "lv": 3, "c": "the sensor measures the stretch of a spring that holds a small mass; at rest the spring holds the mass up against gravity, and that stretch shows as 9.8 m/s².", "e": "(a) What does the sensor inside the phone actually measure? (b) Why does it read 9.8 m/s² when the phone lies still on a table?", "se": "both parts: (a) how far a spring that holds a small mass is stretched; (b) at rest the spring still has to hold the mass up against gravity, and that much stretch is what the phone reports as 9.8 m/s².", "h": "You drop the phone, and for a moment it falls freely. What does the sensor read while it falls? Explain.", "sh": "about zero, with one of these two reasons (either is enough): the frame and the small mass fall together, so the spring does not have to hold the mass up and is not stretched; or the reading is 9.8 plus the phone's acceleration, and the acceleration is 9.8 downward."}, {"t": "Pace counts more than bounce.", "d": "Doubling the bounce doubles the extra reading. Doubling the pace makes it four times larger.", "level": "Level 4", "lv": 4, "c": "the extra reading grows with the bounce and with the pace squared; doubling the pace makes it four times larger.", "e": "Two changes to a walk: double the bounce, or double the pace. What does each do to the extra reading above 9.8, and why are they different?", "se": "doubling the bounce doubles the extra reading; doubling the pace makes it four times larger; the pace is squared in the relationship (the phone moves twice as fast and has half the time to turn around).", "h": "A walker has a 4 cm bounce at 90 steps per minute. What is the highest reading, and would a count line of 11.0 m/s² count the steps? Show the calculation.", "sh": "A = 0.02 m and f = 1.5 steps per second; 9.8 + 0.02 × (2π × 1.5)² is about 11.6 m/s²; that is above 11.0, so the steps are counted."}, {"t": "A counting rule can be wrong in two ways.", "d": "A count line that is too high misses slow steps, and one that is too low counts jostle.", "level": "Level 4", "lv": 4, "c": "a count line that is too high misses slow steps; one that is too low counts shaking that is not a step.", "e": "Give one way a count line set too high goes wrong, and one way a count line set too low goes wrong.", "se": "too high, the reading of a slow walk never climbs above the line, so steps are missed; too low, the random shaking of a pocket crosses the line without a step, so extra steps are counted.", "h": "Your phone counts 30 steps while you sit on a bumpy bus. An engineer says: \"Raise the count line.\" What does that fix, and what does it cost? Explain.", "sh": "a higher line is crossed less often by the bumps, so fewer false steps are counted; but slow or gentle steps have a low highest reading and will now be missed; no single line removes both errors."}, {"t": "How the program turns a walk into a count.", "d": "It works out the reading many times a second and counts a step each time the reading climbs through the count line.", "level": "Level 5", "lv": 5, "c": "the program works out the reading many times a second and counts a step when the reading climbs from below the count line to at or above it.", "e": "Describe what the program does at each reading to decide whether to count a step.", "se": "it works out the reading (9.8 plus the acceleration at that moment); it compares it with the last reading; if the last one was below the count line and this one is at or above it, it adds one step. Mentioning the shortest time between two counts, or that it keeps the reading for the next comparison, is welcome and not required.", "h": "At 120 steps per minute, a program that takes a reading every 0.5 s counts no steps at all. Why? What does that tell you about how often a phone has to read its sensor?", "sh": "one step lasts 0.5 s, so every reading falls at the same point of the step and has the same value; the reading never changes, so it never climbs through the line; the phone has to read several times within one step to see the hill."}],
    "teach": [{"ideas": [0, 1], "opener": "My phone says I walked 6,000 steps today, and it was in my pocket the whole time. It cannot see my feet. What can a phone in a pocket even feel when I take a step?", "ask": "If the student explains the push without the weight, ask: \"Wait, so when I stand still, is nothing pushing on the phone?\"", "slip": "that the phone feels its biggest push at the top of each step, when it is highest", "system": "You are playing a college classmate in CST286, an introductory physics course for computing students. You have not done the learning trail the student has just finished. What the trail showed them:\n- a phone in a pocket rides a wave, down and up once for every step; the pocket pushes up hardest at the lowest point, as the foot lands, because the phone's motion is being turned from downward to upward\n- two forces act on the phone: its weight, which never changes, and the pocket's push, which does; push minus weight equals mass times acceleration; standing still the push equals the weight\n- the phone's sensor is a small mass on a spring; it measures the stretch of the spring; at rest the spring holds the mass up, which shows as 9.8 m/s²; the reading is 9.8 plus the acceleration of the phone\n- the highest reading in a step is 9.8 + A × (2πf)², with A half of the bounce and f the steps per second; doubling the bounce doubles the extra reading and doubling the pace makes it four times larger\n- the phone counts a step each time the reading climbs through a count line; a line that is too high misses slow steps, and one that is too low counts the shaking of a loose pocket\n- a program works out the reading 50 times a second and counts when the last reading was below the line and the new one is at or above it, and at least a quarter of a second has passed since the last count; readings too far apart miss the steps\n\nThis is one of three short conversations. In this one your job is to get the student to explain two ideas by asking       askChat(cfg.system, wire).then(a => { const m = { r: 'a', t: String(a).replace(/\s*\[R\]\s*/g, ' ').trim() }; if (slipAsked && /\[R\]/.test(a)) m.w = 1; t.msgs.push(m); t.chatFail = false; }, () => { t.chatFail = true; endUI.err['tb' + i] = ENDW.chatFail; })   // the reply is kept either way
        .then(() => { endUI.busy = null; save(); endDraw(); const ta = document.getElementById('end-say-' + i); if (ta) ta.focus({ preventScroll: true }); });
    });
    $$('[data-end-fbk]', body).forEach(b => b.onclick = () => {
      const i = +b.dataset.endFbk, t = E.tb[i]; if (endUI.busy) return;
      if (endMine(t) < 2){ endUI.err['tb' + i] = ENDW.early; endDraw(); return; }
      if (endSlipOpen(t) && endMine(t) < END_MAX){ endUI.err['tb' + i] = ENDW.slipFirst; endDraw(); return; }
      endAskFeedback(i);
    });
    $$('[data-end-save]', body).forEach(b => b.onclick = () => { const i = +b.dataset.endSave; E.tb[i].saved = true; endUI.err['tb' + i] = ''; save(); endDraw(); });
    $$('[data-end-new]', body).forEach(b => b.onclick = () => {
      const i = +b.dataset.endNew, t = E.tb[i]; if (endUI.busy) return;
      if (endTbDone(t)) t.once = true;
      if (t.msgs.length){ (t.old = t.old || []).push({ msgs: t.msgs, fb: t.fb, saved: !!t.saved }); t.old = t.old.slice(-3); }   // an earlier conversation stays in the copied work
      t.msgs = []; t.fb = ''; t.marks = null; t.saved = false; t.chatFail = false; endUI.err['tb' + i] = ''; endUI.fbFail[i] = false; endUI.draft['tb' + i] = ''; save(); endDraw();
    });
    $$('textarea[id^="end-a-"]', body).forEach(ta => { const key = ta.id.slice(6), hard = key[0] === 'h', k = +key.slice(1); ta.oninput = () => { const Q = endQ(k); if (hard) Q.htext = ta.value; else Q.text = ta.value; save(); }; });
    $$('details[id^="end-hard-"]', body).forEach(d => d.ontoggle = () => { (endUI.hardOpen = endUI.hardOpen || {})[+d.id.slice(9)] = d.open; });
    $$('[data-end-go]', body).forEach(b => b.onclick = () => ENDC.go(+b.dataset.endGo));
    $$('[data-end-check]', body).forEach(b => b.onclick = () => {
      const key = b.dataset.endCheck, hard = key[0] === 'h', k = +key.slice(1), I = ENDC.ideas[k], Q = endQ(k), a = ((hard ? Q.htext : Q.text) || '').trim(); if (!a || endUI.busy) return;
      endUI.qmsg[key] = ''; endUI.busy = { q: key }; endDraw();
      const q = hard ? I.h : I.e, lab = (q.match(/\(([a-d])\)/g) || []).filter((x, n, all) => all.indexOf(x) === n).map(x => x[1]), need = Math.max(1, lab.length);
      const msgs = [{ role: 'user', content: 'The question:\n' + q + (lab.length > 1 ? '\n\nThis question has parts ' + lab.join(' and ') + ': write ' + lab.map(x => 'PART ' + x).join(' and ') + '.' : '') + '\n\nA sound answer contains (private, never quote this to the student):\n' + (hard ? I.sh : I.se) + '\n\nThe student\'s answer:\n' + a }];
      const ask = left => askFb(ENDC.checkSystem, msgs, 2).then(r => endVerdict(r, need) || left <= 0 ? r : ask(left - 1));
      const tries = hard ? Q.htries : Q.tries;
      ask(1).then(r => {
        const v = endVerdict(r, need);
        if (!v){ tries.push({ a, fb: '', raw: String(r || '').trim().slice(0, 1500), r: 'unchecked' }); endUI.qmsg[key] = ENDW.down; return; }   // an answer counts as an attempt even when it could not be checked
        tries.push({ a, fb: v.fb, r: v.sound ? 'sound' : 'notyet' });
        if (v.sound && !hard) E.conf[k] = true;
      }, () => { tries.push({ a, fb: '', r: 'unchecked' }); endUI.qmsg[key] = ENDW.down; })
        .then(() => { if (tries.length > 12) tries.splice(0, tries.length - 12); endUI.busy = null; save(); endDraw(); });
    });
  }
  // the ending in the copied work: every conversation, each feedback, each idea with its mark and every answer
  function endReport(L){
    const E = endState();
    L.push(ENDW.head, '');
    E.tb.forEach((t, i) => { const cfg = ENDC.teach[i];
      (t.old || []).forEach((o, j) => { L.push('Teach-back ' + (i + 1) + ' of 3, an earlier conversation (' + (j + 1) + '):', 'Classmate: ' + cfg.opener); o.msgs.forEach(m => L.push((m.r === 'u' ? 'Me: ' : 'Classmate: ') + m.t)); if (o.fb){ L.push('Feedback I received:'); endFbText(o.fb, cfg.ideas, o.msgs).forEach(x => L.push(x)); } L.push(''); });
      L.push('Teach-back ' + (i + 1) + ' of 3 (ideas ' + cfg.ideas.map(k => k + 1).join(' and ') + '):');
      if (!t.msgs.length){ L.push('  not started', ''); return; }
      L.push('Classmate: ' + cfg.opener); t.msgs.forEach(m => L.push((m.r === 'u' ? 'Me: ' : 'Classmate: ') + m.t));
      (t.hist || []).slice(0, -1).forEach((x, j) => { L.push('', 'Earlier feedback (' + (j + 1) + '):'); endFbText(x.fb, cfg.ideas, t.msgs).forEach(y => L.push(y)); });
      L.push('', t.fb ? 'Feedback I received:' : t.saved ? 'Feedback: not checked: the helper did not answer' : 'Feedback: not asked for yet'); if (t.fb) endFbText(t.fb, cfg.ideas, t.msgs).forEach(y => L.push(y)); L.push('');
    });
    L.push(endTxt(ENDW.listHead, { n: ENDC.count }));
    ENDC.ideas.forEach((I, k) => { const Q = E.q[k] || { tries: [], htries: [] };
      L.push((k + 1) + '. ' + I.t + ' ' + (E.conf[k] ? ENDW.yes : ENDW.no));
      const one = (q, x) => L.push('   Question: ' + q, '   My answer: ' + x.a, '   The helper\'s reply: ' + (x.r === 'unchecked' ? (x.raw ? 'not checked: the helper\'s reply could not be used. It wrote: ' + x.raw : 'not checked: the helper gave no reply the page could use') : (x.r === 'sound' ? 'SOUND. ' : 'NOT YET. ') + x.fb));
      Q.tries.forEach(x => one(I.e, x));
      (Q.htries || []).forEach((x, j) => { if (!j) L.push('   A harder question I chose to try:'); one(I.h, x); });
    });
  }
  endReady = true;

  /* ---------- Save my work, bring it back, and the 30-minute invitation (26 Nov 2026).
     The same code is on the three trails; only TSC differs. ---------- */
  var tsReady = false;
  const TSW = {"save": "Save my work", "back": "Bring back saved work", "ok": "Your work is copied. A Gmail message is opening in a new tab. Press Ctrl+V (Cmd+V on a Mac) under the line in the Gmail message. Then wait until Gmail shows that the draft is saved, or send it to yourself.", "okNoTab": "Your work is copied. Open a Gmail message with the link below, and press Ctrl+V (Cmd+V on a Mac) under its first line. Then wait until Gmail shows that the draft is saved, or send it to yourself.", "keep": "Keep the whole text, including the saved-data block at the end. It is needed to bring your work back.", "fail": "The page could not copy your work by itself. Select all of the text in the box below, copy it, and paste it into a Gmail message.", "gmail": "Open a Gmail message", "noTab": "If no new tab opened:", "subject": "My work on {trail}, saved {date}", "body": "Paste your saved work under this line.", "block": "Saved data for this page. Keep everything from the START line to the END line.", "backHow": "Open your draft, select everything (Ctrl+A or Cmd+A), copy it, and paste it here.", "backBtn": "Bring it back", "backBad": "This does not look like work saved from this trail. Copy the whole saved text, from its first line to its last, and paste it again.", "backAsk": "This replaces the work kept in this browser with the work you pasted. Bring it back?", "backYes": "Yes, bring it back", "backNo": "Cancel", "backDone": "Your saved work is back.", "invite": "You have been working on this trail for about 30 minutes. This is a good place to save your work. You can stop here and come back, or keep going."};
  const TSC = { id: 'cst286-step-counter', name: C.title, key: KEY, state: () => S, work: () => workReport(), count: () => LV.filter(l => l.done()).length };
  const TS_MIN = 30;   // minutes with the page open and visible before the invitation
  function tsStore(){ try { const j = JSON.parse(localStorage.getItem(TSC.key + '.save') || 'null'); if (j && typeof j === 'object') return j; } catch (e) {} return { ms: 0, n: null, shown: false }; }
  function tsPut(o){ try { localStorage.setItem(TSC.key + '.save', JSON.stringify(o)); } catch (e) {} }
  // the readable work, then the block that restores the page
  function tsText(){
    const b64 = btoa(unescape(encodeURIComponent(JSON.stringify(TSC.state())))), lines = b64.match(/.{1,72}/g) || [];
    return TSC.work() + '\n\n' + TSW.block + '\n=== TRAIL SAVE START ===\n' + TSC.id + ':\n' + lines.join('\n') + '\n=== TRAIL SAVE END ===\n';
  }
  // the state inside a pasted save, or null; spaces and line breaks inside the block are ignored
  function tsRead(txt){
    const m = String(txt || '').replace(/\u00a0/g, ' ').match(/===\s*TRAIL SAVE START\s*===([\s\S]*?)===\s*TRAIL SAVE END\s*===/);
    if (!m) return null;
    const body = m[1].replace(/[\s\u200b\ufeff>]/g, ''), i = body.indexOf(':');
    if (i < 0 || body.slice(0, i) !== TSC.id) return null;
    try { const o = JSON.parse(decodeURIComponent(escape(atob(body.slice(i + 1))))); return o && typeof o === 'object' && !Array.isArray(o) ? o : null; } catch (e) { return null; }
  }
  // called whenever the map is drawn: one more finished stop is a finished activity
  function tsProgress(){
    if (!tsReady) return;
    let n = 0; try { n = TSC.count(); } catch (e) { return; }
    const st = tsStore();
    if (st.n === null || st.n === undefined || n < st.n){ st.n = n; tsPut(st); return; }
    if (n > st.n){
      st.n = n;
      if ((st.ms || 0) >= TS_MIN * 60000 && !st.shown){ st.shown = true; const inv = document.getElementById('ts-invite'); if (inv) inv.hidden = false; }
      tsPut(st);
    }
  }
  function tsInit(){
    const stop = document.getElementById('stop'); if (!stop || document.getElementById('ts-area')) return;
    const el = id => document.getElementById(id), area = document.createElement('div'); area.id = 'ts-area'; area.className = 'ts';
    area.innerHTML = '<div class="msg info" id="ts-invite" hidden>' + TSW.invite + '</div>' +
      '<div class="row"><button type="button" class="btn ghost" id="ts-save">' + TSW.save + '</button><button type="button" class="btn ghost" id="ts-back" aria-expanded="false">' + TSW.back + '</button></div>' +
      '<div id="ts-msg" role="status"></div>' +
      '<div id="ts-backbox" hidden><p><label for="ts-in">' + TSW.backHow + '</label></p><textarea id="ts-in" class="ts-ta" rows="5"></textarea>' +
      '<div class="row"><button type="button" class="btn" id="ts-go">' + TSW.backBtn + '</button></div><div id="ts-ask" role="status"></div></div>';
    stop.insertAdjacentElement('afterend', area);
    el('ts-save').onclick = () => {
      const txt = tsText(), url = 'https://mail.google.com/mail/?view=cm&fs=1&su=' + encodeURIComponent(TSW.subject.replace('{trail}', TSC.name).replace('{date}', new Date().toLocaleDateString())) + '&body=' + encodeURIComponent(TSW.body);
      let w = null; try { w = window.open(url, '_blank'); if (w) w.opener = null; } catch (e) { w = null; }   // on the click itself, so that the browser lets the tab open
      const link = '<p><a href="' + url + '" target="_blank" rel="noopener">' + TSW.gmail + '</a></p>';
      const done = ok => {
        if (ok){
          el('ts-msg').innerHTML = '<div class="msg info" id="ts-ok"><p>' + (w ? TSW.ok : TSW.okNoTab) + '</p><p>' + TSW.keep + '</p>' + (w ? '<p id="ts-notab">' + TSW.noTab + ' <a href="' + url + '" target="_blank" rel="noopener">' + TSW.gmail + '</a></p>' : link) + '</div>';
          const st = tsStore(); st.ms = 0; st.shown = false; tsPut(st); el('ts-invite').hidden = true;   // the 30 minutes start again only after a copy that succeeded
        } else {
          el('ts-msg').innerHTML = '<div class="msg info" id="ts-fail"><p>' + TSW.fail + '</p><p>' + TSW.keep + '</p>' + link + '</div><textarea class="ts-ta" id="ts-out" rows="8" readonly></textarea>';
          el('ts-out').value = txt;
        }
      };
      try { navigator.clipboard.writeText(txt).then(() => done(true), () => done(false)); } catch (e) { done(false); }
    };
    el('ts-back').onclick = () => { const b = el('ts-backbox'); b.hidden = !b.hidden; el('ts-back').setAttribute('aria-expanded', b.hidden ? 'false' : 'true'); el('ts-ask').innerHTML = ''; if (!b.hidden) el('ts-in').focus({ preventScroll: true }); };
    el('ts-go').onclick = () => {
      const st = tsRead(el('ts-in').value), ask = el('ts-ask');
      if (!st){ ask.innerHTML = '<div class="msg info" id="ts-bad">' + TSW.backBad + '</div>'; return; }
      ask.innerHTML = '<div class="msg info" id="ts-sure"><p>' + TSW.backAsk + '</p><div class="row"><button type="button" class="btn" id="ts-yes">' + TSW.backYes + '</button><button type="button" class="btn ghost" id="ts-no">' + TSW.backNo + '</button></div></div>';
      el('ts-no').onclick = () => { ask.innerHTML = ''; };
      el('ts-yes').onclick = () => {
        try { localStorage.setItem(TSC.key, JSON.stringify(st)); sessionStorage.setItem(TSC.key + '.restored', '1'); } catch (e) {}
        try { history.replaceState(null, '', location.pathname + location.hash); } catch (e) {}   // a ?reset=1 in the address must not clear what was just brought back
        location.reload();
      };
    };
    try { if (sessionStorage.getItem(TSC.key + '.restored')){ sessionStorage.removeItem(TSC.key + '.restored'); el('ts-msg').innerHTML = '<div class="msg info" id="ts-restored">' + TSW.backDone + '</div>'; } } catch (e) {}
    tsReady = true; tsProgress();
    setInterval(() => { if (document.visibilityState === 'visible'){ const st = tsStore(); st.ms = (st.ms || 0) + 15000; tsPut(st); } }, 15000);
  }
  setTimeout(tsInit, 0);


  // everything the student did, in the order of the page
  function workReport(){
    const L = [], s4 = S.l4, K = S.prog;
    const pred = k => { const p = S.pred[k]; L.push('Prediction: ' + C.predictions[k].q, '  First choice: ' + (p && p.first ? optText(k, p.first) : 'not answered yet'), '  Final choice: ' + (p && p.final ? optText(k, p.final) : 'not answered yet'), ''); };
    const prac = k => { const p = S.pr[k] || {}, P = C.practice[k]; L.push('Practice: ' + P.q, '  My answer: ' + ((p.val || '').trim() ? p.val.trim() + (p.unit ? ' ' + p.unit : ' (no unit chosen)') : 'not answered yet'), '  Result: ' + (p.ok ? 'correct' : p.checks ? 'not correct yet' : 'not checked yet'), '  Checks made: ' + (p.checks || 0), ''); };
    const ex = k => { L.push('Explain your thinking'); exReport(L, k, C.explain[k]); };
    const puz = k => { const p = K.pz[k], P = C.puzzles[k]; L.push('Put the lines in order: ' + P.name, '  Result: ' + (p && p.ok ? 'in a working order' : p && p.checks ? 'not in a working order yet' : 'not checked yet'), '  Checks made: ' + (p ? p.checks : 0)); if (p && p.first){ L.push('  The first order I checked:'); p.first.forEach(id => L.push('    ' + P.lines[id])); } L.push(''); };
    const run = (name, r) => L.push(name + ': ' + (r ? setLine(r) : 'not run yet'), r ? '  ' + tx(C.l4.counters, {f:r.feet, c:r.counted}) : '');
    L.push(C.title + ' (CST286 learning trail)', 'Copied on ' + new Date().toLocaleString(), 'Levels opened: ' + LV.filter((l, i) => unlocked(i)).map(l => l.short).join(', '), '');
    L.push('Start', C.start.q, S.startText.trim() || 'not written yet', '');
    L.push('Level 1: ' + C.l1.heading, ''); pred('p1'); ex('ex1');
    L.push('Level 2: ' + C.l2.heading, ''); pred('p2'); prac('pr1'); ex('ex2');
    L.push('Level 3: ' + C.l3.heading, ''); prac('pr2'); ex('ex3'); pred('p3');
    L.push('Level 4: ' + C.l4.heading, '', C.l4.test + ': ' + (s4.stroll ? 'run' : 'not run yet') + (s4.test ? '. ' + tx(C.l4.counters, {f:s4.test.feet, c:s4.test.counted}) : ''), '');
    L.push(C.l4.t1); prac('t1a');
    L.push('Task 1b: ' + C.l4.t1b, '  My prediction: ' + ((s4.nb.val || '').trim() || 'not written yet') + (s4.nb.checks ? ' (' + (s4.nb.last === 'ok' ? 'correct' : 'not correct yet') + ', checks made: ' + s4.nb.checks + ')' : ''));
    run('  Run for 20 seconds', s4.runs.t1b); L.push('');
    L.push(C.l4.t2); run('  Run for 20 seconds', s4.runs.t2); L.push(C.l4.t2box + ':', (s4.txt.t2 || '').trim() || 'not written yet', '');
    L.push(C.l4.t3); run('  ' + C.l4.runStroll, s4.runs.stroll); run('  ' + C.l4.runBrisk, s4.runs.brisk); L.push(C.l4.t3p[1], (s4.txt.t3 || '').trim() || 'not written yet', '');
    ex('ex4');
    L.push('Level 5: ' + C.l5.heading, '');
    L.push('Part 1 of 4: ' + L5.parts[1]); prac('prF'); puz('pzSetup');
    L.push('Part 2 of 4: ' + L5.parts[2]); prac('prAcc'); puz('pzWave');
    L.push('Part 3 of 4: ' + L5.parts[3]); pred('pDt'); prac('prReads');
    L.push('Part 4 of 4: ' + L5.parts[4]); prac('prRule'); puz('pzRule');
    L.push(L5.parts[5], 'My prediction before I ran the stroll: ' + ((K.pred || '').trim() || 'not written yet'), 'My changes to the program: ' + progChanges(), '');
    ex('exProg');
    endReport(L);
    L.push('', C.side.heading, 'Option chosen: ' + sideOptText(), C.side.plan.b + ' ' + C.side.plan.t, S.side.plan.trim() || 'not written yet');
    const E = S.ex.plan || {rounds:[], asks:0};
    if (E.rounds.length){ E.rounds.forEach((r, i) => L.push('Version ' + (i + 1) + ', what I wrote before asking for feedback:', r.sent, 'AI feedback on version ' + (i + 1) + ':', r.fb)); }
    else L.push('AI feedback on my plan: not asked for yet');
    L.push('Times I asked for feedback: ' + (E.asks || 0));
    L.push(C.side.report.b + ' ' + C.side.report.t, S.side.report.trim() || 'not written yet');
    return L.join('\n');
  }
  function copyWork(){
    const text = workReport(), box = $('#subbox');
    const show = ok => {
      box.hidden = false;
      box.innerHTML = '<div class="msg ' + (ok ? 'ok' : 'info') + '" role="status">' + esc(ok ? C.submit.ok : C.submit.manual) + '</div><textarea class="editor" rows="' + (ok ? 6 : 10) + '" readonly aria-label="The text that was copied">' + esc(text) + '</textarea><div class="row"><button type="button" class="btn ghost" id="subclose">' + C.submit.close + '</button></div>';
      $('#subclose').onclick = () => { box.hidden = true; $('#subfab').focus(); };
      if (!ok){ const ta = $('textarea', box); ta.focus(); ta.select(); }
    };
    try { navigator.clipboard.writeText(text).then(() => show(true), () => show(false)); } catch (e) { show(false); }
  }

  function renderClear(){
    const w = $('#clearwrap');
    w.innerHTML = '<button type="button" class="linkbtn" id="clr">' + esc(C.submit.clear) + '</button> <span id="clr2"></span>';
    $('#clr').onclick = () => { $('#clr2').innerHTML = '<button type="button" class="btn ghost" id="clryes">' + esc(C.submit.clearYes) + '</button>'; $('#clryes').onclick = () => { try { localStorage.removeItem(KEY); localStorage.removeItem(KEY + '.save'); } catch (e) {} S = fresh(); try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} location.reload(); }; };
  }


  /* ---------- animation loop ---------- */
  let last = 0;
  function frame(t){
    const dt = last ? Math.min(.05, (t - last) / 1000) : 0; last = t;
    if (ACTIVE){ if (ACTIVE.tick && !G.paused) ACTIVE.tick(dt * G.speed); ACTIVE.draw(); }
    requestAnimationFrame(frame);
  }
  // for automated checks of this page: run the walk forward
  window.__stepTrail = {ff(sec){ if (ACTIVE && ACTIVE.tick){ for (let k = 0; k < sec / .05; k++) ACTIVE.tick(.05); ACTIVE.draw(); } }, sim, workReport, PROG, saved(){ return S; }};

  /* ---------- start ---------- */
  const fromHash = () => LV.findIndex(l => l.id === (location.hash || '').slice(1));
  const hi = fromHash(); if (hi >= 0 && unlocked(hi)) S.level = hi;
  if (!(S.level >= 0 && S.level < LV.length) || !unlocked(S.level)) S.level = 0;
  window.addEventListener('hashchange', () => { const i = fromHash(); if (i >= 0 && i !== S.level) go(i); });
  render();
  requestAnimationFrame(frame);
})();
</script>
