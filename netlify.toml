[build]
  # No build step needed — static files served directly
  publish = "."
  # Page edits auto-sync to main all day; only rebuild when the functions or
  # this file change (exit 0 = skip the build). Added 2026-11-13.
  # With no build cache Netlify sets CACHED_COMMIT_REF = COMMIT_REF, so the
  # diff would be empty; build in that case rather than skip a real change.
  ignore = "[ \"$CACHED_COMMIT_REF\" != \"$COMMIT_REF\" ] && git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- netlify/ netlify.toml"

[functions]
  directory = "netlify/functions"

# CORS headers for the function endpoint
[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Headers = "Authorization, Content-Type"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"
