*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font:400 17px/1.5 var(--body);-webkit-text-size-adjust:100%}
h1,h2,h3,p,ul{margin:0}
ul{padding:0;list-style:none}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--ocean);outline-offset:2px}
#view{min-height:100%}
.wrap{max-width:560px;margin:0 auto;padding:28px 18px 40px;display:flex;flex-direction:column;gap:20px}
.eyebrow{font:700 12px/1.3 var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.h-big{font:800 40px/1.05 var(--display);letter-spacing:-.01em;color:var(--bay);text-wrap:balance}
.h-q{font:700 26px/1.2 var(--display);color:var(--bay);text-wrap:balance}
.label{font:700 13px/1.3 var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--bay);margin-bottom:8px}
.muted{color:var(--muted)}
.small{font-size:14.5px}
.link{background:none;border:0;padding:6px 0;margin-right:16px;color:var(--bay);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.foot{display:flex;flex-wrap:wrap;gap:2px 0}
.proto{font-size:13.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}

/* ---------- front door ---------- */
.front{gap:18px;padding-top:28px}
.otter{display:block;aspect-ratio:552/391;background:currentColor;-webkit-mask:var(--otter) center/contain no-repeat;mask:var(--otter) center/contain no-repeat}
.front .eyebrow{font-size:11px;letter-spacing:.08em}
.front .h-big{font-size:min(8.4vw,40px)}
.mast{display:flex;flex-direction:column;gap:6px}
.picked{font-size:14.5px;color:var(--muted);margin-top:8px}
.choices{display:flex;flex-direction:column;gap:6px}
.choice{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;background:var(--white);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px}
.choice b{font:600 16.5px/1.25 var(--display);color:var(--ink)}
.choice span{display:block;font-size:14.5px;color:var(--muted);margin-top:2px}
.choice i{font-style:normal;color:var(--ocean);font-size:22px;line-height:1}
.choice:hover,.row:hover{border-color:var(--ocean)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--white);border:1.5px solid var(--line);border-radius:999px;padding:9px 15px;font-weight:600;color:var(--bay)}
.chip:hover{border-color:var(--ocean)}
@media (min-width:900px){
  .front{max-width:980px;display:grid;grid-template-columns:1fr 1fr;column-gap:48px;align-items:start;padding-top:64px}
    .front .mast{grid-column:1}
  .front .who{grid-column:2;grid-row:1}
  .front .tail{grid-column:1 / -1}
  .front .h-big{font-size:54px}
  .front .eyebrow{font-size:12px;letter-spacing:.12em}
}

/* ---------- lists ---------- */
.search{width:100%;font:inherit;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--white);color:var(--ink)}
.rows{display:flex;flex-direction:column;gap:7px}
.row{width:100%;display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:12px;text-align:left;background:var(--white);border:1.5px solid var(--line);border-radius:12px;padding:9px 12px}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--mist);color:var(--bay);font:700 14px/1 var(--display)}
.row .nm{font:600 16px/1.25 var(--display);color:var(--ink)}
.row .pj{font-size:14.5px;line-height:1.3;color:var(--muted)}
.row .where{text-align:right;font-size:13.5px;color:var(--muted);white-space:nowrap}
.row .where b{display:block;color:var(--bay);font:700 14px/1.3 var(--display)}
.tag{display:inline-block;font:700 11px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--bay);margin-left:6px}
.tag::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:5px}

/* ---------- the sheet: one student, five pages ---------- */
body.pg #view{height:100%}
.pager{height:100%;display:grid;place-items:center}
.sheet{position:relative;width:100%;max-width:560px;height:100%;max-height:900px;display:flex;flex-direction:column;background:var(--white);color:var(--ink);overflow:hidden}
.top{padding:12px 16px 0;display:flex;flex-direction:column;gap:10px}
.prog{display:flex;gap:5px}
.prog i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.prog i.on{background:var(--bay)}
.bar{display:flex;align-items:center;gap:10px;min-height:40px}
.bar .av{width:36px;height:36px;font-size:12px;flex:none}
.bar .id{flex:1;min-width:0;font:600 14.5px/1.25 var(--display)}
.bar .id small{display:block;font:400 13.5px/1.3 var(--body);opacity:.8}
.x{flex:none;width:40px;height:40px;border-radius:50%;border:0;background:transparent;font-size:24px;line-height:1;color:inherit}
.x:hover{background:rgba(107,146,182,.22)}
.slide{flex:1;min-height:0;overflow-y:auto}
.k{font:700 12.5px/1.3 var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--bay)}
.name{font:800 40px/1.05 var(--display);letter-spacing:-.01em;text-wrap:balance}
.proj{font:600 18px/1.3 var(--display);color:var(--bay);text-wrap:balance}
.t{font-size:18px;line-height:1.5;max-width:34em}
.claim{font:600 21px/1.36 var(--display);color:var(--bay);text-wrap:balance}
.asks{display:flex;flex-direction:column;gap:10px}
.asks li{background:var(--white);border:1.5px solid var(--line);border-radius:12px;padding:12px 15px;font-size:17.5px;line-height:1.4}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{border-radius:999px;padding:6px 14px;font:700 14.5px/1.2 var(--display);background:var(--bay);color:var(--white)}
.pill.o{background:transparent;color:inherit;box-shadow:inset 0 0 0 1.5px currentColor}
.photo{width:132px;height:132px;border-radius:20px;display:grid;place-items:center;background:var(--mist);color:var(--bay);font:800 40px/1 var(--display)}
.hint{font-size:15px;opacity:.8}
.btn{display:block;width:100%;text-align:center;text-decoration:none;border-radius:12px;padding:13px 16px;font:700 16px/1.25 var(--display);background:var(--bay);color:var(--white);border:1.5px solid var(--bay)}
.btn:hover{background:var(--bay-deep)}
.btn.ghost{background:var(--white);color:var(--bay)}
.btn.ghost:hover{background:var(--mist)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.two .btn{padding:10px 10px;font-size:14.5px}
.made{font-size:13px;line-height:1.4;color:var(--muted)}
.draft{display:inline-block;font:700 10.5px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;border:1px solid currentColor;border-radius:4px;padding:3px 5px;margin-left:6px;vertical-align:middle}
.nav{display:flex;gap:10px;padding:10px 16px 16px}
.nav button{flex:1;border-radius:12px;padding:13px 12px;font:700 16px/1.2 var(--display);border:1.5px solid var(--bay);background:var(--bay);color:var(--white)}
.nav button.back{flex:0 0 34%;background:transparent;color:inherit;border-color:currentColor}
.nav button[hidden]{display:none}

/* Page 1 opens with a Monterey Bay Blue band: who the student is and where to find them */
.sheet.p1 .top{background:var(--bay);color:var(--white)}
.sheet.p1 .prog i{background:rgba(255,255,255,.3)}
.sheet.p1 .prog i.on{background:var(--white)}
.hero{background:var(--bay);color:var(--white);padding:6px 22px 22px;display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.hero .photo{width:96px;height:96px;border-radius:18px;font-size:30px;background:rgba(255,255,255,.16);color:var(--white)}
.hero .k{color:#c5d5e5;margin-bottom:4px}
.hero .name{font-size:30px;margin-bottom:10px}
.hero .pill{background:var(--white);color:var(--bay)}
.hero .pill.o{background:transparent;color:var(--white)}
.body{padding:20px 22px 14px;display:flex;flex-direction:column;gap:18px}
.sec{display:flex;flex-direction:column;gap:8px}
.claimbox{background:var(--mist);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.about{border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;font-size:16px}
.stampzone{display:flex;align-items:center;gap:16px}
.target{flex:none;width:148px;height:148px;border-radius:50%;border:2px dashed var(--ocean);background:var(--white);display:grid;place-items:center;text-align:center;font:600 14px/1.3 var(--display);color:var(--bay);padding:18px}
.target.done{border-color:transparent;padding:0;background:transparent}
.stampzone p{font-size:15.5px;line-height:1.4;color:var(--muted)}
.stampzone p b{display:block;color:var(--bay);font:700 16px/1.3 var(--display)}

/* The stamp: the otter spirit mark alone in a ring, in Monterey Bay Blue */
.stamp{position:relative;display:block;width:148px;aspect-ratio:1;color:var(--bay);transform:rotate(var(--r,-8deg));opacity:.92}
.stamp svg{position:absolute;inset:0;width:100%;height:100%}
.stamp .otter{position:absolute;left:22%;width:56%;top:50%;transform:translateY(-52%)}
.stamp.sm{width:100%}
.stamp.sm .otter{left:13%;width:74%}
.stamp.in{animation:thump .42s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes thump{from{transform:rotate(var(--r,-8deg)) scale(1.8);opacity:0}60%{opacity:.92}to{transform:rotate(var(--r,-8deg)) scale(1);opacity:.92}}
@media (prefers-reduced-motion:reduce){.stamp.in{animation:none}}

@media (min-width:640px) and (min-height:700px){
  .pager{padding:24px}
  .sheet{border-radius:22px;box-shadow:0 18px 50px rgba(36,53,82,.18)}
  .body{padding:24px 34px 14px}
  .hero{padding:8px 34px 26px}
  .top{padding:16px 24px 0}
  .nav{padding:10px 24px 22px}
  .hero .name{font-size:36px}
}

/* ---------- my visit / my passport ---------- */
.cover{background:var(--bay);color:var(--white);border-radius:16px;border-left:10px solid var(--bay-deep);padding:26px 20px 22px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.cover .otter{width:150px;color:var(--white);margin:6px 0 10px}
.cover b{font:800 26px/1 var(--display);letter-spacing:.3em;margin-right:-.3em}
.cover span{font:600 14px/1.4 var(--display);opacity:.9}
.cover small{font-size:14px;opacity:.8}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 10px}
.slot{background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;text-align:center}
.slot .ring{width:100%;max-width:104px;aspect-ratio:1;border-radius:50%;border:2px dashed var(--ocean);display:grid;place-items:center;font:600 12.5px/1.2 var(--display);color:var(--muted)}
.slot .ring.done{border:0}
.slot em{font:600 14px/1.2 var(--display);font-style:normal;color:var(--ink)}
.room{font:700 13px/1.3 var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--bay);border-bottom:1px solid var(--line);padding-bottom:6px}
.panel{background:var(--white);border:1.5px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.check{display:flex;gap:10px;align-items:flex-start}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--bay);flex:none}
textarea{width:100%;min-height:76px;font:inherit;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--white);color:var(--ink)}
.out{white-space:pre-wrap;font:500 14px/1.5 ui-monospace,Menlo,Consolas,monospace;background:var(--mist);border-radius:12px;padding:14px;margin:0}
[hidden]{display:none !important}
</style>

  <path id="arc-b" d="M15,100 a85,85 0 1,0 170,0"/>
</defs></svg>
<main id="view"></main>
<script>
const CATS={software:"Open source and software",security:"Security and certificates",data:"Data and AI",web:"Web and mobile apps",games:"Games and interactive"};
const LENS={
  d:{label:"How students made decisions",line:"What they chose, what else they considered, and what the choice cost."},
  x:{label:"How students worked across domains",line:"Where a second field of knowledge changed the work."},
  a:{label:"How students used AI in their work",line:"Where AI helped, and where the student had to direct or correct it."}
};
const ROLES={
  family:{label:"Family member or friend",sub:"I am here for a student"},
  employer:{label:"Hiring manager or industry guest",sub:"I want to meet students in my line of work"},
  faculty:{label:"Faculty member",sub:"I want to see how students worked"},
  admin:{label:"University administrator",sub:"I want a picture of the whole program"},
  student:{label:"Student",sub:"I want to see what capstone looks like"}
};
const UNIVERSAL="What was the hardest decision you made, and what did you give up by making it?";
/* name, project, cat, room, table, desc (professional), plain (family), claim, fam[2], pro, lens{} */
const S=[
["Maya Delgado","Fixing a sync bug in an open-source learning app","software",101,3,
 "Found why lesson progress was lost when tablets went offline, wrote the fix, and took it through two rounds of review with the project's maintainers.",
 "Maya found out why a learning app was losing children's lesson progress when their tablets had no internet. She wrote the fix and worked with the app's volunteer developers until they accepted it.",
 "I can find my way around a large codebase I did not write and get a fix accepted by the people who maintain it.",
 ["How did you find the cause of the problem in code that other people wrote?","What did the app's developers ask you to change before they accepted your fix?"],
 "What did the maintainers push back on in review, and what did you change because of it?",
 {d:"You had more than one way to fix the sync bug. Why this one, and what did it cost?",a:"Where did an AI tool point you the wrong way in that codebase, and how did you catch it?"}],
["Jordan Whitfield","Faster search for a city's open-data portal","software",101,5,
 "Rewrote the search index for a public data site so results that took eight seconds now come back in under one.",
 "Jordan made the search on a city's public information website much faster. A search that used to take eight seconds now takes less than one.",
 "I can measure why a system is slow and rebuild the slow part without breaking what depends on it.",
 ["How did you find out which part was slow?","How do you know nothing else broke when you changed it?"],
 "How did you prove the speed-up was real and not one lucky test?",
 {d:"What did you decide not to speed up, and why?",x:"What did you have to learn about how city staff publish data to get the search right?"}],
["Priya Raman","Making a code editor easier to use with a screen reader","software",101,7,
 "Tested an open-source editor with a screen reader, listed what got in the way, and fixed the three worst problems.",
 "Priya tested a tool that programmers write code in, using the screen reader software that blind programmers rely on. She listed what got in their way and fixed the three worst problems.",
 "I can test software the way a person with a disability uses it and fix what blocks them.",
 ["What surprised you when you used the tool without looking at the screen?","How did you choose which three problems to fix first?"],
 "How did you rank the problems, and who checked your ranking?",
 {x:"What did you learn from accessibility practice that changed how you write code?",d:"Which problem did you leave unfixed, and how did you decide?"}],
["Luis Carrillo","Reading a network capture after a port scan","security",104,2,
 "Studied for Security+ by working through a real packet capture, found the scan, and wrote a plan to stop the next one.",
 "Luis studied for a professional security certificate. To prepare, he examined a recording of real network traffic, found where someone had probed the network for weak points, and wrote a plan to stop it next time.",
 "I can read raw network traffic, spot an attack in it, and explain to a non-specialist what to do about it.",
 ["What does an attack look like when you see it in the traffic?","What would you tell a small business owner to do first?"],
 "Walk me through the capture. What was the first sign, and what did you rule out?",
 {d:"What did you leave out of your prevention plan, and why?",a:"How did you use AI while studying, and how did you check what it told you?"}],
["Hannah Okafor","Phishing awareness training that people finish","security",104,4,
 "Built a short training for a small nonprofit and measured how many staff reported the test emails before and after.",
 "Hannah built a short training that teaches the staff of a small nonprofit to recognize fake emails. She then measured whether staff reported more of the test emails after the training than before.",
 "I can change how people behave around security and measure whether the change happened.",
 ["How do you teach someone to spot a fake email?","What did the numbers show after the training?"],
 "What result would have convinced you the training did not work?",
 {x:"What did you take from teaching or psychology so that people finish the training?",d:"Why a short training and not a thorough one?"}],
["Tomás Ibarra","Hardening a home lab server","security",104,6,
 "Set up a small server, attacked it with common tools, and documented each change that closed a gap.",
 "Tomás set up a small server at home, attacked it himself with the tools real attackers use, and wrote down every change that closed a weakness.",
 "I can attack my own system, close the gaps I find, and document each change so someone else can repeat it.",
 ["What was the easiest way into your own server?","How do you know a gap is really closed?"],
 "Which fix would you defend to a team that says it slows them down?",
 {d:"Which gap did you decide was acceptable to leave, and why?",a:"Which attack steps did AI help with, and where did you have to work it out yourself?"}],
["Grace Nakamura","Predicting which crops need water first","data",110,1,
 "Combined soil sensor readings with weather data to rank fields by how soon they need irrigation.",
 "Grace combined readings from soil sensors with weather information to tell a farmer which fields will need water first.",
 "I can combine messy data from two sources into a ranking a farmer can act on.",
 ["How does the system decide which field comes first?","Who looked at your results, and what did they say?"],
 "How did you check your ranking against what happened in the fields?",
 {x:"What did you have to learn about farming before the data made sense?",d:"What did you do about sensor readings you could not trust?"}],
["Deshawn Price","Checking an AI tutor's math explanations","data",110,3,
 "Built a test set of algebra questions and measured how often an AI tutor's step-by-step answers had a wrong step.",
 "Deshawn tested an AI tutor that explains algebra step by step. He built a set of questions and counted how often one of the tutor's steps was wrong.",
 "I can design a test that shows where an AI system gives wrong answers, and report it in numbers.",
 ["How often was the AI tutor wrong, and on what kind of question?","How did you check the tutor's steps yourself?"],
 "How did you choose the questions so the test was fair?",
 {a:"What did you learn about when to trust an AI's explanation?",x:"What did you need to understand about how students learn algebra to judge a wrong step?"}],
["Elena Petrova","Finding patterns in bus ridership","data",110,5,
 "Cleaned two years of ridership data and showed which routes lose riders after schedule changes.",
 "Elena cleaned up two years of bus ridership records and showed which routes lose riders after a schedule change.",
 "I can turn two years of raw records into a finding a transit planner can use.",
 ["What was wrong with the records before you cleaned them?","Which finding would matter most to someone who rides the bus?"],
 "Which pattern did you first believe and later find was wrong?",
 {x:"What did you learn about transit planning that changed your analysis?",d:"What data did you throw away, and how did you decide?"}],
["Kai Mahoe","Volunteer scheduling app for a food bank","web",112,2,
 "Replaced a paper sign-up sheet with a phone app that volunteers can use in under a minute.",
 "Kai replaced a food bank's paper sign-up sheet with a phone app. Volunteers can now sign up for a shift in under a minute.",
 "I can watch how people do a task on paper and build an app they will use instead.",
 ["How did you find out what the volunteers needed?","What did you change after people first tried it?"],
 "What did you cut from the app so that sign-up stays under a minute?",
 {d:"Which feature did the food bank ask for that you said no to, and why?",x:"What did you learn about how a food bank runs that shaped the app?"}],
["Sofia Marquez","A bilingual clinic check-in page","web",112,4,
 "Built a check-in page in English and Spanish and tested it with people at the front desk.",
 "Sofia built a check-in page for a clinic that works in English and Spanish, and tested it with the people at the front desk.",
 "I can build software for people who use it in two languages and test it with the staff who depend on it.",
 ["What did the front desk staff tell you when they tried it?","What is hard about making one page work well in two languages?"],
 "What did testing at the front desk change in your design?",
 {x:"What did you have to learn about how a clinic handles patient information?",a:"How did you use AI for the Spanish text, and how did you check it?"}],
["Ethan Brooks","Offline-first notes app for field researchers","web",112,6,
 "Made a notes app that keeps working with no signal and syncs when the phone gets back online.",
 "Ethan made a notes app for researchers who work outdoors where there is no phone signal. The app keeps working and sends the notes when the phone is back online.",
 "I can build an app that keeps people's work safe when the connection fails.",
 ["What happens to a note if the phone loses signal halfway?","How did you test it without going out into the field?"],
 "What happens when two devices change the same note offline?",
 {d:"Which way of syncing did you reject, and what would it have cost?",a:"Where did AI-written code fail your offline tests?"}],
["Amara Nwosu","A puzzle game that teaches recursion","games",118,1,
 "Designed a puzzle game where each level is solved by breaking it into a smaller copy of itself.",
 "Amara designed a puzzle game that teaches a programming idea called recursion. Each level is solved by breaking it into a smaller copy of itself.",
 "I can turn an idea students find hard into a game that teaches it.",
 ["Can you show me the first level and how it is solved?","How do you know players learned the idea and did not just guess?"],
 "How did you test whether players learned recursion?",
 {x:"What did you take from teaching to design the levels?",d:"Which level did you remove, and why?"}],
["Ryan Castillo","Multiplayer card game with fair matchmaking","games",118,3,
 "Built an online card game and tuned the matchmaking so new players stop getting paired with experts.",
 "Ryan built an online card game and adjusted how players are paired, so beginners are no longer matched against experts.",
 "I can measure whether a system treats new users fairly and tune it until it does.",
 ["How does the game decide who plays against whom?","How do you know beginners are having a better time now?"],
 "What number told you matchmaking was unfair, and what is it now?",
 {d:"What did fairer matching cost in waiting time, and how did you choose?",a:"How did you use AI to simulate players, and what did it get wrong?"}],
["Lily Tran","An accessible rhythm game","games",118,5,
 "Made a rhythm game you can play with one hand or with sound only, and tested it with players who need both.",
 "Lily made a music game that can be played with one hand, or by sound alone without looking at the screen. She tested it with players who need those options.",
 "I can design for players with different abilities from the start and test with the people it is for.",
 ["How does someone play your game without seeing the screen?","What did your testers ask you to change?"],
 "What did testers change that you would not have found yourself?",
 {x:"What did you learn from accessibility that you will use in your next project?",a:"Where did AI help with the game, and where did you override it?"}]
].map((r,i)=>({id:"student-"+String(i+1).padStart(2,"0"),name:r[0],first:r[0].split(" ")[0],project:r[1],cat:r[2],room:r[3],table:r[4],desc:r[5],plain:r[6],claim:r[7],fam:r[8],pro:r[9],lens:r[10]}));

const POSTER="interactive-poster-samples.html";
const LINKEDIN="https://www.linkedin.com/";

const byId=id=>S.find(s=>s.id===id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm=s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const ini=s=>s.name.split(" ").map(p=>p[0]).join("");
const order=ids=>ids.slice().sort((a,b)=>{const x=byId(a),y=byId(b);return x.room-y.room||x.table-y.table;});

/* A visitor's answers stay on their own device. */
const KEY="capstone-festival-passport-v2";
const fresh=()=>({role:null,sub:null,route:[],seen:[],stamps:{},cur:null,seed:Math.floor(Math.random()*7)});
let st=fresh();
try{const j=JSON.parse(localStorage.getItem(KEY));if(j&&typeof j==="object")st=Object.assign(st,j);}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){}};
const view=document.getElementById("view");
let pg=0, shown=null, justStamped=null;

function go(h){ if(location.hash==="#"+h) render(); else location.hash=h; }
function pick(list,n){ const out=[]; for(let i=0;i<list.length&&out.length<n;i++) out.push(list[(i+st.seed)%list.length]); return out; }
function onePerRoom(list,n){ const seen=new Set(),out=[]; const rot=list.map((_,i)=>list[(i+st.seed)%list.length]);
  for(const s of rot){ if(!seen.has(s.room)){seen.add(s.room);out.push(s);} if(out.length===n) return out; }
  for(const s of rot){ if(!out.includes(s)) out.push(s); if(out.length===n) break; } return out; }

function buildRoute(){
  const r=st.role, sub=st.sub; let list=[];
  if(r==="family"){ const me=byId(sub);
    const same=S.filter(s=>s.room===me.room&&s.id!==me.id), other=S.filter(s=>s.room!==me.room);
    list=[me,pick(same,1)[0],pick(other,1)[0]]; st.route=list.map(s=>s.id); save(); return; }
  if(r==="faculty") list=onePerRoom(S.filter(s=>s.lens[sub]),4);
  else if(r==="admin") list=onePerRoom(S,5);
  else if(sub==="any") list=onePerRoom(S,r==="student"?5:4);
  else { const inCat=S.filter(s=>s.cat===sub); st.route=inCat.slice(0,3).concat(pick(S.filter(s=>s.cat!==sub),1)).map(s=>s.id); save(); return; }
  st.route=order(list.map(s=>s.id)); save();
}
function nextTwo(cur){
  const me=byId(cur), seen=new Set(st.seen.concat([cur]));
  const fits=s=>st.role==="faculty"?!!s.lens[st.sub]:(st.role==="employer"||st.role==="student")&&st.sub!=="any"?s.cat===st.sub:false;
  const planned=st.route.filter(id=>!seen.has(id)).map(byId);
  const others=S.filter(s=>!seen.has(s.id)&&!st.route.includes(s.id))
    .sort((x,y)=>(fits(y)-fits(x))||(Math.abs(x.room-me.room)-Math.abs(y.room-me.room))||(x.table-y.table));
  return planned.concat(others).slice(0,2);
}

function render(){
  const h=location.hash.slice(1)||"start";
  document.body.classList.remove("pg");
  if(h==="ask"&&st.role) return ask();
  if(h==="all") return all();
  if(h==="my") return my();
  if(h.startsWith("student-")&&byId(h)) return show(h);
  if(h==="route"&&(st.cur||st.route.length)) return go(st.cur||st.route[0]);
  return start();
}

const stampCount=()=>Object.keys(st.stamps).length;
function footLinks(){
  return `<p class="foot"><button class="link" type="button" data-go="my">My passport${stampCount()?" ("+stampCount()+")":""}</button>
    <button class="link" type="button" data-go="all">All students</button>
    <button class="link" type="button" data-go="start" data-reset="1">Start over</button></p>`;
}

/* ---------- front door ---------- */
function start(){
  view.innerHTML=`<div class="wrap front">
    <header class="mast"><p class="eyebrow">Cal State Monterey Bay · B.S. Computer Science</p>
      <h1 class="h-big">Capstone Festival</h1>
      <p class="muted">December 2026 · ${S.length} students. Collect a stamp for each student you visit.</p></header>
    <section class="who"><h2 class="label">I am a</h2>
      <ul class="choices">${Object.entries(ROLES).map(([k,v])=>`<li><button class="choice" type="button" data-role="${k}"><b>${esc(v.label)}</b><i aria-hidden="true">›</i></button></li>`).join("")}</ul></section>
    <div class="tail"><p class="foot"><button class="link" type="button" data-go="all">See all ${S.length} students</button>${stampCount()?`<button class="link" type="button" data-go="my">My passport (${stampCount()})</button>`:""}</p>
      <p class="proto">Prototype. The students and projects on this page are made up, and the links on each page are samples.</p></div>
  </div>`;
}

function ask(){
  const r=st.role; let body="";
  if(r==="family") body=`<h1 class="h-q">Who are you here for?</h1>
    <input class="search" id="who" type="search" placeholder="Type a first or last name" autocomplete="off" aria-label="Student name">
    <ul class="rows" id="names"></ul>`;
  else if(r==="faculty") body=`<h1 class="h-q">What would you like to see today?</h1>
    <ul class="choices">${Object.entries(LENS).map(([k,v])=>`<li><button class="choice" type="button" data-sub="${k}"><span><b>${esc(v.label)}</b><span>${esc(v.line)}</span></span><i aria-hidden="true">›</i></button></li>`).join("")}</ul>`;
  else if(r==="admin"){ buildRoute(); st.seen=[]; return go(st.route[0]); }
  else body=`<h1 class="h-q">${r==="employer"?"What kind of work do you hire for?":"What are you curious about?"}</h1>
    <div class="chips">${Object.entries(CATS).map(([k,v])=>`<button class="chip" type="button" data-sub="${k}">${esc(v)}</button>`).join("")}
    <button class="chip" type="button" data-sub="any">${r==="employer"?"Any of these":"Show me a mix"}</button></div>`;
  view.innerHTML=`<div class="wrap"><p class="eyebrow">${esc(ROLES[r].label)}</p>${body}
    <p class="foot"><button class="link" type="button" data-go="start" data-reset="1">Change who I am</button></p></div>`;
  if(r==="family"){ const inp=document.getElementById("who"); const draw=()=>{ const t=norm(inp.value.trim());
      document.getElementById("names").innerHTML=S.filter(s=>norm(s.name).includes(t)).map(s=>`<li><button class="row" type="button" data-sub="${s.id}"><span class="av">${esc(ini(s))}</span><span><span class="nm">${esc(s.name)}</span><br><span class="pj">${esc(s.project)}</span></span><span></span></button></li>`).join("")||`<li class="muted">No student matches that name yet. Try fewer letters.</li>`; };
    inp.addEventListener("input",draw); draw(); }
}

/* ---------- the stamp ---------- */
function stamp(id,small,animate){
  const r=((parseInt(id.slice(-2),10)*37)%19)-9;
  const ring=small?`<circle cx="100" cy="100" r="95" fill="none" stroke="currentColor" stroke-width="4"/>`
    :`<circle cx="100" cy="100" r="96" fill="none" stroke="currentColor" stroke-width="3.5"/>
      <circle cx="100" cy="100" r="89.5" fill="none" stroke="currentColor" stroke-width="1.2"/>
      <g fill="currentColor" font-family="Montserrat,sans-serif" font-weight="700" font-size="12" letter-spacing="2.6">
        <text><textPath href="#arc-t" startOffset="50%" text-anchor="middle">CAPSTONE FESTIVAL</textPath></text>
        <text><textPath href="#arc-b" startOffset="50%" text-anchor="middle">DECEMBER 2026</textPath></text></g>
      <circle cx="19" cy="100" r="2.6" fill="currentColor"/><circle cx="181" cy="100" r="2.6" fill="currentColor"/>`;
  return `<span class="stamp${small?" sm":""}${animate?" in":""}" style="--r:${r}deg" role="img" aria-label="Stamp"><svg viewBox="0 0 200 200" aria-hidden="true">${ring}</svg><span class="otter"></span></span>`;
}

/* ---------- one student, two pages ---------- */
function nextRows(nx){
  return nx.map(n=>`<li><button class="row" type="button" data-go="${n.id}">
      <span class="av" aria-hidden="true">${esc(ini(n))}</span>
      <span><span class="nm">${esc(n.name)}</span><br><span class="pj">${esc(n.project)}</span></span>
      <span class="where"><b>Room ${n.room}</b>Table ${n.table}</span></button></li>`).join("");
}
function pageOne(s){
  const fam=st.role==="family", mine=fam&&s.id===st.sub, f=esc(s.first);
  const q=fam?s.fam.concat([UNIVERSAL]):[st.role==="faculty"&&s.lens[st.sub]?s.lens[st.sub]:s.pro];
  const about=st.role==="admin"&&s.id===st.route[0]?`<div class="about"><p class="k">About this capstone <span class="draft">Draft wording</span></p>
    <p>Each student in this capstone built an Interactive Poster. It opens with one claim about a skill the student can show, then the work behind it, a decision they made, and an obstacle they met.</p>
    <p>Students present at their own laptops. Each table on your route shows a different area of work.</p></div>`:"";
  return `<header class="hero"><span class="photo" role="img" aria-label="Space for ${f}'s photo">${esc(ini(s))}</span>
      <div><p class="k">${mine?"You are here for":esc(CATS[s.cat])}</p><h1 class="name">${esc(s.name)}</h1>
        <div class="pills"><span class="pill">Room ${s.room}</span><span class="pill o">Table ${s.table}</span></div></div></header>
    <div class="body">${about}
      <section class="sec"><p class="k">${fam?"What "+f+" did":"The project"}</p>${fam?"":`<p class="proj">${esc(s.project)}</p>`}<p class="t">${esc(fam?s.plain:s.desc)}</p></section>
      <section class="claimbox"><p class="k">${fam?"What this shows about "+f:f+"'s claim"}</p><p class="claim">${esc(s.claim)}</p></section>
      <section class="sec"><p class="k">${q.length>1?"Questions you can ask "+f:"A question to ask "+f}</p><ul class="asks">${q.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></section>
    </div>`;
}
function pageTwo(s){
  const fam=st.role==="family", f=esc(s.first), ts=st.stamps[s.id], nx=nextTwo(s.id);
  return `<div class="body">
    <section class="sec"><p class="k">Stamp your visit</p>
      <div class="stampzone"><button class="target${ts?" done":""}" type="button" data-stamp="${s.id}" aria-pressed="${!!ts}">${ts?stamp(s.id,false,justStamped===s.id):"Tap to stamp your visit"}</button>
        <p>${ts?`<b>Stamped ${new Date(ts).toLocaleDateString("en-US",{month:"short",day:"numeric"})}</b>Tap the stamp to undo.`:`<b>Room ${s.room} · Table ${s.table}</b>Stamp your passport when you have visited ${f}.`}</p></div>
      <div class="two"><a class="btn" href="${POSTER}" target="_blank" rel="noopener">${f}'s Interactive Poster</a><a class="btn ghost" href="${LINKEDIN}" target="_blank" rel="noopener">${f} on LinkedIn</a></div></section>
    <section class="sec">${nx.length?`<p class="k">Visit next</p><ul class="rows">${nextRows(nx)}</ul>`:`<p class="muted">You have opened every student.</p>`}</section>
    ${footLinks()}
    <p class="made">Drafted by AI from ${f}'s Interactive Poster. Read and approved by ${f} before it was published.</p></div>`;
}
function show(id){
  const s=byId(id); if(shown!==id){ pg=0; shown=id; }
  st.cur=id; if(!st.seen.includes(id)) st.seen.push(id); save();
  const nx=pg===1?nextTwo(id)[0]:null;
  const bars=`<div class="prog" role="img" aria-label="Page ${pg+1} of 2"><i class="on"></i><i class="${pg===1?"on":""}"></i></div>`;
  const x=`<button class="x" type="button" data-go="all" aria-label="Close and see all students">×</button>`;
  const top=pg===0?`${bars}<div class="bar"><span class="id"></span>${x}</div>`
    :`${bars}<div class="bar"><span class="av" aria-hidden="true">${esc(ini(s))}</span><span class="id">${esc(s.name)}<small>Room ${s.room} · Table ${s.table}</small></span>${x}</div>`;
  document.body.classList.add("pg");
  view.innerHTML=`<div class="pager"><article class="sheet p${pg+1}">
    <div class="top">${top}</div>
    <div class="slide">${pg===0?pageOne(s):pageTwo(s)}</div>
    <div class="nav">${pg===0?`<button type="button" data-turn="1">Next: stamp your visit</button>`
      :`<button class="back" type="button" data-turn="-1">Back</button>${nx?`<button type="button" data-go="${nx.id}">Next: ${esc(nx.first)}</button>`:""}`}</div>
  </article></div>`;
  justStamped=null;
}

/* ---------- all students ---------- */
function all(){
  view.innerHTML=`<div class="wrap"><h1 class="h-q">All ${S.length} students</h1>
    <input class="search" id="q" type="search" placeholder="Name or project" autocomplete="off" aria-label="Search students">
    <ul class="rows" id="allrows"></ul>${footLinks()}</div>`;
  const inp=document.getElementById("q"); const draw=()=>{ const t=norm(inp.value.trim());
    document.getElementById("allrows").innerHTML=S.filter(s=>norm(s.name+" "+s.project+" "+CATS[s.cat]).includes(t)).map(s=>`<li><button class="row" type="button" data-go="${s.id}"><span class="av">${esc(ini(s))}</span><span><span class="nm">${esc(s.name)}</span>${st.stamps[s.id]?`<span class="tag">Stamped</span>`:""}<br><span class="pj">${esc(s.project)}</span></span><span class="where"><b>Room ${s.room}</b>Table ${s.table}</span></button></li>`).join("")||`<li class="muted">No one matches that yet. Try part of a name.</li>`; };
  inp.addEventListener("input",draw); draw();
}

/* ---------- my passport ---------- */
function my(){
  const n=stampCount(), stamped=S.filter(s=>st.stamps[s.id]);
  const rooms=[...new Set(S.map(s=>s.room))];
  view.innerHTML=`<div class="wrap"><h1 class="h-q">My passport</h1>
    <p class="muted">This is kept on your phone only. Nothing is shared unless you press the button below.</p>
    <div class="cover"><span class="otter" role="img" aria-label="Otter mark"></span><b>PASSPORT</b><span>Capstone Festival · December 2026</span><small>${st.role?esc(ROLES[st.role].label):"Visitor"}</small></div>
    <p><b>${n} of ${S.length} stamps.</b> <span class="muted">Tap a circle to open that student.</span></p>
    ${rooms.map(r=>`<h2 class="room">Room ${r}</h2><div class="grid">${S.filter(s=>s.room===r).map(s=>`<button class="slot" type="button" data-go="${s.id}" aria-label="${esc(s.name)}, table ${s.table}${st.stamps[s.id]?", stamped":""}">
      <span class="ring${st.stamps[s.id]?" done":""}">${st.stamps[s.id]?stamp(s.id,true,false):"Table "+s.table}</span><em>${esc(s.first)}</em></button>`).join("")}</div>`).join("")}
    <div class="panel"><h2 class="label" style="margin:0">Share my visit with the organizers</h2>
      <label class="check" for="c-did"><input type="checkbox" id="c-did" checked><span>What I did: who I am here as, and which students I visited</span></label>
      <label class="check" for="c-name"><input type="checkbox" id="c-name"><span>My name</span></label>
      <input class="search" id="v-name" type="text" placeholder="Your name" hidden aria-label="Your name">
      <label for="v-note" class="muted">One thing you will remember from today (optional)</label>
      <textarea id="v-note"></textarea>
      <button class="btn" type="button" id="share">Show what would be shared</button>
      <pre class="out" id="out" hidden></pre></div>
    <p class="foot"><button class="link" type="button" data-go="route">Back</button>
      <button class="link" type="button" data-go="all">All students</button>
      <button class="link" type="button" id="reset">Clear my answers and start over</button></p></div>`;
  const $=id=>document.getElementById(id);
  $("c-name").addEventListener("change",e=>{$("v-name").hidden=!e.target.checked;});
  $("share").addEventListener("click",()=>{ const L=[];
    if($("c-did").checked){ L.push("Visitor: "+(st.role?ROLES[st.role].label:"not given"));
      L.push("Students visited (stamps): "+(stamped.length?stamped.map(s=>s.name).join(", "):"none yet")); }
    if($("c-name").checked&&$("v-name").value.trim()) L.push("Name: "+$("v-name").value.trim());
    if($("v-note").value.trim()) L.push("Comment: "+$("v-note").value.trim());
    $("out").textContent=(L.length?L.join("\n"):"Nothing selected.")+"\n\nPrototype: nothing was sent. On the real site this goes to the festival spreadsheet."; $("out").hidden=false; });
  $("reset").addEventListener("click",()=>{ st=fresh(); shown=null; save(); go("start"); });
}

/* ---------- events ---------- */
function turn(d){ if(!document.body.classList.contains("pg")||!shown) return;
  const to=pg+d; if(to<0||to>1) return; pg=to; show(shown); }
document.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  if(b.dataset.turn) return turn(Number(b.dataset.turn));
  if(b.dataset.role){ st.role=b.dataset.role; st.sub=null; st.route=[]; st.seen=[]; st.cur=null; shown=null; save(); return go("ask"); }
  if(b.dataset.sub){ st.sub=b.dataset.sub; buildRoute(); st.seen=[]; shown=null; return go(st.route[0]); }
  if(b.dataset.stamp){ const id=b.dataset.stamp; if(st.stamps[id]) delete st.stamps[id]; else { st.stamps[id]=Date.now(); justStamped=id; } save(); return show(id); }
  if(b.dataset.go){ if(b.dataset.reset){ st.role=null; st.sub=null; st.route=[]; st.seen=[]; st.cur=null; shown=null; save(); } return go(b.dataset.go); }
});
document.addEventListener("keydown",e=>{
  if(e.target.closest("input,textarea")) return;
  if(e.key==="ArrowRight") turn(1); else if(e.key==="ArrowLeft") turn(-1);
});
window.addEventListener("hashchange",render);
render();
</script>
</body>
</html>
