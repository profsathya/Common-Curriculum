<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Capstone Festival Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
/* Layout idea: one column on a phone, one question per screen, large touch targets.
   From 900px the route sits on the left and the open table card on the right. */
:root{
  --bg:#EEF2F1; --surface:#FFFFFF; --ink:#0E2233; --muted:#516170; --rule:#CCD6D6;
  --accent:#0F6B5F; --accent-ink:#0A4D45; --accent-soft:#DDEFEA;
  --gold:#8A5A00; --gold-soft:#FBF0D9;
  --display:"Bricolage Grotesque","Arial Narrow",Arial,sans-serif;
  --body:"Atkinson Hyperlegible",Verdana,Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1820; --surface:#14242F; --ink:#E9F0EF; --muted:#9DB0B4; --rule:#2B3E48;
    --accent:#5CC4B2; --accent-ink:#9BE0D3; --accent-soft:#173B38;
    --gold:#F0C36A; --gold-soft:#3A2E14; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1820; --surface:#14242F; --ink:#E9F0EF; --muted:#9DB0B4; --rule:#2B3E48;
  --accent:#5CC4B2; --accent-ink:#9BE0D3; --accent-soft:#173B38;
  --gold:#F0C36A; --gold-soft:#3A2E14; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.5}
button,input,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.12}
p{margin:0}
a{color:var(--accent-ink)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.bar{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--rule);background:var(--surface);position:sticky;top:0;z-index:5}
.bar .mark{font-family:var(--display);font-weight:800;font-size:17px;margin-right:auto;background:none;border:0;padding:6px 0;cursor:pointer;text-align:left}
.bar .mark small{display:block;font-family:var(--body);font-weight:400;font-size:13px;color:var(--muted)}
.link{background:none;border:0;padding:10px 6px;color:var(--accent-ink);text-decoration:underline;cursor:pointer;font-size:16px;min-height:44px}
.sample{background:var(--gold-soft);color:var(--gold);font-size:14px;padding:8px 16px;text-align:center}

.wrap{max-width:1120px;margin:0 auto;padding:20px 16px 56px}
.narrow{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.eyebrow{font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink);font-weight:700}
.h-big{font-size:clamp(34px,9vw,52px);font-weight:800}
.h-q{font-size:clamp(26px,7vw,36px);font-weight:800}
.lede{font-size:19px;color:var(--ink);max-width:34em}
.muted{color:var(--muted);font-size:16px}

.choices{display:flex;flex-direction:column;gap:10px;list-style:none;padding:0;margin:0}
.choice{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--rule);border-radius:14px;padding:16px 18px;min-height:64px;cursor:pointer}
.choice b{font-family:var(--display);font-size:21px;font-weight:600}
.choice span{color:var(--muted);font-size:16px}
.choice:hover,.row:hover{border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{background:var(--surface);border:1.5px solid var(--rule);border-radius:999px;padding:12px 18px;min-height:48px;cursor:pointer;font-size:17px}
.chip:hover{border-color:var(--accent)}
.search{width:100%;padding:14px 16px;border:1.5px solid var(--rule);border-radius:12px;background:var(--surface);font-size:19px;min-height:54px}

.split{display:grid;gap:24px;grid-template-columns:1fr}
.pane{display:flex;flex-direction:column;gap:16px;min-width:0}
.split.open .list-pane{display:none}
.split:not(.open) .detail-pane{display:none}
@media (min-width:900px){
  .split{grid-template-columns:400px 1fr;align-items:start}
  .split.open .list-pane,.split:not(.open) .detail-pane{display:flex}
  .back{display:none}
}
.rows{display:flex;flex-direction:column;gap:10px;list-style:none;padding:0;margin:0}
.row{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--rule);border-radius:14px;padding:14px;cursor:pointer;min-height:72px}
.row[aria-current="true"]{border-color:var(--accent);background:var(--accent-soft)}
.num{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;background:var(--accent-soft);color:var(--accent-ink)}
.row.done .num{background:var(--accent);color:var(--surface)}
.row .nm{font-family:var(--display);font-weight:600;font-size:19px}
.row .pj{font-size:15px;color:var(--muted)}
.row .tag{font-size:13px;color:var(--gold);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.where{text-align:right;font-size:14px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.where b{display:block;font-size:16px;color:var(--ink)}

.card{background:var(--surface);border:1px solid var(--rule);border-radius:18px;padding:22px 20px;display:flex;flex-direction:column;gap:18px}
.card h2{font-size:clamp(28px,7vw,38px);font-weight:800}
.find{display:flex;gap:12px}
.find div{flex:1;background:var(--accent-soft);border-radius:12px;padding:10px 14px}
.find small{display:block;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent-ink)}
.find b{font-family:var(--display);font-size:34px;font-weight:800;font-variant-numeric:tabular-nums}
.block h3{font-size:14px;font-family:var(--body);font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.block p{max-width:36em}
.claim{font-family:var(--display);font-size:22px;font-weight:600;line-height:1.25}
.asks{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
.asks li{background:var(--gold-soft);border-left:5px solid var(--gold);border-radius:8px;padding:12px 14px;font-size:19px}
.made{font-size:14px;color:var(--muted);border-top:1px solid var(--rule);padding-top:12px}
.btn{background:var(--accent);color:var(--surface);border:0;border-radius:12px;padding:14px 18px;min-height:52px;font-weight:700;cursor:pointer;font-size:18px}
.btn.ghost{background:var(--surface);color:var(--accent-ink);border:1.5px solid var(--accent)}
.story{background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.story .draft{font-size:13px;color:var(--gold);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.check{display:flex;gap:12px;align-items:flex-start;padding:10px 0;min-height:48px;cursor:pointer}
.check input{width:24px;height:24px;margin-top:2px;accent-color:var(--accent)}
textarea{width:100%;min-height:90px;padding:12px;border:1.5px solid var(--rule);border-radius:12px;background:var(--surface)}
pre.out{white-space:pre-wrap;background:var(--accent-soft);border-radius:12px;padding:14px;font-family:var(--body);font-size:16px;margin:0}
@media (prefers-reduced-motion:no-preference){.choice,.row,.chip{transition:border-color .15s,background-color .15s}}
</style>
</head>
<body>
<div class="sample">Prototype. The students and projects on this page are made up.</div>
<header class="bar">
  <button class="mark" id="home" type="button">Capstone Festival<small>B.S. Computer Science · CSU Monterey Bay</small></button>
  <button class="link" id="visitBtn" type="button">My visit</button>
</header>
<div class="wrap"><main id="view"></main></div>

<script>
const CATS={software:"Open source and software",security:"Security and certificates",data:"Data and AI",web:"Web and mobile apps",games:"Games and interactive"};
const LENS={
  d:{label:"How students made decisions",line:"What they chose, what else they considered, and what the choice cost."},
  x:{label:"How students worked across domains",line:"Where a second field of knowledge changed the work."},
  a:{label:"How students used AI in their work",line:"Where AI helped, and where the student had to direct or correct it."}
};
const ROLES={
  family:{label:"Family or friend",sub:"I am here for a student"},
  employer:{label:"Employer or industry guest",sub:"I want to meet students in my line of work"},
  faculty:{label:"Faculty",sub:"I want to see how students worked"},
  admin:{label:"Administrator",sub:"I want a picture of the whole program"},
  student:{label:"Student",sub:"I want to see what capstone looks like"}
};
const UNIVERSAL="What was the hardest decision you made, and what did you give up by making it?";
/* name, project, cat, room, table, desc (professional), plain (family), claim, fam[2], pro, lens{} */
const S=[
["Maya Delgado","Fixing a sync bug in an open-source learning app","software",101,3,
 "Found why lesson progress was lost when tablets went offline, wrote the fix, and took it through two rounds of review with the project's maintainers.",
 "Maya found out why a learning app was losing children's lesson progress when their tablets had no internet. She wrote the fix and worked with the app's volunteer developers until they accepted it.",
 "I can find my way around a large codebase I did not write and get a fix accepted by the people who maintain it.",
 ["How did you find the cause of the problem in code that other people wrote?","What did the app's developers ask you to change before they accepted your fix?"],
 "What did the maintainers push back on in review, and what did you change because of it?",
 {d:"You had more than one way to fix the sync bug. Why this one, and what did it cost?",a:"Where did an AI tool point you the wrong way in that codebase, and how did you catch it?"}],
["Jordan Whitfield","Faster search for a city's open-data portal","software",101,5,
 "Rewrote the search index for a public data site so results that took eight seconds now come back in under one.",
 "Jordan made the search on a city's public information website much faster. A search that used to take eight seconds now takes less than one.",
 "I can measure why a system is slow and rebuild the slow part without breaking what depends on it.",
 ["How did you find out which part was slow?","How do you know nothing else broke when you changed it?"],
 "How did you prove the speed-up was real and not one lucky test?",
 {d:"What did you decide not to speed up, and why?",x:"What did you have to learn about how city staff publish data to get the search right?"}],
["Priya Raman","Making a code editor easier to use with a screen reader","software",101,7,
 "Tested an open-source editor with a screen reader, listed what got in the way, and fixed the three worst problems.",
 "Priya tested a tool that programmers write code in, using the screen reader software that blind programmers rely on. She listed what got in their way and fixed the three worst problems.",
 "I can test software the way a person with a disability uses it and fix what blocks them.",
 ["What surprised you when you used the tool without looking at the screen?","How did you choose which three problems to fix first?"],
 "How did you rank the problems, and who checked your ranking?",
 {x:"What did you learn from accessibility practice that changed how you write code?",d:"Which problem did you leave unfixed, and how did you decide?"}],
["Luis Carrillo","Reading a network capture after a port scan","security",104,2,
 "Studied for Security+ by working through a real packet capture, found the scan, and wrote a plan to stop the next one.",
 "Luis studied for a professional security certificate. To prepare, he examined a recording of real network traffic, found where someone had probed the network for weak points, and wrote a plan to stop it next time.",
 "I can read raw network traffic, spot an attack in it, and explain to a non-specialist what to do about it.",
 ["What does an attack look like when you see it in the traffic?","What would you tell a small business owner to do first?"],
 "Walk me through the capture. What was the first sign, and what did you rule out?",
 {d:"What did you leave out of your prevention plan, and why?",a:"How did you use AI while studying, and how did you check what it told you?"}],
["Hannah Okafor","Phishing awareness training that people finish","security",104,4,
 "Built a short training for a small nonprofit and measured how many staff reported the test emails before and after.",
 "Hannah built a short training that teaches the staff of a small nonprofit to recognize fake emails. She then measured whether staff reported more of the test emails after the training than before.",
 "I can change how people behave around security and measure whether the change happened.",
 ["How do you teach someone to spot a fake email?","What did the numbers show after the training?"],
 "What result would have convinced you the training did not work?",
 {x:"What did you take from teaching or psychology so that people finish the training?",d:"Why a short training and not a thorough one?"}],
["Tomás Ibarra","Hardening a home lab server","security",104,6,
 "Set up a small server, attacked it with common tools, and documented each change that closed a gap.",
 "Tomás set up a small server at home, attacked it himself with the tools real attackers use, and wrote down every change that closed a weakness.",
 "I can attack my own system, close the gaps I find, and document each change so someone else can repeat it.",
 ["What was the easiest way into your own server?","How do you know a gap is really closed?"],
 "Which fix would you defend to a team that says it slows them down?",
 {d:"Which gap did you decide was acceptable to leave, and why?",a:"Which attack steps did AI help with, and where did you have to work it out yourself?"}],
["Grace Nakamura","Predicting which crops need water first","data",110,1,
 "Combined soil sensor readings with weather data to rank fields by how soon they need irrigation.",
 "Grace combined readings from soil sensors with weather information to tell a farmer which fields will need water first.",
 "I can combine messy data from two sources into a ranking a farmer can act on.",
 ["How does the system decide which field comes first?","Who looked at your results, and what did they say?"],
 "How did you check your ranking against what happened in the fields?",
 {x:"What did you have to learn about farming before the data made sense?",d:"What did you do about sensor readings you could not trust?"}],
["Deshawn Price","Checking an AI tutor's math explanations","data",110,3,
 "Built a test set of algebra questions and measured how often an AI tutor's step-by-step answers had a wrong step.",
 "Deshawn tested an AI tutor that explains algebra step by step. He built a set of questions and counted how often one of the tutor's steps was wrong.",
 "I can design a test that shows where an AI system gives wrong answers, and report it in numbers.",
 ["How often was the AI tutor wrong, and on what kind of question?","How did you check the tutor's steps yourself?"],
 "How did you choose the questions so the test was fair?",
 {a:"What did you learn about when to trust an AI's explanation?",x:"What did you need to understand about how students learn algebra to judge a wrong step?"}],
["Elena Petrova","Finding patterns in bus ridership","data",110,5,
 "Cleaned two years of ridership data and showed which routes lose riders after schedule changes.",
 "Elena cleaned up two years of bus ridership records and showed which routes lose riders after a schedule change.",
 "I can turn two years of raw records into a finding a transit planner can use.",
 ["What was wrong with the records before you cleaned them?","Which finding would matter most to someone who rides the bus?"],
 "Which pattern did you first believe and later find was wrong?",
 {x:"What did you learn about transit planning that changed your analysis?",d:"What data did you throw away, and how did you decide?"}],
["Kai Mahoe","Volunteer scheduling app for a food bank","web",112,2,
 "Replaced a paper sign-up sheet with a phone app that volunteers can use in under a minute.",
 "Kai replaced a food bank's paper sign-up sheet with a phone app. Volunteers can now sign up for a shift in under a minute.",
 "I can watch how people do a task on paper and build an app they will use instead.",
 ["How did you find out what the volunteers needed?","What did you change after people first tried it?"],
 "What did you cut from the app so that sign-up stays under a minute?",
 {d:"Which feature did the food bank ask for that you said no to, and why?",x:"What did you learn about how a food bank runs that shaped the app?"}],
["Sofia Marquez","A bilingual clinic check-in page","web",112,4,
 "Built a check-in page in English and Spanish and tested it with people at the front desk.",
 "Sofia built a check-in page for a clinic that works in English and Spanish, and tested it with the people at the front desk.",
 "I can build software for people who use it in two languages and test it with the staff who depend on it.",
 ["What did the front desk staff tell you when they tried it?","What is hard about making one page work well in two languages?"],
 "What did testing at the front desk change in your design?",
 {x:"What did you have to learn about how a clinic handles patient information?",a:"How did you use AI for the Spanish text, and how did you check it?"}],
["Ethan Brooks","Offline-first notes app for field researchers","web",112,6,
 "Made a notes app that keeps working with no signal and syncs when the phone gets back online.",
 "Ethan made a notes app for researchers who work outdoors where there is no phone signal. The app keeps working and sends the notes when the phone is back online.",
 "I can build an app that keeps people's work safe when the connection fails.",
 ["What happens to a note if the phone loses signal halfway?","How did you test it without going out into the field?"],
 "What happens when two devices change the same note offline?",
 {d:"Which way of syncing did you reject, and what would it have cost?",a:"Where did AI-written code fail your offline tests?"}],
["Amara Nwosu","A puzzle game that teaches recursion","games",118,1,
 "Designed a puzzle game where each level is solved by breaking it into a smaller copy of itself.",
 "Amara designed a puzzle game that teaches a programming idea called recursion. Each level is solved by breaking it into a smaller copy of itself.",
 "I can turn an idea students find hard into a game that teaches it.",
 ["Can you show me the first level and how it is solved?","How do you know players learned the idea and did not just guess?"],
 "How did you test whether players learned recursion?",
 {x:"What did you take from teaching to design the levels?",d:"Which level did you remove, and why?"}],
["Ryan Castillo","Multiplayer card game with fair matchmaking","games",118,3,
 "Built an online card game and tuned the matchmaking so new players stop getting paired with experts.",
 "Ryan built an online card game and adjusted how players are paired, so beginners are no longer matched against experts.",
 "I can measure whether a system treats new users fairly and tune it until it does.",
 ["How does the game decide who plays against whom?","How do you know beginners are having a better time now?"],
 "What number told you matchmaking was unfair, and what is it now?",
 {d:"What did fairer matching cost in waiting time, and how did you choose?",a:"How did you use AI to simulate players, and what did it get wrong?"}],
["Lily Tran","An accessible rhythm game","games",118,5,
 "Made a rhythm game you can play with one hand or with sound only, and tested it with players who need both.",
 "Lily made a music game that can be played with one hand, or by sound alone without looking at the screen. She tested it with players who need those options.",
 "I can design for players with different abilities from the start and test with the people it is for.",
 ["How does someone play your game without seeing the screen?","What did your testers ask you to change?"],
 "What did testers change that you would not have found yourself?",
 {x:"What did you learn from accessibility that you will use in your next project?",a:"Where did AI help with the game, and where did you override it?"}]
].map((r,i)=>({id:"student-"+String(i+1).padStart(2,"0"),name:r[0],first:r[0].split(" ")[0],project:r[1],cat:r[2],room:r[3],table:r[4],desc:r[5],plain:r[6],claim:r[7],fam:r[8],pro:r[9],lens:r[10]}));
const byId=id=>S.find(s=>s.id===id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm=s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const order=ids=>ids.slice().sort((a,b)=>{const x=byId(a),y=byId(b);return x.room-y.room||x.table-y.table;});

/* The visitor's answers stay in this browser. Nothing is sent anywhere. */
const KEY="capstone-festival-guide-v1";
let st={role:null,sub:null,route:[],visited:[],seed:Math.floor(Math.random()*7)};
try{const j=JSON.parse(localStorage.getItem(KEY));if(j&&typeof j==="object")st=Object.assign(st,j);}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){}};
const view=document.getElementById("view");
const wide=window.matchMedia("(min-width:900px)");

function go(h){ if(location.hash==="#"+h) render(); else location.hash=h; }
function pick(list,n){ const out=[]; for(let i=0;i<list.length&&out.length<n;i++) out.push(list[(i+st.seed)%list.length]); return out; }
function onePerRoom(list,n){ const seen=new Set(),out=[]; const rot=list.map((_,i)=>list[(i+st.seed)%list.length]);
  for(const s of rot){ if(!seen.has(s.room)){seen.add(s.room);out.push(s);} if(out.length===n) return out; }
  for(const s of rot){ if(!out.includes(s)) out.push(s); if(out.length===n) break; } return out; }

function buildRoute(){
  const r=st.role, sub=st.sub; let list=[];
  if(r==="family"){ const me=byId(sub);
    const same=S.filter(s=>s.room===me.room&&s.id!==me.id), other=S.filter(s=>s.room!==me.room);
    list=[me,pick(same,1)[0],pick(other,1)[0]]; st.route=list.map(s=>s.id); save(); return; }
  if(r==="faculty") list=onePerRoom(S.filter(s=>s.lens[sub]),4);
  else if(r==="admin") list=onePerRoom(S,5);
  else if(sub==="any") list=onePerRoom(S,r==="student"?5:4);
  else { const inCat=S.filter(s=>s.cat===sub); list=inCat.slice(0,3).concat(pick(S.filter(s=>s.cat!==sub),1)); }
  st.route=order(list.map(s=>s.id)); save();
}

function render(){
  const h=location.hash.slice(1)||"start";
  if(h==="start"||!st.role&&h!=="all"&&h!=="visit"&&!h.startsWith("student-")) return start();
  if(h==="ask") return ask();
  if(h==="all") return all();
  if(h==="visit") return visit();
  if(h.startsWith("student-")&&byId(h)){ if(!st.route.includes(h)){st.route.push(h);save();} return route(h); }
  if(!st.route.length) return ask();
  return route(null);
}

function start(){
  view.innerHTML=`<div class="narrow">
    <p class="eyebrow">December 2026 · date and rooms to be confirmed</p>
    <h1 class="h-big">Capstone Festival</h1>
    <p class="lede">Tell us who you are. We will suggest which tables to visit and what to ask when you get there.</p>
    <h2 class="h-q">Who are you?</h2>
    <ul class="choices">${Object.entries(ROLES).map(([k,v])=>`<li><button class="choice" type="button" data-role="${k}"><b>${esc(v.label)}</b><span>${esc(v.sub)}</span></button></li>`).join("")}</ul>
    <p><button class="link" type="button" data-go="all">Or see all ${S.length} students</button></p>
  </div>`;
}

function ask(){
  const r=st.role; let body="";
  if(r==="family") body=`<h1 class="h-q">Who are you here for?</h1>
    <input class="search" id="who" type="search" placeholder="Type a first or last name" autocomplete="off" aria-label="Student name">
    <ul class="rows" id="names"></ul>`;
  else if(r==="faculty") body=`<h1 class="h-q">What would you like to see today?</h1>
    <ul class="choices">${Object.entries(LENS).map(([k,v])=>`<li><button class="choice" type="button" data-sub="${k}"><b>${esc(v.label)}</b><span>${esc(v.line)}</span></button></li>`).join("")}</ul>`;
  else if(r==="admin"){ buildRoute(); return go("route"); }
  else body=`<h1 class="h-q">${r==="employer"?"What kind of work do you hire for?":"What are you curious about?"}</h1>
    <div class="chips">${Object.entries(CATS).map(([k,v])=>`<button class="chip" type="button" data-sub="${k}">${esc(v)}</button>`).join("")}
    <button class="chip" type="button" data-sub="any">${r==="employer"?"Any of these":"Show me a mix"}</button></div>`;
  view.innerHTML=`<div class="narrow"><p class="eyebrow">${esc(ROLES[r].label)}</p>${body}
    <p><button class="link" type="button" data-go="start">Change who I am</button></p></div>`;
  if(r==="family"){ const inp=document.getElementById("who"); const draw=()=>{ const t=norm(inp.value.trim());
      document.getElementById("names").innerHTML=S.filter(s=>norm(s.name).includes(t)).map(s=>`<li><button class="row" type="button" data-sub="${s.id}"><span class="num">${esc(s.name.split(" ").map(p=>p[0]).join(""))}</span><span><span class="nm">${esc(s.name)}</span><br><span class="pj">${esc(s.project)}</span></span><span></span></button></li>`).join("")||`<li class="muted">No student matches that name yet. Try fewer letters.</li>`; };
    inp.addEventListener("input",draw); draw(); }
}

function routeHead(){
  const r=st.role, n=st.route.length;
  if(r==="family"){ const me=byId(st.route[0]); return `<p class="eyebrow">You are here for</p><h1 class="h-q">${esc(me.name)}</h1><p class="muted">Start at ${esc(me.first)}'s table. Then visit two more tables to see what other students did.</p>`; }
  if(r==="faculty") return `<p class="eyebrow">Faculty route</p><h1 class="h-q">${n} tables to visit</h1><p class="muted">${esc(LENS[st.sub].label)}. Each table comes with a question to ask.</p>`;
  if(r==="admin") return `<p class="eyebrow">Administrator route</p><h1 class="h-q">The program in ${n} tables</h1>
    <div class="story"><span class="draft">Draft wording</span>
    <p>Each student in this capstone built an Interactive Poster. It opens with one claim about a skill the student can show, then the work behind it, a decision they made, and an obstacle they met.</p>
    <p>Students present at their own laptops. The route below takes you to one table in each area of work.</p></div>`;
  if(r==="employer") return `<p class="eyebrow">Employer route</p><h1 class="h-q">${n} tables to visit</h1><p class="muted">${st.sub==="any"?"One student from each area of work.":"Three students in "+esc(CATS[st.sub])+", and one from another area."}</p>`;
  if(r==="student") return `<p class="eyebrow">Student route</p><h1 class="h-q">${n} tables to visit</h1><p class="muted">Ask the question on each card. Then ask how they chose their project.</p>`;
  return `<h1 class="h-q">Tables you opened</h1>`;
}

function card(s){
  const fam=st.role==="family";
  const q=fam?s.fam.concat([UNIVERSAL]):[st.role==="faculty"&&s.lens[st.sub]?s.lens[st.sub]:s.pro];
  const done=st.visited.includes(s.id);
  return `<button class="link back" type="button" data-go="route">← Back to my route</button>
  <article class="card">
    <div><p class="eyebrow">${esc(CATS[s.cat])}</p><h2>${esc(s.name)}</h2></div>
    <div class="find" aria-label="Where to find ${esc(s.first)}"><div><small>Room</small><b>${s.room}</b></div><div><small>Table</small><b>${s.table}</b></div></div>
    <section class="block"><h3>${fam?"What "+esc(s.first)+" did":"Project"}</h3>${fam?"":`<p><b>${esc(s.project)}</b></p>`}<p>${esc(fam?s.plain:s.desc)}</p></section>
    <section class="block"><h3>${fam?"What this shows about "+esc(s.first):esc(s.first)+"'s claim"}</h3><p class="claim">${esc(s.claim)}</p></section>
    <section class="block"><h3>${q.length>1?"Questions you can ask "+esc(s.first):"A question to ask "+esc(s.first)}</h3><ul class="asks">${q.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></section>
    <button class="btn ${done?"ghost":""}" type="button" data-visit="${s.id}">${done?"Visited. Tap to undo":"I visited "+esc(s.first)}</button>
    <p class="made">Drafted by AI from ${esc(s.first)}'s Interactive Poster. Read and approved by ${esc(s.first)} before it was published.</p>
  </article>`;
}

function route(cur){
  const open=cur||(wide.matches?st.route[0]:null);
  const rows=st.route.map((id,i)=>{ const s=byId(id), done=st.visited.includes(id);
    const tag=st.role==="family"?(i===0?"Your student":i===1?"Also visit":""):"";
    return `<li><button class="row ${done?"done":""}" type="button" data-go="${id}" aria-current="${id===open}">
      <span class="num">${done?"✓":i+1}</span>
      <span>${tag?`<span class="tag">${tag}</span><br>`:""}<span class="nm">${esc(s.name)}</span><br><span class="pj">${esc(s.project)}</span></span>
      <span class="where"><b>Room ${s.room}</b>Table ${s.table}</span></button></li>`; }).join("");
  view.innerHTML=`<div class="split ${cur?"open":""}">
    <div class="pane list-pane">${routeHead()}<ul class="rows">${rows}</ul>
      <p><button class="link" type="button" data-go="ask">Change my answer</button> <button class="link" type="button" data-go="all">See all students</button></p></div>
    <div class="pane detail-pane">${open?card(byId(open)):""}</div></div>`;
  if(cur) window.scrollTo(0,0);
}

function all(){
  view.innerHTML=`<div class="narrow"><h1 class="h-q">All ${S.length} students</h1>
    <input class="search" id="q" type="search" placeholder="Name or project" autocomplete="off" aria-label="Search students">
    <ul class="rows" id="allrows"></ul><p><button class="link" type="button" data-go="${st.route.length?"route":"start"}">← Back</button></p></div>`;
  const inp=document.getElementById("q"); const draw=()=>{ const t=norm(inp.value.trim());
    document.getElementById("allrows").innerHTML=S.filter(s=>norm(s.name+" "+s.project+" "+CATS[s.cat]).includes(t)).map(s=>`<li><button class="row" type="button" data-go="${s.id}"><span class="num">${esc(s.name.split(" ").map(p=>p[0]).join(""))}</span><span><span class="nm">${esc(s.name)}</span><br><span class="pj">${esc(s.project)}</span></span><span class="where"><b>Room ${s.room}</b>Table ${s.table}</span></button></li>`).join("")||`<li class="muted">No one matches that yet. Try part of a name.</li>`; };
  inp.addEventListener("input",draw); draw();
}

function visit(){
  const seen=st.visited.map(byId).filter(Boolean);
  view.innerHTML=`<div class="narrow"><h1 class="h-q">My visit</h1>
    <p class="muted">This is kept on your phone only. Nothing is shared unless you press the button below.</p>
    <div class="story"><p><b>${st.role?esc(ROLES[st.role].label):"Visitor"}</b></p>
      <p>${seen.length?"Tables visited: "+seen.map(s=>esc(s.name)).join(", ")+".":"You have not marked a table as visited yet."}</p></div>
    <h2 class="h-q" style="font-size:24px">Share my visit with the organizers</h2>
    <label class="check" for="c-did"><input type="checkbox" id="c-did" checked><span>What I did: who I am here as, and which tables I visited</span></label>
    <label class="check" for="c-name"><input type="checkbox" id="c-name"><span>My name</span></label>
    <input class="search" id="v-name" type="text" placeholder="Your name" hidden aria-label="Your name">
    <label for="v-note" class="muted">One thing you will remember from today (optional)</label>
    <textarea id="v-note"></textarea>
    <button class="btn" type="button" id="share">Show what would be shared</button>
    <pre class="out" id="out" hidden></pre>
    <p><button class="link" type="button" data-go="${st.route.length?"route":"start"}">← Back</button> <button class="link" type="button" id="reset">Clear my answers and start over</button></p></div>`;
  const $=id=>document.getElementById(id);
  $("c-name").addEventListener("change",e=>{$("v-name").hidden=!e.target.checked;});
  $("share").addEventListener("click",()=>{ const L=[];
    if($("c-did").checked){ L.push("Visitor: "+(st.role?ROLES[st.role].label:"not given")); L.push("Tables visited: "+(seen.length?seen.map(s=>s.name).join(", "):"none marked")); }
    if($("c-name").checked&&$("v-name").value.trim()) L.push("Name: "+$("v-name").value.trim());
    if($("v-note").value.trim()) L.push("Comment: "+$("v-note").value.trim());
    $("out").textContent=(L.length?L.join("\n"):"Nothing selected.")+"\n\nPrototype: nothing was sent. On the real site this goes to the festival spreadsheet."; $("out").hidden=false; });
  $("reset").addEventListener("click",()=>{ st={role:null,sub:null,route:[],visited:[],seed:Math.floor(Math.random()*7)}; save(); go("start"); });
}

document.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  if(b.id==="home") return go(st.route.length?"route":"start");
  if(b.id==="visitBtn") return go("visit");
  if(b.dataset.role){ st.role=b.dataset.role; st.sub=null; st.route=[]; save(); return go("ask"); }
  if(b.dataset.sub){ st.sub=b.dataset.sub; buildRoute(); return go("route"); }
  if(b.dataset.visit){ const id=b.dataset.visit, i=st.visited.indexOf(id); if(i<0) st.visited.push(id); else st.visited.splice(i,1); save(); return render(); }
  if(b.dataset.go){ if(b.dataset.go==="start"){ st.role=null; st.sub=null; st.route=[]; save(); } return go(b.dataset.go); }
});
window.addEventListener("hashchange",render);
wide.addEventListener("change",render);
render();
</script>
</body>
</html>
