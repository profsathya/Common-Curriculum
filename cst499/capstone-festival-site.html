*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font:400 17px/1.5 var(--body);-webkit-text-size-adjust:100%}
h1,h2,h3,p,ul{margin:0}
ul{padding:0;list-style:none}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--ocean);outline-offset:2px}
#view{min-height:100%}
.wrap{max-width:560px;margin:0 auto;padding:28px 18px 40px;display:flex;flex-direction:column;gap:20px}
.eyebrow{font:700 12px/1.3 var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.h-big{font:800 40px/1.05 var(--display);letter-spacing:-.01em;color:var(--bay);text-wrap:balance}
.h-q{font:700 26px/1.2 var(--display);color:var(--bay);text-wrap:balance}
.label{font:700 13px/1.3 var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--bay);margin-bottom:8px}
.muted{color:var(--muted)}
.small{font-size:14.5px}
.link{background:none;border:0;padding:6px 0;margin-right:16px;color:var(--bay);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.foot{display:flex;flex-wrap:wrap;gap:2px 0}
.proto{font-size:13.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}

/* ---------- front door ---------- */
.front{gap:18px;padding-top:28px}
.otter{display:block;aspect-ratio:552/391;background:currentColor;-webkit-mask:var(--otter) center/contain no-repeat;mask:var(--otter) center/contain no-repeat}
.front .eyebrow{font-size:11px;letter-spacing:.08em}
.front .h-big{font-size:min(8.4vw,40px)}
.mast{display:flex;flex-direction:column;gap:6px}
.picked{font-size:14.5px;color:var(--muted);margin-top:8px}
.choices{display:flex;flex-direction:column;gap:6px}
.choice{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;background:var(--white);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px}
.choice b{font:600 16.5px/1.25 var(--display);color:var(--ink)}
.choice span{display:block;font-size:14.5px;color:var(--muted);margin-top:2px}
.choice i{font-style:normal;color:var(--ocean);font-size:22px;line-height:1}
.choice:hover,.row:hover{border-color:var(--ocean)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--white);border:1.5px solid var(--line);border-radius:999px;padding:9px 15px;font-weight:600;color:var(--bay)}
.chip:hover{border-color:var(--ocean)}
@media (min-width:900px){
  .front{max-width:980px;display:grid;grid-template-columns:1fr 1fr;column-gap:48px;align-items:start;padding-top:64px}
    .front .mast{grid-column:1}
  .front .who{grid-column:2;grid-row:1}
  .front .tail{grid-column:1 / -1}
  .front .h-big{font-size:54px}
  .front .eyebrow{font-size:12px;letter-spacing:.12em}
}

/* ---------- lists ---------- */
.search{width:100%;font:inherit;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--white);color:var(--ink)}
.rows{display:flex;flex-direction:column;gap:7px}
.row{width:100%;display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:12px;text-align:left;background:var(--white);border:1.5px solid var(--line);border-radius:12px;padding:9px 12px}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--mist);color:var(--bay);font:700 14px/1 var(--display)}
.row .nm{font:600 16px/1.25 var(--display);color:var(--ink)}
.row .pj{font-size:14.5px;line-height:1.3;color:var(--muted)}
.row .where{text-align:right;font-size:13.5px;color:var(--muted);white-space:nowrap}
.row .where b{display:block;color:var(--bay);font:700 14px/1.3 var(--display)}
.tag{display:inline-block;font:700 11px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--bay);margin-left:6px}
.tag::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:5px}

/* ---------- the sheet: one student, five pages ---------- */
body.pg #view{height:100%}
.pager{height:100%;display:grid;place-items:center}
.sheet{position:relative;width:100%;max-width:560px;height:100%;max-height:900px;display:flex;flex-direction:column;background:var(--white);color:var(--ink);overflow:hidden}
.top{padding:12px 16px 0;display:flex;flex-direction:column;gap:10px}
.prog{display:flex;gap:5px}
.prog i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.prog i.on{background:var(--bay)}
.bar{display:flex;align-items:center;gap:10px;min-height:40px}
.bar .av{width:36px;height:36px;font-size:12px;flex:none}
.bar .id{flex:1;min-width:0;font:600 14.5px/1.25 var(--display)}
.bar .id small{display:block;font:400 13.5px/1.3 var(--body);opacity:.8}
.x{flex:none;width:40px;height:40px;border-radius:50%;border:0;background:transparent;font-size:24px;line-height:1;color:inherit}
.x:hover{background:rgba(107,146,182,.22)}
.slide{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column}
.k{font:700 12.5px/1.3 var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--bay)}
.name{font:800 40px/1.05 var(--display);letter-spacing:-.01em;text-wrap:balance}
.proj{font:600 19px/1.3 var(--display);color:var(--bay);text-wrap:balance}
.t{font-size:19px;line-height:1.5;max-width:34em}
.claim{font:600 21px/1.36 var(--display);color:var(--bay);text-wrap:balance}
.asks{display:flex;flex-direction:column;gap:8px}
.asks li{background:var(--white);border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;font-size:17px;line-height:1.4}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{border-radius:999px;padding:6px 14px;font:700 14.5px/1.2 var(--display);background:var(--bay);color:var(--white)}
.pill.o{background:transparent;color:inherit;box-shadow:inset 0 0 0 1.5px currentColor}
.photo{width:132px;height:132px;border-radius:20px;display:grid;place-items:center;background:var(--mist);color:var(--bay);font:800 40px/1 var(--display)}
.hint{font-size:15px;opacity:.8}
.btn{display:block;width:100%;text-align:center;text-decoration:none;border-radius:12px;padding:13px 16px;font:700 16px/1.25 var(--display);background:var(--bay);color:var(--white);border:1.5px solid var(--bay)}
.btn:hover{background:var(--bay-deep)}
.btn:disabled{opacity:.6;cursor:default}
.two.solo{grid-template-columns:1fr}
/* the stamp on the first screen of a student already visited: bottom right, behind the text */
.one{position:relative}
.one>*{position:relative;z-index:1}
.one>.visited{position:absolute;z-index:0;right:14px;bottom:10px;pointer-events:none}
.visited .stamp{width:108px}
.draftnote{font:600 12.5px/1.3 var(--body);color:var(--muted)}
img.photo{object-fit:cover}
.btn.ghost{background:var(--white);color:var(--bay)}
.btn.ghost:hover{background:var(--mist)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.two .btn{padding:10px 10px;font-size:14.5px}
.made{font-size:13px;line-height:1.4;color:var(--muted)}
.draft{display:inline-block;font:700 10.5px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;border:1px solid currentColor;border-radius:4px;padding:3px 5px;margin-left:6px;vertical-align:middle}
.nav{display:flex;gap:10px;padding:10px 16px 16px}
.nav button{flex:1;border-radius:12px;padding:13px 12px;font:700 16px/1.2 var(--display);border:1.5px solid var(--bay);background:var(--bay);color:var(--white)}
.nav button.back{flex:0 0 34%;background:transparent;color:inherit;border-color:currentColor}
.nav button[hidden]{display:none}
.nav{border-top:1px solid var(--line);padding-top:12px}

/* Page 1 opens with a Monterey Bay Blue band: who the student is and where to find them */
.top{padding-bottom:8px}
.slide.bay{background:var(--bay);color:var(--white)}
.one{flex:1 0 auto;padding:18px 22px;display:flex;flex-direction:column;gap:14px}
.one.fromtop{gap:12px;padding-top:16px;padding-bottom:12px}
.one.fromtop .target,.one.fromtop .stamp{width:124px;height:124px}
.one.fromtop .target{padding:12px;font-size:13px}
.one.fromtop .target.done{padding:0}
.one.fromtop .stamp .otter{left:20.5%;width:59%}
.slide.bay .k{color:#c5d5e5}
.slide.bay .claim{color:var(--white)}
.slide.bay .photo{background:rgba(255,255,255,.16);color:var(--white)}
.slide.bay .pill{background:var(--white);color:var(--bay)}
.slide.bay .pill.o{background:transparent;color:var(--white)}
.logo{display:block;height:auto}
.mast .logo{width:214px;max-width:62%;margin:0 0 8px -3px}
.hero .logo{grid-column:1 / -1;justify-self:end;width:138px;margin:-2px -4px 0 0}
.hero{flex:none;background:var(--bay);color:var(--white);padding:18px 22px 20px;display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.hero .photo{width:96px;height:96px;border-radius:18px;font-size:30px;background:rgba(255,255,255,.16);color:var(--white)}
.hero .k{color:#c5d5e5;margin-bottom:4px}
.hero .name{font-size:30px;margin-bottom:10px}
.hero .name.long{font-size:24px}
.hero .pill{background:var(--white);color:var(--bay)}
.hero .pill.o{background:transparent;color:var(--white)}
.body{padding:20px 22px 14px;display:flex;flex-direction:column;gap:18px}
.sec{display:flex;flex-direction:column;gap:8px}
.claimbox{background:var(--mist);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.about{border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;font-size:16px}
.stampzone{display:flex;align-items:center;gap:16px}
.target{flex:none;width:148px;height:148px;border-radius:50%;border:2px dashed var(--ocean);background:var(--white);display:grid;place-items:center;text-align:center;font:600 14px/1.3 var(--display);color:var(--bay);padding:18px}
.target.done{border-color:transparent;padding:0;background:transparent}
.stampzone p{font-size:15.5px;line-height:1.4;color:var(--muted)}
.stampzone p b{display:block;color:var(--bay);font:700 16px/1.3 var(--display)}

/* The stamp: the otter spirit mark alone in a ring, in Monterey Bay Blue */
.stamp{position:relative;display:block;width:148px;aspect-ratio:1;color:var(--bay);transform:rotate(var(--r,-8deg));opacity:.92}
.stamp svg{position:absolute;inset:0;width:100%;height:100%}
.stamp .otter{position:absolute;left:22%;width:56%;top:50%;transform:translateY(-52%)}
.stamp.sm{width:100%}
.stamp.sm .otter{left:13%;width:74%}
.stamp.in{animation:thump .42s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes thump{from{transform:rotate(var(--r,-8deg)) scale(1.8);opacity:0}60%{opacity:.92}to{transform:rotate(var(--r,-8deg)) scale(1);opacity:.92}}
@media (prefers-reduced-motion:reduce){.stamp.in{animation:none}}
/* the stamp screen: next students on one line each, so the screen never needs a scroll */
.one.fromtop .row{padding:8px 12px}
.one.fromtop .row>span:nth-child(2){min-width:0}
.one.fromtop .row .pj{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.one.fromtop .row br{display:none}
.one.fromtop .link{font-size:15.5px;margin-right:13px;padding:4px 0}
/* phones whose browser leaves less than 700px of height (most iPhones and small Android phones): tighter type */
@media (max-height:700px){
  .top{padding:10px 16px 6px;gap:8px}
  .bar{min-height:36px}
  .nav{padding:10px 16px 12px}
  .nav button{padding:12px}
  .one{padding:14px 20px;gap:12px}
  .hero{padding:12px 20px 16px;gap:8px 14px}
  .hero .logo{width:128px}
  .hero .photo{width:80px;height:80px;font-size:26px;border-radius:16px}
  .hero .name{font-size:27px;margin-bottom:8px}
  .hero .name.long{font-size:21px}

/* ---------- my visit / my passport ---------- */
.cover{background:var(--bay);color:var(--white);border-radius:16px;border-left:10px solid var(--bay-deep);padding:26px 20px 22px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.cover .otter{width:150px;color:var(--white);margin:6px 0 10px}
.cover b{font:800 26px/1 var(--display);letter-spacing:.3em;margin-right:-.3em}
.cover span{font:600 14px/1.4 var(--display);opacity:.9}
.cover small{font-size:14px;opacity:.8}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 10px}
.slot{background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;text-align:center}
.slot .ring{width:100%;max-width:104px;aspect-ratio:1;border-radius:50%;border:2px dashed var(--ocean);display:grid;place-items:center;font:600 12.5px/1.2 var(--display);color:var(--muted)}
.slot .ring.done{border:0}
.slot em{font:600 14px/1.2 var(--display);font-style:normal;color:var(--ink)}
.room{font:700 13px/1.3 var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--bay);border-bottom:1px solid var(--line);padding-bottom:6px}
.panel{background:var(--white);border:1.5px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.check{display:flex;gap:10px;align-items:flex-start}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--bay);flex:none}
textarea{width:100%;min-height:76px;font:inherit;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--white);color:var(--ink)}
.out{white-space:pre-wrap;font:500 14px/1.5 ui-monospace,Menlo,Consolas,monospace;background:var(--mist);border-radius:12px;padding:14px;margin:0}
[hidden]{display:none !important}

/* Where "Share my visit" sends a visitor's summary: the web app address of the script attached to the festival spreadsheet.
   Empty means the button only shows what would be shared and sends nothing. */
const SHARE_URL="https://script.google.com/macros/s/AKfycbymeB9ckvNwwMs-32yeGJGIcDkIL2kRruZTa4jp3t66yL_ekM9LJXuqhhVek_d-V7bp/exec";
const PAGE_ID="capstone-festival-site 2026-11-23";

const byId=id=>S.find(s=>s.id===id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm=s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const ini=s=>s.name.split(" ").map(p=>p[0]).join("");
const order=ids=>ids.slice().sort((a,b)=>{const x=byId(a),y=byId(b);return (x.room||0)-(y.room||0)||(x.table||0)-(y.table||0);});

/* A visitor's answers stay on their own device. */
const KEY="capstone-festival-passport-v2";
const fresh=()=>({role:null,sub:null,route:[],seen:[],stamps:{},cur:null,seed:Math.floor(Math.random()*7)});
let st=fresh();
try{const j=JSON.parse(localStorage.getItem(KEY));if(j&&typeof j==="object")st=Object.assign(st,j);}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){}};
const view=document.getElementById("view");
let pg=0, shown=null, justStamped=null;

function go(h){ if(location.hash==="#"+h) render(); else location.hash=h; }
function pick(list,n){ const out=[]; for(let i=0;i<list.length&&out.length<n;i++) out.push(list[(i+st.seed)%list.length]); return out; }
function onePerRoom(list,n){ const seen=new Set(),out=[]; const rot=list.map((_,i)=>list[(i+st.seed)%list.length]);
  for(const s of rot){ if(!seen.has(s.room)){seen.add(s.room);out.push(s);} if(out.length===n) return out; }
  for(const s of rot){ if(!out.includes(s)) out.push(s); if(out.length===n) break; } return out; }

function buildRoute(){
  const r=st.role, sub=st.sub; let list=[];
  const unstamped=S.filter(s=>!st.stamps[s.id]), T=unstamped.length?unstamped:S;
  if(r==="family"){ const me=byId(sub);
    const same=T.filter(s=>s.room===me.room&&s.id!==me.id), other=T.filter(s=>s.room!==me.room);
    const second=pick(same,1)[0], third=pick(other.length?other:same.filter(s=>s!==second),1)[0];
    list=[me,second,third].filter(Boolean); st.route=list.map(s=>s.id); save(); return; }
  const lensed=T.filter(s=>s.lens[sub]), inCat=T.filter(s=>s.cat===sub);
  if(r==="faculty") list=onePerRoom(lensed.length?lensed:T,4);
  else if(r==="admin") list=onePerRoom(T,5);
  else if(sub==="any") list=onePerRoom(T,r==="student"?5:4);
  else if(inCat.length){ st.route=inCat.slice(0,3).concat(pick(T.filter(s=>s.cat!==sub),1)).map(s=>s.id); save(); return; }
  else list=onePerRoom(T,4);
  st.route=order(list.map(s=>s.id)); save();
}
function nextTwo(cur){
  const me=byId(cur), seen=new Set(st.seen.concat([cur]));
  const fits=s=>st.role==="faculty"?!!s.lens[st.sub]:(st.role==="employer"||st.role==="student")&&st.sub!=="any"?s.cat===st.sub:false;
  const planned=st.route.filter(id=>!seen.has(id)&&!st.stamps[id]).map(byId).filter(Boolean);
  const others=S.filter(s=>!seen.has(s.id)&&!st.stamps[s.id]&&!st.route.includes(s.id))
    .sort((x,y)=>(fits(y)-fits(x))||(Math.abs((x.room||0)-(me.room||0))-Math.abs((y.room||0)-(me.room||0)))||((x.table||0)-(y.table||0)));
  return planned.concat(others).slice(0,2);
}

function render(){
  const h=location.hash.slice(1)||"start";
  document.body.classList.remove("pg");
  if(h==="ask"&&st.role) return ask();
  if(h==="all") return all();
  if(h==="my") return my();
  if(h.startsWith("student-")&&byId(h)) return show(h);
  if(h==="route"&&(st.cur||st.route.length)) return go(st.cur||st.route[0]);
  return start();
}

const stampCount=()=>Object.keys(st.stamps).length;
function footLinks(){
  return `<p class="foot"><button class="link" type="button" data-go="my">My passport${stampCount()?" ("+stampCount()+")":""}</button>
    <button class="link" type="button" data-go="all">All students</button>
    <button class="link" type="button" data-go="start" data-reset="1">Start over</button></p>`;
}

/* ---------- front door ---------- */
function start(){
  view.innerHTML=`<div class="wrap front">
    <header class="mast">${LOGO}<p class="eyebrow">B.S. Computer Science</p>
      <h1 class="h-big">Capstone Festival</h1>
      <p class="muted">December 2026 · ${S.length} students. Collect a stamp for each student you visit.</p></header>
    <section class="who"><h2 class="label">I am a</h2>
      <ul class="choices">${Object.entries(ROLES).map(([k,v])=>`<li><button class="choice" type="button" data-role="${k}"><b>${esc(v.label)}</b><i aria-hidden="true">›</i></button></li>`).join("")}</ul></section>
    <div class="tail"><p class="foot"><button class="link" type="button" data-go="all">See all ${S.length} students</button>${stampCount()?`<button class="link" type="button" data-go="my">My passport (${stampCount()})</button>`:""}</p>
      <p class="proto">${DATA.sample?"Prototype. The students and projects on this page are made up, and the links on each page are samples.":S.length?"Each student's pages were drafted by AI from their Interactive Poster. A page marked Draft has not been approved by the student yet.":"The student pages are being prepared."}</p></div>
  </div>`;
}

function ask(){
  const r=st.role; let body="";
  if(r==="family") body=`<h1 class="h-q">Who are you here for?</h1>
    <input class="search" id="who" type="search" placeholder="Type a first or last name" autocomplete="off" aria-label="Student name">
    <ul class="rows" id="names"></ul>`;
  else if(r==="faculty") body=`<h1 class="h-q">What would you like to see today?</h1>
    <ul class="choices">${Object.entries(LENS).map(([k,v])=>`<li><button class="choice" type="button" data-sub="${k}"><span><b>${esc(v.label)}</b><span>${esc(v.line)}</span></span><i aria-hidden="true">›</i></button></li>`).join("")}</ul>`;
  else if(r==="admin"){ buildRoute(); st.seen=[]; return go(st.route[0]); }
  else body=`<h1 class="h-q">${r==="employer"?"What kind of work do you hire for?":"What are you curious about?"}</h1>
    <div class="chips">${Object.entries(CATS).map(([k,v])=>`<button class="chip" type="button" data-sub="${k}">${esc(v)}</button>`).join("")}
    <button class="chip" type="button" data-sub="any">${r==="employer"?"Any of these":"Show me a mix"}</button></div>`;
  view.innerHTML=`<div class="wrap"><p class="eyebrow">${esc(ROLES[r].label)}</p>${body}
    <p class="foot"><button class="link" type="button" data-go="start" data-reset="1">Change who I am</button></p></div>`;
  if(r==="family"){ const inp=document.getElementById("who"); const draw=()=>{ const t=norm(inp.value.trim());
      document.getElementById("names").innerHTML=S.filter(s=>norm(s.name).includes(t)).map(s=>`<li><button class="row" type="button" data-sub="${s.id}"><span class="av">${esc(ini(s))}</span><span><span class="nm">${esc(s.name)}</span><br><span class="pj">${esc(s.project)}</span></span><span></span></button></li>`).join("")||`<li class="muted">No student matches that name yet. Try fewer letters.</li>`; };
    inp.addEventListener("input",draw); draw(); }
}

/* ---------- the stamp ---------- */
function stamp(id,small,animate){
  const r=([...id].reduce((n,c)=>n+c.charCodeAt(0),0)*37%19)-9;
  const ring=small?`<circle cx="100" cy="100" r="95" fill="none" stroke="currentColor" stroke-width="4"/>`
    :`<circle cx="100" cy="100" r="96" fill="none" stroke="currentColor" stroke-width="3.5"/>
      <circle cx="100" cy="100" r="89.5" fill="none" stroke="currentColor" stroke-width="1.2"/>
      <g fill="currentColor" font-family="Montserrat,sans-serif" font-weight="700" font-size="12" letter-spacing="2.6">
        <text><textPath href="#arc-t" startOffset="50%" text-anchor="middle">CAPSTONE FESTIVAL</textPath></text>
        <text><textPath href="#arc-b" startOffset="50%" text-anchor="middle">DECEMBER 2026</textPath></text></g>
      <circle cx="19" cy="100" r="2.6" fill="currentColor"/><circle cx="181" cy="100" r="2.6" fill="currentColor"/>`;
  return `<span class="stamp${small?" sm":""}${animate?" in":""}" style="--r:${r}deg" role="img" aria-label="Stamp"><svg viewBox="0 0 200 200" aria-hidden="true">${ring}</svg><span class="otter"></span></span>`;
}

/* ---------- one student, three screens ---------- */
function whereCell(n){ return n.room!=null?`<span class="where"><b>Room ${n.room}</b>${n.table!=null?"Table "+n.table:""}</span>`:`<span></span>`; }
function photo(s,f){ return s.photo?`<img class="photo" src="${esc(s.photo)}" alt="${f}">`:`<span class="photo" role="img" aria-label="Space for ${f}'s photo">${esc(ini(s))}</span>`; }
function nextRows(nx){
  return nx.map(n=>`<li><button class="row" type="button" data-go="${n.id}">
      <span class="av" aria-hidden="true">${esc(ini(n))}</span>
      <span><span class="nm">${esc(n.name)}</span><br><span class="pj">${esc(n.project)}</span></span>
      ${whereCell(n)}</button></li>`).join("");
}
function pages(s){
  const fam=st.role==="family", mine=fam&&s.id===st.sub, f=esc(s.first);
  const q=(fam?s.fam.concat([UNIVERSAL]):[st.role==="faculty"&&s.lens[st.sub]?s.lens[st.sub]:(s.pro||UNIVERSAL)]).filter(Boolean);
  const P=[];
  if(st.role==="admin"&&s.id===st.route[0]) P.push({h:`<p class="k">About this capstone <span class="draft">Draft wording</span></p>
    <p class="t">Each student in this capstone built an Interactive Poster. It opens with one claim about a skill the student can show, then the work behind it, a decision they made, and an obstacle they met.</p>
    <p class="t">Students present at their own laptops. Each table on your route shows a different area of work.</p>`});
  /* 1. who the student is, and what they did */
  P.push({who:1,pre:`<header class="hero">${LOGO_WHITE}${photo(s,f)}
      <div><p class="k">${mine?"You are here for":esc(area(s))}</p><h1 class="name${s.name.length>18?" long":""}">${esc(s.name)}</h1>
        ${s.room!=null?`<div class="pills"><span class="pill">Room ${esc(s.room)}</span>${s.table!=null?`<span class="pill o">Table ${esc(s.table)}</span>`:""}</div>`
          :PLACE_HOLDER?`<div class="pills"><span class="pill">Room ${PLACE_HOLDER.room}</span><span class="pill o">Table ${PLACE_HOLDER.table}</span></div>`:""}</div></header>`,
    h:`<p class="k">${fam?"What "+f+" did":"The project"}</p>${fam?"":`<p class="proj">${esc(s.project)}</p>`}<p class="t">${esc(fam?s.plain:s.desc)}</p>
    <p class="made">Drafted by AI from ${f}'s Interactive Poster. ${s.approved?`Read and approved by ${f}.`:`${f} has not approved this page yet.`}</p>
    ${st.stamps[s.id]?`<span class="visited" role="img" aria-label="You stamped your visit to ${f}">${stamp(s.id,false,false)}</span>`:""}`});
  /* 2. what it shows, and what to ask */
  P.push({h:`${s.claim?`<section class="claimbox"><p class="k">${fam?"What this shows about "+f:f+"'s claim"}</p><p class="claim">${esc(s.claim)}</p></section>`:""}
    <p class="k">${q.length>1?"Questions you can ask "+f:"A question to ask "+f}</p><ul class="asks">${q.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`});
  /* 3. stamp, then who to visit next */
  const ts=st.stamps[s.id], nx=nextTwo(s.id);
  P.push({top:1,h:`<p class="k">Stamp your visit</p>
    <div class="stampzone"><button class="target${ts?" done":""}" type="button" data-stamp="${s.id}" aria-pressed="${!!ts}">${ts?stamp(s.id,false,justStamped===s.id):"Tap to stamp your visit"}</button>
      <p>${ts?`<b>Stamped ${new Date(ts).toLocaleDateString("en-US",{month:"short",day:"numeric"})}</b>Tap the stamp to undo.`:`${place(s)?`<b>${place(s)}</b>`:""}Stamp your passport when you have visited ${f}.`}</p></div>
    ${s.poster||s.linkedin?`<div class="two${s.poster&&s.linkedin?"":" solo"}">${s.poster?`<a class="btn" href="${esc(s.poster)}" target="_blank" rel="noopener" aria-label="${f}'s Interactive Poster">Interactive Poster</a>`:""}${s.linkedin?`<a class="btn ghost" href="${esc(s.linkedin)}" target="_blank" rel="noopener" aria-label="${f} on LinkedIn">LinkedIn</a>`:""}</div>`:""}
    ${nx.length?`<p class="k" style="margin-top:4px">Visit next</p><ul class="rows">${nextRows(nx)}</ul>`:`<p class="muted">You have seen every student.</p>`}
    ${footLinks()}`});
  return P;
}
function show(id){
  const s=byId(id); if(shown!==id){ pg=0; shown=id; }
  st.cur=id; if(!st.seen.includes(id)) st.seen.push(id); save();
  const P=pages(s); pg=Math.max(0,Math.min(pg,P.length-1));
  const p=P[pg], last=pg===P.length-1, nx=last?nextTwo(id)[0]:null;
  const bars=`<div class="prog" role="img" aria-label="Screen ${pg+1} of ${P.length}">${P.map((_,i)=>`<i class="${i<=pg?"on":""}"></i>`).join("")}</div>`;
  const x=`<button class="x" type="button" data-go="all" aria-label="Close and see all students">×</button>`;
  const draft=s.approved?"":`<span class="draftnote">Draft. ${esc(s.first)} has not approved this page yet.</span>`;
  const top=pg===0||p.who?`${bars}<div class="bar"><span class="id">${draft}</span>${x}</div>`
    :`${bars}<div class="bar"><span class="av" aria-hidden="true">${esc(ini(s))}</span><span class="id">${esc(s.name)}<small>${esc(place(s)||area(s))}</small></span>${x}</div>`;
  document.body.classList.add("pg");
  view.innerHTML=`<div class="pager"><article class="sheet">
    <div class="top">${top}</div>
    <div class="slide">${p.pre||""}<div class="one${p.top?" fromtop":""}">${p.h}</div></div>
    <div class="nav"><button class="back" type="button" data-turn="-1"${pg===0?" hidden":""}>Back</button>
      ${last?(nx?`<button type="button" data-go="${nx.id}">Next: ${esc(nx.first)}</button>`:""):`<button type="button" data-turn="1">Next</button>`}</div>
  </article></div>`;
  justStamped=null;
}

/* ---------- all students ---------- */
function all(){
  view.innerHTML=`<div class="wrap"><h1 class="h-q">All ${S.length} students</h1>
    <input class="search" id="q" type="search" placeholder="Name or project" autocomplete="off" aria-label="Search students">
    <ul class="rows" id="allrows"></ul>${footLinks()}</div>`;
  const inp=document.getElementById("q"); const draw=()=>{ const t=norm(inp.value.trim());
    document.getElementById("allrows").innerHTML=S.filter(s=>norm(s.name+" "+s.project+" "+area(s)).includes(t)).map(s=>`<li><button class="row" type="button" data-go="${s.id}"><span class="av">${esc(ini(s))}</span><span><span class="nm">${esc(s.name)}</span>${st.stamps[s.id]?`<span class="tag">Stamped</span>`:""}<br><span class="pj">${esc(s.project)}</span></span>${whereCell(s)}</button></li>`).join("")||`<li class="muted">No one matches that yet. Try part of a name.</li>`; };
  inp.addEventListener("input",draw); draw();
}

/* ---------- my passport ---------- */
function my(){
  const n=stampCount(), stamped=S.filter(s=>st.stamps[s.id]);
  const groups=hasRooms?[...new Set(S.map(s=>s.room))].map(r=>({title:r!=null?"Room "+r:"Room to come",list:S.filter(s=>s.room===r)}))
    :[...new Set(S.map(s=>s.cat))].map(c=>({title:CATS[c]||"Students",list:S.filter(s=>s.cat===c)}));
  view.innerHTML=`<div class="wrap"><h1 class="h-q">My passport</h1>
    <p class="muted">This is kept on your phone only. Nothing is shared unless you press the button below.</p>
    <div class="cover"><span class="otter" role="img" aria-label="Otter mark"></span><b>PASSPORT</b><span>Capstone Festival · December 2026</span><small>${st.role?esc(ROLES[st.role].label):"Visitor"}</small></div>
    <p><b>${n} of ${S.length} stamps.</b> <span class="muted">Tap a circle to open that student.</span></p>
    ${groups.map(g=>`<h2 class="room">${esc(g.title)}</h2><div class="grid">${g.list.map(s=>`<button class="slot" type="button" data-go="${s.id}" aria-label="${esc(s.name)}${s.table!=null?", table "+s.table:""}${st.stamps[s.id]?", stamped":""}">
      <span class="ring${st.stamps[s.id]?" done":""}">${st.stamps[s.id]?stamp(s.id,true,false):(s.table!=null?"Table "+s.table:esc(ini(s)))}</span><em>${esc(s.first)}</em></button>`).join("")}</div>`).join("")}
    <div class="panel"><h2 class="label" style="margin:0">Share my visit with the organizers</h2>
      <label class="check" for="c-did"><input type="checkbox" id="c-did" checked><span>What I did: who I am here as, and which students I visited</span></label>
      <label class="check" for="c-name"><input type="checkbox" id="c-name"><span>My name</span></label>
      <input class="search" id="v-name" type="text" placeholder="Your name" hidden aria-label="Your name">
      <label for="v-note" class="muted">One thing you will remember from today (optional)</label>
      <textarea id="v-note"></textarea>
      <button class="btn" type="button" id="share">${SHARE_URL?"Share with the organizers":"Show what would be shared"}</button>
      <pre class="out" id="out" hidden></pre></div>
    <p class="foot"><button class="link" type="button" data-go="route">Back</button>
      <button class="link" type="button" data-go="all">All students</button>
      <button class="link" type="button" id="reset">Clear my answers and start over</button></p></div>`;
  const $=id=>document.getElementById(id);
  $("c-name").addEventListener("change",e=>{$("v-name").hidden=!e.target.checked;});
  $("share").addEventListener("click",async()=>{ const L=[], d={page:PAGE_ID};
    if($("c-did").checked){ d.visitor=st.role?ROLES[st.role].label:"not given"; d.visited=stamped.map(s=>s.name).join(", "); d.count=stamped.length;
      L.push("Visitor: "+d.visitor); L.push("Students visited (stamps): "+(d.visited||"none yet")); }
    const nm=$("v-name").value.trim(), note=$("v-note").value.trim();
    if($("c-name").checked&&nm){ d.name=nm; L.push("Name: "+nm); }
    if(note){ d.note=note; L.push("Comment: "+note); }
    const out=$("out"), btn=$("share"); out.hidden=false;
    if(!L.length){ out.textContent="Nothing is selected, so there is nothing to share."; return; }
    if(!SHARE_URL){ out.textContent=L.join("\n")+"\n\nPreview: nothing was sent. On the festival page this goes to the organizers' spreadsheet."; return; }
    btn.disabled=true; btn.textContent="Sending…"; out.textContent=L.join("\n");
    try{ const r=await fetch(SHARE_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(d)});
      const j=await r.json(); if(!j||!j.ok) throw new Error("not accepted");
      out.textContent=L.join("\n")+"\n\nSent to the festival organizers. Thank you."; btn.textContent="Shared"; }
    catch(e){ out.textContent=L.join("\n")+"\n\nThis did not go through. Check your connection and try again."; btn.disabled=false; btn.textContent="Share with the organizers"; }
  });
  $("reset").addEventListener("click",()=>{ st=fresh(); shown=null; save(); go("start"); });
}

/* ---------- events ---------- */
function turn(d){ if(!document.body.classList.contains("pg")||!shown) return; const n=pages(byId(shown)).length;
  const to=pg+d; if(to<0||to>n-1) return; pg=to; show(shown); }
document.addEventListener("click",e=>{
  const b=e.target.closest("button");
  if(!b){ /* a tap on the screen itself moves on; a tap on the left third goes back */
    const sl=e.target.closest(".slide"); if(!sl||e.target.closest("a,input,label,textarea")) return;
    const r=sl.getBoundingClientRect(); return turn(e.clientX-r.left<r.width*.3?-1:1); }
  if(b.dataset.turn) return turn(Number(b.dataset.turn));
  if(b.dataset.role){ st.role=b.dataset.role; st.sub=null; st.route=[]; st.seen=[]; st.cur=null; shown=null; save(); return go("ask"); }
  if(b.dataset.sub){ st.sub=b.dataset.sub; buildRoute(); st.seen=[]; shown=null; return go(st.route[0]); }
  if(b.dataset.stamp){ const id=b.dataset.stamp; if(st.stamps[id]) delete st.stamps[id]; else { st.stamps[id]=Date.now(); justStamped=id; } save(); return show(id); }
  if(b.dataset.go){ if(b.dataset.reset){ st.role=null; st.sub=null; st.route=[]; st.seen=[]; st.cur=null; shown=null; save(); } return go(b.dataset.go); }
});
document.addEventListener("keydown",e=>{
  if(e.target.closest("input,textarea")) return;
  if(e.key==="ArrowRight") turn(1); else if(e.key==="ArrowLeft") turn(-1);
});
window.addEventListener("hashchange",render);
render();
</script>
</body>
</html>
