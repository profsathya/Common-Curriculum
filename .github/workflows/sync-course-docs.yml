name: Sync course context docs

# Each course doc has two tabs, Course and Dojo, written independently.
# A push syncs only the tabs whose source actually changed: editing a course
# page rewrites that course's Course tab, and editing a dojo file rewrites the
# Dojo tab in every course doc.

on:
  push:
    branches: [main]
    paths:
      - "*/**.html"
      - "common/dojo/dojo-*.txt"
      - "config/course-docs.json"
      - "scripts/build_course_context.py"
      - ".github/workflows/sync-course-docs.yml"
  workflow_dispatch:
    inputs:
      course:
        description: "Course folder to sync (blank = every configured course)"
        required: false
        default: ""
      section:
        description: "Which tab to sync"
        required: false
        default: "all"
        type: choice
        options: ["all", "course", "dojo"]

permissions:
  contents: read

jobs:
  sync:
    name: Sync course context docs
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install beautifulsoup4

      - name: Work out which tabs to sync
        id: jobs
        env:
          MANUAL_COURSE: ${{ github.event.inputs.course }}
          MANUAL_SECTION: ${{ github.event.inputs.section }}
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, subprocess

          with open("config/course-docs.json", encoding="utf-8") as fh:
              config = json.load(fh)
          configured = sorted(config["courses"])
          dojo_dir = config["dojo"]["source_dir"]

          manual_course = (os.environ.get("MANUAL_COURSE") or "").strip()
          manual_section = (os.environ.get("MANUAL_SECTION") or "all").strip() or "all"
          dispatched = os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch"

          jobs = []
          if dispatched:
              courses = [manual_course] if manual_course else configured
              courses = [c for c in courses if c in configured]
              sections = ["course", "dojo"] if manual_section == "all" else [manual_section]
              jobs = [(c, s) for c in courses for s in sections]
          else:
              diff = subprocess.run(
                  ["git", "diff", "--name-only", "HEAD^", "HEAD"],
                  capture_output=True, text=True, check=False,
              ).stdout.split()

              # A change to the builder or the config re-syncs both tabs everywhere.
              infra = {"config/course-docs.json", "scripts/build_course_context.py"}
              if infra & set(diff):
                  jobs = [(c, s) for c in configured for s in ("course", "dojo")]
              else:
                  touched = {p.split("/")[0] for p in diff if "/" in p}
                  for course in configured:
                      if course in touched:
                          jobs.append((course, "course"))
                  # Any dojo file changing refreshes the Dojo tab in every doc.
                  if any(p.startswith(dojo_dir + "/")
                         and os.path.basename(p).startswith("dojo-")
                         and p.endswith(".txt")
                         for p in diff):
                      jobs += [(c, "dojo") for c in configured]

          # Deduplicate, keep a stable order.
          seen, ordered = set(), []
          for job in jobs:
              if job not in seen:
                  seen.add(job)
                  ordered.append(job)

          print("list=" + " ".join(f"{c}:{s}" for c, s in ordered))
          print("count=" + str(len(ordered)))
          PY

      - name: Sync each tab
        if: steps.jobs.outputs.count != '0'
        env:
          COURSE_DOC_SYNC_URL: ${{ secrets.COURSE_DOC_SYNC_URL }}
          COURSE_DOC_SYNC_TOKEN: ${{ secrets.COURSE_DOC_SYNC_TOKEN }}
          JOBS: ${{ steps.jobs.outputs.list }}
        run: |
          set -euo pipefail

          if [ -z "${COURSE_DOC_SYNC_URL:-}" ]; then
            echo "::error::Missing repository secret COURSE_DOC_SYNC_URL."
            exit 1
          fi
          if [ -z "${COURSE_DOC_SYNC_TOKEN:-}" ]; then
            echo "::error::Missing repository secret COURSE_DOC_SYNC_TOKEN."
            exit 1
          fi

          # The Apps Script endpoint handles one request at a time. A large
          # write can still be running when the next request arrives, and
          # Google answers 404 rather than queueing it. So: pause between
          # requests, and retry one that comes back unhappy.
          COOLDOWN=20
          ATTEMPTS=3

          cat > sign_payload.py <<'PY'
          import json, os, sys
          stem = sys.argv[1]
          with open(f"payload-{stem}.json", encoding="utf-8") as fh:
              payload = json.load(fh)
          payload["token"] = os.environ["COURSE_DOC_SYNC_TOKEN"]
          with open(f"request-{stem}.json", "w", encoding="utf-8") as fh:
              json.dump(payload, fh, ensure_ascii=False, separators=(",", ":"))
          PY

          cat > check_response.py <<'PY'
          import json, sys
          stem = sys.argv[1]
          try:
              with open(f"response-{stem}.json", encoding="utf-8") as fh:
                  response = json.load(fh)
          except (OSError, json.JSONDecodeError) as exc:
              print(f"  response was not JSON: {exc}")
              sys.exit(1)
          if response.get("ok") is not True:
              safe = {k: v for k, v in response.items() if k.lower() not in {"token", "secret"}}
              print(f"  endpoint rejected the payload: {json.dumps(safe)}")
              sys.exit(1)
          tabs = ", ".join(response.get("tabs_written") or [])
          print(f"  {stem}: wrote tab(s) {tabs} — {response.get('page_count')} pages -> {response.get('document_id')}")
          PY

          failed=0
          first=1
          for job in $JOBS; do
            course="${job%%:*}"
            section="${job##*:}"
            stem="$course-$section"
            echo "::group::$course — $section tab"

            if [ "$first" -eq 0 ]; then
              echo "  waiting ${COOLDOWN}s so the previous write can finish"
              sleep "$COOLDOWN"
            fi
            first=0

            python3 scripts/build_course_context.py "$course" --section "$section" --output "payload-$stem.json"
            python3 sign_payload.py "$stem"

            synced=0
            for attempt in $(seq 1 "$ATTEMPTS"); do
              code="$(curl --silent --show-error --location \
                --output "response-$stem.json" \
                --write-out "%{http_code}" \
                --header "Content-Type: application/json" \
                --data @"request-$stem.json" \
                "$COURSE_DOC_SYNC_URL" || echo 000)"

              if [ "$code" -ge 200 ] && [ "$code" -lt 300 ] && python3 check_response.py "$stem"; then
                synced=1
                break
              fi

              if [ "$attempt" -lt "$ATTEMPTS" ]; then
                echo "  attempt $attempt returned HTTP $code — retrying in ${COOLDOWN}s"
                sleep "$COOLDOWN"
              else
                echo "::error::$stem — still failing after $ATTEMPTS attempts (last HTTP $code)."
              fi
            done

            rm -f "request-$stem.json"
            [ "$synced" -eq 1 ] || failed=1
            echo "::endgroup::"
          done

          exit "$failed"
