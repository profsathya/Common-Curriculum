name: Sync course context docs

# Rebuilds one Google Doc per course whenever that course's pages change.
# Only the courses that actually changed in the push get synced.

on:
  push:
    branches: [main]
    paths:
      - "*/**.html"
      - "config/course-docs.json"
      - "scripts/build_course_context.py"
      - ".github/workflows/sync-course-docs.yml"
  workflow_dispatch:
    inputs:
      course:
        description: "Course folder to sync (blank = every configured course)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  sync:
    name: Sync course context docs
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install beautifulsoup4

      - name: Work out which courses to sync
        id: courses
        env:
          MANUAL_COURSE: ${{ github.event.inputs.course }}
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, subprocess

          with open("config/course-docs.json", encoding="utf-8") as fh:
              configured = set(json.load(fh)["courses"])

          manual = (os.environ.get("MANUAL_COURSE") or "").strip()
          if manual:
              selected = sorted(configured & {manual})
          elif os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch":
              selected = sorted(configured)
          else:
              diff = subprocess.run(
                  ["git", "diff", "--name-only", "HEAD^", "HEAD"],
                  capture_output=True, text=True, check=False,
              ).stdout.split()
              touched = {p.split("/")[0] for p in diff if "/" in p}
              # A change to the builder or the config re-syncs everything.
              infra = {"config/course-docs.json", "scripts/build_course_context.py"}
              selected = sorted(configured) if infra & set(diff) else sorted(configured & touched)

          print("list=" + json.dumps(selected))
          print("count=" + str(len(selected)))
          PY

      - name: Sync each course
        if: steps.courses.outputs.count != '0'
        env:
          COURSE_DOC_SYNC_URL: ${{ secrets.COURSE_DOC_SYNC_URL }}
          COURSE_DOC_SYNC_TOKEN: ${{ secrets.COURSE_DOC_SYNC_TOKEN }}
          COURSES: ${{ steps.courses.outputs.list }}
        run: |
          set -euo pipefail

          if [ -z "${COURSE_DOC_SYNC_URL:-}" ]; then
            echo "::error::Missing repository secret COURSE_DOC_SYNC_URL."
            exit 1
          fi
          if [ -z "${COURSE_DOC_SYNC_TOKEN:-}" ]; then
            echo "::error::Missing repository secret COURSE_DOC_SYNC_TOKEN."
            exit 1
          fi

          # The Apps Script endpoint handles one request at a time. A large
          # course can still be writing when the next request arrives, and
          # Google answers 404 rather than queueing it. So: pause between
          # courses, and retry a course that comes back unhappy.
          COOLDOWN=20
          ATTEMPTS=3

          cat > sign_payload.py <<'PY'
          import json, os, sys
          course = sys.argv[1]
          with open(f"payload-{course}.json", encoding="utf-8") as fh:
              payload = json.load(fh)
          payload["token"] = os.environ["COURSE_DOC_SYNC_TOKEN"]
          with open(f"request-{course}.json", "w", encoding="utf-8") as fh:
              json.dump(payload, fh, ensure_ascii=False, separators=(",", ":"))
          PY

          cat > check_response.py <<'PY'
          import json, sys
          course = sys.argv[1]
          try:
              with open(f"response-{course}.json", encoding="utf-8") as fh:
                  response = json.load(fh)
          except (OSError, json.JSONDecodeError) as exc:
              print(f"  response was not JSON: {exc}")
              sys.exit(1)
          if response.get("ok") is not True:
              safe = {k: v for k, v in response.items() if k.lower() not in {"token", "secret"}}
              print(f"  endpoint rejected the payload: {json.dumps(safe)}")
              sys.exit(1)
          print(f"  {course}: {response.get('page_count')} pages -> {response.get('document_id')}")
          PY

          failed=0
          first=1
          for course in $(python -c 'import json,os; print(" ".join(json.loads(os.environ["COURSES"])))'); do
            echo "::group::$course"

            if [ "$first" -eq 0 ]; then
              echo "  waiting ${COOLDOWN}s so the previous write can finish"
              sleep "$COOLDOWN"
            fi
            first=0

            python3 scripts/build_course_context.py "$course" --output "payload-$course.json"
            python3 sign_payload.py "$course"

            synced=0
            for attempt in $(seq 1 "$ATTEMPTS"); do
              code="$(curl --silent --show-error --location \
                --output "response-$course.json" \
                --write-out "%{http_code}" \
                --header "Content-Type: application/json" \
                --data @"request-$course.json" \
                "$COURSE_DOC_SYNC_URL" || echo 000)"

              if [ "$code" -ge 200 ] && [ "$code" -lt 300 ] && python3 check_response.py "$course"; then
                synced=1
                break
              fi

              if [ "$attempt" -lt "$ATTEMPTS" ]; then
                echo "  attempt $attempt returned HTTP $code — retrying in ${COOLDOWN}s"
                sleep "$COOLDOWN"
              else
                echo "::error::$course — still failing after $ATTEMPTS attempts (last HTTP $code)."
              fi
            done

            rm -f "request-$course.json"
            [ "$synced" -eq 1 ] || failed=1
            echo "::endgroup::"
          done

          exit "$failed"
